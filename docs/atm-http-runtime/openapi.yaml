openapi: 3.1.0
info:
  title: ATM daemon API
  version: 1.16.0
  description: HTTP contract shared by local UDS and future peer HTTPS adapters.
servers:
  - url: /v1/atm
paths:
  /messages/search:
    get:
      operationId: searchMessages
      description: Local-only typed search. Peer-authenticated callers are rejected before storage selection.
      parameters:
        - name: request
          in: query
          required: true
          description: Unpadded URL-safe base64 encoding of the JSON SearchRequest contract.
          schema: { type: string, format: base64url }
      responses:
        '200': { description: Local typed search result, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResponse' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /messages:
    get:
      operationId: listMessages
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ListQuery' } } } }
      parameters:
        - $ref: '#/components/parameters/Agent'
        - $ref: '#/components/parameters/ChatId'
      responses:
        '200':
          description: Messages. A task-ledger list or events query answers HookActions instead when a task hook handled the command; the body then counts the actions and X-ATM-Hook-Actions carries the same count.
          headers:
            X-ATM-Hook-Actions:
              description: Decimal count of hook actions dispatched; present only when the body is HookActions.
              schema: { type: string }
          content: { application/json: { schema: { $ref: '#/components/schemas/ListOutcome' } } }
        default: { $ref: '#/components/responses/AtmError' }
    post:
      operationId: writeMessage
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WriteRequest' } } } }
      responses:
        '200':
          description: A task hook handled the command and its actions ran in order; the body counts them. Added in HTTP API 1.13.0.
          headers:
            X-ATM-Hook-Actions:
              description: Decimal count of hook actions dispatched; equals HookActions.dispatched.
              schema: { type: string }
          content: { application/json: { schema: { $ref: '#/components/schemas/HookActions' } } }
        '201': { description: Created message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        default: { $ref: '#/components/responses/AtmError' }
    delete:
      operationId: clearMessages
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClearQuery' } } } }
      responses:
        '204':
          description: Cleared; no response body.
          headers:
            X-ATM-Clear-Outcome:
              description: Base64url-encoded clear result for CLI rendering.
              schema: { type: string }
        default: { $ref: '#/components/responses/AtmError' }
  /messages/inspect:
    post:
      operationId: inspectMessages
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PeekQuery' } } } }
      responses:
        '200': { description: Messages, content: { application/json: { schema: { $ref: '#/components/schemas/ReadOutcome' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /messages/read:
    post:
      operationId: readMessages
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReadQuery' } } } }
      responses:
        '200': { description: Messages, content: { application/json: { schema: { $ref: '#/components/schemas/ReadOutcome' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /doctor:
    get:
      operationId: doctor
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/DoctorQuery' } } } }
      responses:
        '200': { description: Daemon health, content: { application/json: { schema: { $ref: '#/components/schemas/DoctorResponse' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /compatibility:
    post:
      operationId: compatibilityPreflight
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompatibilityPreflight' } } } }
      responses:
        '200': { description: Compatibility verdict, content: { application/json: { schema: { $ref: '#/components/schemas/CompatibilityVerdict' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /heartbeat:
    post:
      operationId: teamMemberHeartbeat
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatRequest' } } } }
      responses:
        '200': { description: Heartbeat result, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatResponse' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /queue/get-next:
    post:
      operationId: getNextBareCliQueueMessages
      description: Local-ingress-only FIFO pull for the authenticated caller's member.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QueueGetNextRequest' } } } }
      responses:
        '200': { description: Queue messages, content: { application/json: { schema: { $ref: '#/components/schemas/QueueGetNextResponse' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /tasks/move:
    post:
      operationId: moveTask
      description: Local-ingress-only reorder of an open task in its assignee's queue.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskMoveRequest' } } } }
      responses:
        '200':
          description: Task move result. When a task hook handled the move, the body is HookActions instead; it counts the actions and X-ATM-Hook-Actions carries the same count.
          headers:
            X-ATM-Hook-Actions:
              description: Decimal count of hook actions dispatched; present only when the body is HookActions.
              schema: { type: string }
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskMoveOutcome' } } }
        default: { $ref: '#/components/responses/AtmError' }
  /graft/receiver/register:
    post:
      operationId: registerGraftReceiver
      description: Local-ingress-only registration of the current agent's graft receiver endpoint.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GraftReceiverRegistration' } } } }
      responses:
        '200': { description: Receiver registration accepted, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /graft/receiver/refresh:
    post:
      operationId: refreshGraftReceiver
      description: Local-ingress-only owner-checked liveness keepalive for the current agent's graft receiver lease; rejected with a NotOwner error when another generation now owns the stored lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GraftReceiverRefreshRequest' } } } }
      responses:
        '200': { description: Receiver lease refreshed, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /graft/receiver/unregister:
    post:
      operationId: unregisterGraftReceiver
      description: Local-ingress-only removal of the current agent's graft receiver registration.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GraftReceiverUnregistration' } } } }
      responses:
        '200': { description: Receiver registration removed, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /graft/receiver/lookup:
    post:
      operationId: lookupGraftReceiver
      description: Local-ingress-only lookup of a registered graft receiver lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GraftReceiverLookupRequest' } } } }
      responses:
        '200': { description: Receiver lease when registered, content: { application/json: { schema: { nullable: true, $ref: '#/components/schemas/GraftReceiverLease' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /runtime/reload:
    post:
      operationId: reloadRuntimeView
      requestBody: { required: true, content: { application/json: { schema: { type: 'null' } } } }
      responses:
        '200': { description: Runtime view reloaded, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /tool-senders:
    x-atm-contract-status: planned
    x-atm-target-http-api-version: 1.17.0
    post:
      operationId: applyToolSenderRegistration
      description: Planned local-only installer registration or runtime-key rotation. Peer ingress is refused. This frozen additive contract is targeted for HTTP API 1.17.0; BK-14 owns endpoint execution and the previous-consumer proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ToolInstallerRequest'
                - type: object
                  properties:
                    operation: { enum: [register, rotate] }
      responses:
        '200': { description: Registration or rotation receipt, content: { application/json: { schema: { $ref: '#/components/schemas/ToolInstallReceipt' } } } }
        default: { $ref: '#/components/responses/AtmError' }
    delete:
      operationId: unregisterToolSender
      description: Planned local-only installer-authorized unregistration. Peer ingress is refused. This frozen additive contract is targeted for HTTP API 1.17.0; BK-14 owns endpoint execution and the previous-consumer proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ToolInstallerRequest'
                - type: object
                  properties:
                    operation: { const: unregister }
      responses:
        '200': { description: Unregistration receipt, content: { application/json: { schema: { $ref: '#/components/schemas/ToolInstallReceipt' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /hooks/register:
    post:
      operationId: registerHook
      description: Local-ingress-only registration of one task hook for a phase. Peer callers are refused. Added in HTTP API 1.13.0.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HookRegisterRequest' } } } }
      responses:
        '200': { description: The stored registration, content: { application/json: { schema: { $ref: '#/components/schemas/HookRegistration' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /hooks/disable:
    post:
      operationId: disableHooks
      description: Local-ingress-only disable of a phase's hooks, one named hook or all of them. Rows are kept. Added in HTTP API 1.13.0.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HookDisableRequest' } } } }
      responses:
        '200': { description: The disabled rows, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HookRegistration' } } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /hooks/list:
    post:
      operationId: listHooks
      description: Local-ingress-only list of hook registrations, active and disabled. Added in HTTP API 1.13.0.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HookListQuery' } } } }
      responses:
        '200': { description: Hook registrations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HookRegistration' } } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /cron/start:
    post:
      operationId: startCron
      description: Local-ingress-only start of one cron schedule. Peer callers are refused. Added in HTTP API 1.13.0.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CronStartRequest' } } } }
      responses:
        '200': { description: The stored schedule, content: { application/json: { schema: { $ref: '#/components/schemas/CronSchedule' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /cron/end:
    post:
      operationId: endCron
      description: Local-ingress-only end of a phase's cron schedules, one named schedule or all of them. Added in HTTP API 1.13.0.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CronEndRequest' } } } }
      responses:
        '200': { description: The ended schedules, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CronSchedule' } } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /cron/list:
    post:
      operationId: listCron
      description: Local-ingress-only list of cron schedules. Added in HTTP API 1.13.0.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CronListQuery' } } } }
      responses:
        '200': { description: Cron schedules, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CronSchedule' } } } } }
        default: { $ref: '#/components/responses/AtmError' }
components:
  parameters:
    Agent: { name: agent, in: query, schema: { type: string } }
    ChatId: { name: chat_id, in: query, schema: { type: string } }
    Peer: { name: peer, in: path, required: true, schema: { type: string } }
  responses:
    AtmError:
      description: ATM error
      content: { application/json: { schema: { $ref: '#/components/schemas/AtmError' } } }
  schemas:
    AgentAddress:
      type: object
      required: [agent, team]
      properties:
        agent: { type: string }
        chat_id: { type: string }
        team: { type: string }
        host: { type: string }
    WriteRequest:
      type: object
      required: [message_id, from, to, body]
      properties:
        message_id: { type: string }
        from: { $ref: '#/components/schemas/AgentAddress' }
        to: { $ref: '#/components/schemas/AgentAddress' }
        body: { type: string }
        requires_ack: { type: boolean }
        acknowledges_message_id: { type: string }
        peer_http_api_version:
          type: string
          description: Optional cross-host wire API version. Receivers reject only a major-version mismatch.
        peer_wire_security:
          type: string
          enum: [mtls, plaintext-test]
          description: Optional cross-host peer-wire security mode. Omitted values default to the receiver's established connector mode for compatibility; peer ingress rejects a mode mismatch before dispatch.
        tool_runtime_proof:
          $ref: '#/components/schemas/ToolRuntimeProof'
          description: Planned optional signed provenance for a registered plug-in sender; required for virtual plug-in writes when HTTP API 1.17.0 is implemented.
          x-atm-target-http-api-version: 1.17.0
        tool_sender_attestation:
          $ref: '#/components/schemas/ToolSenderAttestation'
          description: Planned origin-daemon proof for forwarding a registered plug-in message across a peer link; required for virtual plug-in peer writes when HTTP API 1.17.0 is implemented.
          x-atm-target-http-api-version: 1.17.0
    ToolInstallerRequest:
      type: object
      description: Signed installer envelope. Canonical signing bytes use ATM-TOOL-INSTALL-v1 and the field order recorded in ADR-066; signature is excluded from signing input.
      required: [schema_version, operation, installer_id, installer_key_id, sender, package_digest, registration_generation, host_id, runtime_key_id, runtime_public_key, nonce, issued_at, expires_at, signature]
      properties:
        schema_version: { type: string, const: '1.0.0' }
        operation: { type: string, enum: [register, rotate, unregister] }
        installer_id: { type: string, minLength: 1 }
        installer_key_id: { type: string, minLength: 1 }
        sender: { type: string, minLength: 1, description: Registered plug-in sender identity in the reserved virtual tool namespace. }
        package_digest: { type: string, minLength: 1 }
        registration_generation: { type: integer, format: uint64, minimum: 0 }
        host_id: { type: string, minLength: 1 }
        runtime_key_id: { type: string, minLength: 1 }
        runtime_public_key: { type: string, minLength: 1 }
        previous_runtime_key_id: { type: string, minLength: 1, description: Required by rotation semantics and omitted for register or unregister. }
        nonce: { type: string, minLength: 1 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        signature: { type: string, minLength: 1, description: Opaque installer signature; excluded from canonical signing bytes. }
    ToolRuntimeProof:
      type: object
      description: Signed provenance for one canonical message write. Canonical signing bytes use ATM-TOOL-MESSAGE-v1 and the field order recorded in ADR-066; signature is excluded from signing input.
      required: [runtime_key_id, sender, registration_generation, host_id, message_id, message_digest, nonce, signature]
      properties:
        runtime_key_id: { type: string, minLength: 1 }
        sender: { type: string, minLength: 1 }
        registration_generation: { type: integer, format: uint64, minimum: 0 }
        host_id: { type: string, minLength: 1 }
        message_id: { type: string, minLength: 1 }
        message_digest: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
        signature: { type: string, minLength: 1, description: Opaque runtime signature; excluded from canonical signing bytes. }
    ToolSenderAttestation:
      type: object
      description: Origin-daemon proof for one admitted message forwarded across a peer link. Canonical signing bytes use ATM-TOOL-PEER-v1 and the field order recorded in ADR-066; signature is excluded from signing input.
      required: [sender, registration_generation, host_id, message_id, message_digest, nonce, signature]
      properties:
        sender: { type: string, minLength: 1 }
        registration_generation: { type: integer, format: uint64, minimum: 0 }
        host_id: { type: string, minLength: 1 }
        message_id: { type: string, minLength: 1 }
        message_digest: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
        signature: { type: string, minLength: 1, description: Opaque origin-daemon signature; excluded from canonical signing bytes. }
    ToolInstallReceipt:
      type: object
      required: [sender, registration_generation, applied_at]
      properties:
        sender: { type: string, minLength: 1 }
        registration_generation: { type: integer, format: uint64, minimum: 0 }
        applied_at: { type: string, format: date-time }
    PeekQuery:
      type: object
      description: Canonical inspect query; fields are validated by the daemon.
    ReadQuery:
      type: object
      description: Canonical read query; fields are validated by the daemon.
    ClearQuery:
      type: object
      description: Canonical clear query; fields are validated by the daemon.
    ListQuery:
      type: object
      description: Canonical list query; fields are validated by the daemon.
    DoctorQuery:
      type: object
      description: Doctor query. Authenticated peer ingress checks optional compatibility metadata before dispatch.
      properties:
        peer_http_api_version:
          type: string
          description: Optional cross-host wire API version. Receivers reject only a major-version mismatch.
        peer_wire_security:
          type: string
          enum: [mtls, plaintext-test]
          description: Optional cross-host peer-wire security mode. Omitted values default to the receiver's established connector mode for compatibility; authenticated peer ingress rejects a mode mismatch before dispatch.
    DoctorResponse:
      type: object
      description: Doctor report. Herdr endpoint presence entries identify both the canonical roster name and the effective Herdr agent name.
      properties:
        herdr:
          $ref: '#/components/schemas/HerdrDoctorReport'
        runtime_status:
          $ref: '#/components/schemas/RuntimeStatusSnapshot'
          description: Optional projection of the daemon's canonical ephemeral master-roster state; added in HTTP API 1.4.0.
        observability:
          $ref: '#/components/schemas/AtmObservabilityHealth'
        hooks:
          type: array
          description: Hook and cron rows grouped by module, cwd, team and phase; added in HTTP API 1.13.0. Absent means the reporting daemon predates hooks.
          items: { $ref: '#/components/schemas/HookDoctorEntry' }
    AtmObservabilityHealth:
      type: object
      description: Retained observability health. Only the fields added since HTTP API 1.11.0 are listed here.
      properties:
        export:
          $ref: '#/components/schemas/AtmTelemetryExportHealth'
          description: Optional OpenTelemetry export health; added in HTTP API 1.11.0. Absent means the reporting daemon predates export health.
    AtmTelemetryExportHealth:
      type: object
      required: [state, emitted, dropped_full, dropped_timeout, dropped_failure, dropped_shutdown]
      properties:
        state: { type: string, enum: [inert, healthy, degraded, unavailable] }
        endpoint: { type: string, nullable: true, description: Validated collector endpoint; never carries credentials. }
        protocol: { type: string, enum: [grpc], nullable: true }
        emitted: { type: integer, format: uint64 }
        dropped_full: { type: integer, format: uint64 }
        dropped_timeout: { type: integer, format: uint64 }
        dropped_failure: { type: integer, format: uint64 }
        dropped_shutdown: { type: integer, format: uint64 }
        last_failure: { type: string, enum: [config_invalid, unavailable, timed_out, shutdown_timed_out], nullable: true }
    RuntimeStatusSnapshot:
      type: object
      required: [liveness, readiness]
      properties:
        liveness: { type: string, enum: [running, unavailable] }
        readiness: { type: string, enum: [ready, degraded, unavailable] }
        detail: { type: string, nullable: true }
        singleton_owner_pid: { type: integer, format: uint32, nullable: true }
        degraded_ingest: { type: boolean, default: false }
        member_counts: { $ref: '#/components/schemas/RuntimeStatusCounts' }
        members:
          type: array
          items: { $ref: '#/components/schemas/RuntimeMemberObservation' }
        graft_queue_handoff_failures_total: { type: integer, format: uint64, default: 0 }
        graft_queue_marker_clear_failures_total: { type: integer, format: uint64, default: 0 }
        bare_cli_queue_full_drops_total: { type: integer, format: uint64, default: 0 }
        queue_marker_set_failures_total: { type: integer, format: uint64, default: 0 }
        herdr_queue_last_tick_at: { type: string, format: date-time, nullable: true }
        queue_messages_drained_total: { type: integer, format: uint64, default: 0 }
        queue_drain_failures_total: { type: integer, format: uint64, default: 0 }
        blocking_core_bridge_stalls_total: { type: integer, format: uint64, default: 0 }
        write_source_preflight_stalls_total: { type: integer, format: uint64, default: 0 }
    RuntimeStatusCounts:
      type: object
      required: [active_members, idle_members, offline_members, unknown_members]
      properties:
        active_members: { type: integer, format: uint64 }
        idle_members: { type: integer, format: uint64 }
        offline_members: { type: integer, format: uint64 }
        unknown_members: { type: integer, format: uint64 }
    RuntimeMemberObservation:
      type: object
      required: [team, member, state]
      properties:
        team: { type: string }
        member: { type: string }
        state: { type: string, enum: [unknown, identity_conflict, offline, idle, active, blocked] }
        revision: { type: integer, format: uint64, default: 0, description: Monotonic accepted-observation revision; added in HTTP API 1.4.0. }
        availability: { $ref: '#/components/schemas/RuntimeObservationAvailability', description: Freshness of the most recent accepted observation attempt; added in HTTP API 1.4.0. }
        last_observation_attempt_by: { $ref: '#/components/schemas/RuntimeObservationSource', nullable: true, description: Source of the latest accepted attempt; added in HTTP API 1.4.0. }
        last_observation_attempt_at: { type: string, format: date-time, nullable: true, description: Time of the latest accepted attempt; added in HTTP API 1.4.0. }
        last_observed_by: { $ref: '#/components/schemas/RuntimeObservationSource', nullable: true, description: Source of the latest successful observation; added in HTTP API 1.4.0. }
        last_observed_at: { type: string, format: date-time, nullable: true, description: Time of the latest successful observation; added in HTTP API 1.4.0. }
        session_id: { type: string, nullable: true }
        pid: { type: integer, format: uint32, nullable: true }
        last_active_at: { type: string, format: date-time, nullable: true }
        state_changed_by: { $ref: '#/components/schemas/RuntimeObservationSource', nullable: true }
        state_changed_at: { type: string, format: date-time, nullable: true }
        session_changed_by: { $ref: '#/components/schemas/RuntimeObservationSource', nullable: true }
        session_changed_at: { type: string, format: date-time, nullable: true }
    RuntimeObservationAvailability:
      type: string
      enum: [unobserved, fresh, unavailable]
      default: unobserved
    RuntimeObservationSource:
      type: string
      enum: [heartbeat, herdr_poll]
    HerdrDoctorReport:
      type: object
      properties:
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/HerdrEndpointDoctorReport' }
        breaker:
          $ref: '#/components/schemas/HerdrBreakerDoctorReport'
    HerdrBreakerDoctorReport:
      type: object
      properties:
        state: { type: string, enum: [closed, open] }
        retry_after_ms: { type: integer, format: uint64, nullable: true }
        consecutive_failures: { type: integer, format: uint32, nullable: true }
        last_error_code: { type: string, nullable: true, description: Last infrastructure error code; added in HTTP API 1.3.0. }
        last_error_detail: { type: string, nullable: true, description: Last infrastructure error detail; added in HTTP API 1.3.0. }
    HerdrEndpointDoctorReport:
      type: object
      properties:
        transport: { type: string, enum: [cli, socket], description: Transport used by the Herdr endpoint; added in HTTP API 1.2.0. }
        members:
          type: array
          items: { $ref: '#/components/schemas/HerdrMemberPresence' }
        findings:
          type: array
          description: Endpoint-wide target-resolution and named-session findings; added in HTTP API 1.3.0.
          items: { $ref: '#/components/schemas/DoctorFinding' }
    DoctorFinding:
      type: object
      description: Privacy-safe operator diagnostic.
      properties:
        severity: { type: string }
        code: { type: string, description: Stable ATM_* code; HTTP API 1.8.0 adds ATM_TASK_ALREADY_ACTIVE and 1.14.0 adds ATM_TASK_MAX_ACTIVE_REACHED. }
        message: { type: string }
        remediation: { type: string }
    HerdrMemberPresence:
      type: object
      required: [name, outcome]
      description: Herdr presence result. herdr_agent is the effective Herdr identity and was added in HTTP API 1.2.0.
      properties:
        name: { type: string, description: Canonical roster member name. }
        herdr_agent: { type: string, nullable: true, description: Effective Herdr agent name; nullable for backward-compatible v1.1 payloads; added in HTTP API 1.2.0. }
        outcome: { type: object, description: Presence probe outcome. }
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: object
          description: Public CLI/HTTP primitives compiled by atm-core into the bounded backend-neutral search query.
        lifecycle:
          $ref: '#/components/schemas/WorkflowProjectionRequest'
          description: Optional generic lifecycle projection over the bounded local search result.
    WorkflowSelector:
      type: object
      description: Partial exact selector; at least one selector field is required by the runtime.
      properties:
        state: { type: string }
        stage: { type: string }
        transition: { type: string }
    WorkflowTimeRange:
      type: object
      properties:
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
    WorkflowProjectionRequest:
      type: object
      required: [scope_kind, start, end]
      description: Generic one-to-one lifecycle pairing request carried by SearchRequest.lifecycle.
      properties:
        scope_kind: { type: string }
        scope_id: { type: string }
        start: { $ref: '#/components/schemas/WorkflowSelector' }
        end: { $ref: '#/components/schemas/WorkflowSelector' }
        time_range: { $ref: '#/components/schemas/WorkflowTimeRange' }
    SearchResponse:
      type: object
      required: [hits]
      properties:
        hits: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
        aggregate: { type: object }
        next_cursor: { type: string }
    SearchHit:
      type: object
      required: [key, message_at, from_agent, to_agent, snippet]
      properties:
        key: { type: object }
        message_id: { type: string }
        message_at: { type: string, format: date-time }
        from_agent: { $ref: '#/components/schemas/AgentAddress' }
        to_agent: { $ref: '#/components/schemas/AgentAddress' }
        template_type: { type: string }
        category: { type: string }
        snippet: { type: string }
    CompatibilityPreflight:
      type: object
      description: Client and daemon release compatibility request.
    CompatibilityVerdict:
      type: object
      description: Compatibility result.
    HeartbeatRequest:
      type: object
      description: Team-member heartbeat request.
    HeartbeatResponse:
      type: object
      description: Team-member heartbeat result.
    QueueGetNextRequest:
      type: object
      required: [team, member]
      properties:
        team: { type: string }
        member: { type: string }
    QueueGetNextResponse:
      type: object
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/QueuedNudgeMessage' } }
    TaskMoveRequest:
      type: object
      required: [caller_identity, caller_team, task_id, target]
      properties:
        caller_identity: { type: string }
        caller_team: { type: string }
        task_id: { type: string }
        target:
          oneOf:
            - type: object
              required: [to]
              properties:
                to: { type: string, enum: [head, end] }
            - type: object
              required: [to, task_id]
              properties:
                to: { type: string, enum: [before] }
                task_id: { type: string }
    TaskMoveOutcome:
      type: object
      required: [task_id, assignee, from, to]
      properties:
        task_id: { type: string }
        assignee: { type: string }
        from: { type: integer, minimum: 1 }
        to: { type: integer, minimum: 1 }
    QueuedNudgeMessage:
      type: object
      required: [kind, msg_id, body]
      properties:
        kind: { type: string, enum: [steer, queue] }
        msg_id: { type: string }
        body: { type: string }
    GraftReceiverRegistration:
      type: object
      required: [team, agent, endpoint, capability, owner_generation]
      properties:
        team: { type: string }
        agent: { type: string }
        endpoint: { type: string, format: uri }
        capability: { type: string, format: byte }
        owner_generation: { type: string }
    GraftReceiverUnregistration:
      type: object
      required: [team, agent, owner_generation]
      properties:
        team: { type: string }
        agent: { type: string }
        owner_generation: { type: string }
    GraftReceiverRefreshRequest:
      type: object
      required: [team, agent, owner_generation]
      properties:
        team: { type: string }
        agent: { type: string }
        owner_generation: { type: string }
    GraftReceiverLookupRequest:
      type: object
      required: [team, agent]
      properties:
        team: { type: string }
        agent: { type: string }
    GraftReceiverLease:
      type: object
      required: [endpoint, capability, owner_generation, registered_at, last_seen_at]
      properties:
        endpoint: { type: string, format: uri }
        capability: { type: string, format: byte }
        owner_generation: { type: string }
        registered_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        unreachable_since: { type: string, format: date-time, nullable: true }
    Message:
      type: object
      required: [message_id, from, to, body]
      properties:
        message_id: { type: string }
        from: { $ref: '#/components/schemas/AgentAddress' }
        to: { $ref: '#/components/schemas/AgentAddress' }
        body: { type: string }
        requires_ack: { type: boolean }
        acknowledges_message_id: { type: string }
    ListOutcome:
      type: object
      description: Body of the `List` response-envelope variant; path references are corrected under the BB.7 envelope item.
      required: [action, team, agent, selection_mode, history_collapsed, count, rows, bucket_counts]
      properties:
        action: { type: string }
        team: { type: string }
        agent: { type: string }
        selection_mode: { type: string }
        history_collapsed: { type: boolean }
        count: { type: integer }
        rows: { type: array, items: { $ref: '#/components/schemas/ListRow' } }
        bucket_counts: { $ref: '#/components/schemas/BucketCounts' }
        task_rows: { type: array, items: { $ref: '#/components/schemas/TaskRow' }, default: [] }
        task_event_rows: { type: array, items: { $ref: '#/components/schemas/TaskEventRow' }, default: [] }
        handoffs: { type: array, items: { $ref: '#/components/schemas/PromptHandoff' }, default: [] }
    ListRow:
      type: object
      required: [message_id, summary, from, timestamp, read, pending_ack, task_id]
      properties:
        message_id: { type: string, nullable: true }
        summary: { type: string }
        from: { type: string }
        timestamp: { type: string, format: date-time }
        read: { type: boolean }
        pending_ack: { type: boolean }
        task_id: { type: string, nullable: true }
    BucketCounts:
      type: object
      required: [unread, pending_ack, history]
      properties:
        unread: { type: integer }
        pending_ack: { type: integer }
        history: { type: integer }
    TaskRow:
      type: object
      required: [team, task_id, assignee, assigner, state, assignment_message_id, description, assigned_at, updated_at, reminder_count, lead_notified_count]
      properties:
        team: { type: string }
        task_id: { type: string }
        assignee: { type: string }
        assigner: { type: string }
        state: { type: string, enum: [assigned, active, complete] }
        close_outcome: { type: string, nullable: true }
        position: { type: integer, nullable: true }
        assignment_message_id: { type: string }
        description: { type: string }
        assigned_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_reminded_at: { type: string, format: date-time, nullable: true }
        reminder_count: { type: integer, format: uint32 }
        lead_notified_count: { type: integer, format: uint32 }
    TaskEventRow:
      type: object
      required: [team, task_id, assignee, seq, at, event, actor]
      properties:
        team: { type: string }
        task_id: { type: string }
        assignee: { type: string }
        seq: { type: integer, format: uint64 }
        at: { type: string, format: date-time }
        event: { type: string }
        from_state: { type: string, nullable: true }
        to_state: { type: string, nullable: true }
        close_outcome: { type: string, nullable: true }
        actor: { type: object }
        message_id: { type: string, nullable: true }
        outcome: { type: string, nullable: true }
        marker: { type: string, nullable: true }
        detail: { type: string, nullable: true }
    ReadOutcome:
      type: object
      required: [action, team, agent, selection_mode, mutation_applied, count, match_count, additional_match_count, bucket_counts]
      properties:
        action: { type: string }
        team: { type: string }
        agent: { type: string }
        selection_mode: { type: string }
        mutation_applied: { type: boolean }
        count: { type: integer }
        message: { $ref: '#/components/schemas/ClassifiedMessage' }
        selected_message_id: { type: string }
        match_count: { type: integer }
        additional_match_count: { type: integer }
        bucket_counts: { $ref: '#/components/schemas/BucketCounts' }
    ClassifiedMessage:
      type: object
      required: [bucket, class, from, text, timestamp, read, requires_ack]
      properties:
        bucket: { type: string, enum: [unread, pending_ack, history] }
        class: { type: string, enum: [unread, pending_ack, acknowledged, read] }
        from: { type: string }
        text: { type: string }
        timestamp: { type: string, format: date-time }
        read: { type: boolean }
        requires_ack: { type: boolean }
        sourceChatId: { type: string }
        source_team: { type: string }
        destinationChatId: { type: string }
        summary: { type: string }
        message_id: { type: string }
        pendingAckAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time }
        acknowledgesMessageId: { type: string }
        parentMessageId: { type: string }
        threadMode: { type: string, enum: [add-details, supersede] }
        expiresAt: { type: string, format: date-time }
        taskId: { type: string }
        placement: { type: object }
        taskOp: { type: object }
        taskComplete: { type: string }
    PromptHandoff:
      type: object
      required: [team, agent, message_key, kind, task_id, attempt, trigger, at]
      properties:
        team: { type: string }
        agent: { type: string }
        message_key: { type: string }
        kind: { type: string, enum: [delivery, delivery_ack, queue, queue_ack, acknowledge, task_queued, task_ready, task_reminder, task_started, task_complete, task_closed] }
        task_id: { type: string }
        attempt: { type: integer, format: uint32 }
        trigger: { type: string, enum: [steer, task_pass] }
        at: { type: string, format: date-time }
    HookRegisterRequest:
      type: object
      required: [caller_identity, caller_team, phase, hook, module_path, cwd, timeout_ms]
      properties:
        caller_identity: { type: string }
        caller_team: { type: string }
        phase: { type: string }
        hook: { type: string, description: A task hook name such as task.assign; cron.tick is refused. }
        module_path: { type: string }
        cwd: { type: string }
        timeout_ms: { type: integer, format: uint32, minimum: 1, maximum: 2500 }
        custom: { type: object, description: Optional JSON object of at most 64 KiB; an absent value is an empty object. }
    HookDisableRequest:
      type: object
      required: [caller_identity, caller_team, phase]
      properties:
        caller_identity: { type: string }
        caller_team: { type: string }
        phase: { type: string }
        hook: { type: string, description: One named hook; absent disables every hook of the phase. }
    HookListQuery:
      type: object
      required: [caller_identity, caller_team]
      properties:
        caller_identity: { type: string }
        caller_team: { type: string }
        phase: { type: string }
    HookRegistration:
      type: object
      required: [team, phase, hook, module_path, cwd, timeout_ms, custom, active, registered_by, registered_at]
      properties:
        team: { type: string }
        phase: { type: string }
        hook: { type: string }
        module_path: { type: string }
        cwd: { type: string }
        timeout_ms: { type: integer, format: uint32 }
        custom: { type: object }
        active: { type: boolean }
        registered_by: { type: string }
        registered_at: { type: string, format: date-time }
        disabled_at: { type: string, format: date-time }
    HookActions:
      type: object
      required: [dispatched]
      properties:
        dispatched: { type: integer, format: uint, description: Count of hook actions dispatched; equals the X-ATM-Hook-Actions header. }
    HookDoctorEntry:
      type: object
      required: [module_path, cwd, team, phase, hooks, schedules, timeout_ms]
      properties:
        module_path: { type: string }
        cwd: { type: string }
        team: { type: string }
        phase: { type: string }
        hooks: { type: array, items: { type: string } }
        schedules: { type: array, items: { type: string } }
        timeout_ms: { type: integer, format: uint32 }
        success: { type: boolean }
        message: { type: string }
        findings: { type: array, items: { type: object } }
        error: { type: object, description: The failed call's code and message; the rest of the doctor report is unchanged. }
    CronStartRequest:
      type: object
      required: [caller_identity, caller_team, phase, name, cron_expr, module_path, cwd, args, timeout_ms, stop]
      properties:
        caller_identity: { type: string }
        caller_team: { type: string }
        phase: { type: string }
        name: { type: string }
        cron_expr: { type: string }
        module_path: { type: string }
        cwd: { type: string }
        args: { type: array, items: { type: string } }
        timeout_ms: { type: integer, format: uint32, minimum: 1, maximum: 30000 }
        stop: { type: object, description: A StopCondition, either the Hook check or an Until time. }
        custom: { type: object }
    CronEndRequest:
      type: object
      required: [caller_identity, caller_team, phase]
      properties:
        caller_identity: { type: string }
        caller_team: { type: string }
        phase: { type: string }
        name: { type: string }
    CronListQuery:
      type: object
      required: [caller_identity, caller_team]
      properties:
        caller_identity: { type: string }
        caller_team: { type: string }
        phase: { type: string }
    CronSchedule:
      type: object
      required: [id, generation, team, phase, name, cron_expr, module_path, cwd, args, timeout_ms, jitter_s, custom, stop, active, created_by, created_at]
      properties:
        id: { description: Schedule identifier assigned by the daemon store. }
        generation: { type: integer, format: uint32 }
        team: { type: string }
        phase: { type: string }
        name: { type: string }
        cron_expr: { type: string }
        module_path: { type: string }
        cwd: { type: string }
        args: { type: array, items: { type: string } }
        timeout_ms: { type: integer, format: uint32 }
        jitter_s: { type: integer, format: uint32 }
        custom: { type: object }
        stop: { type: object }
        active: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        last_run_at: { type: string, format: date-time }
        last_outcome: { type: string }
    AtmError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
