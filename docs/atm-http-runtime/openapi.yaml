openapi: 3.1.0
info:
  title: ATM daemon API
  version: 1.7.0
  description: HTTP contract shared by local UDS and future peer HTTPS adapters.
servers:
  - url: /v1/atm
paths:
  /messages/search:
    get:
      operationId: searchMessages
      description: Local-only typed search. Peer-authenticated callers are rejected before storage selection.
      parameters:
        - name: request
          in: query
          required: true
          description: Unpadded URL-safe base64 encoding of the JSON SearchRequest contract.
          schema: { type: string, format: base64url }
      responses:
        '200': { description: Local typed search result, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResponse' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /messages:
    get:
      operationId: listMessages
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/ListQuery' } } } }
      parameters:
        - $ref: '#/components/parameters/Agent'
        - $ref: '#/components/parameters/ChatId'
      responses:
        '200': { description: Messages, content: { application/json: { schema: { $ref: '#/components/schemas/MessageList' } } } }
        default: { $ref: '#/components/responses/AtmError' }
    post:
      operationId: writeMessage
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WriteRequest' } } } }
      responses:
        '201': { description: Created message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        default: { $ref: '#/components/responses/AtmError' }
    delete:
      operationId: clearMessages
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClearQuery' } } } }
      responses:
        '204':
          description: Cleared; no response body.
          headers:
            X-ATM-Clear-Outcome:
              description: Base64url-encoded clear result for CLI rendering.
              schema: { type: string }
        default: { $ref: '#/components/responses/AtmError' }
  /messages/inspect:
    post:
      operationId: inspectMessages
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PeekQuery' } } } }
      responses:
        '200': { description: Messages, content: { application/json: { schema: { $ref: '#/components/schemas/MessageList' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /messages/read:
    post:
      operationId: readMessages
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReadQuery' } } } }
      responses:
        '200': { description: Messages, content: { application/json: { schema: { $ref: '#/components/schemas/MessageList' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /doctor:
    get:
      operationId: doctor
      responses:
        '200': { description: Daemon health, content: { application/json: { schema: { $ref: '#/components/schemas/DoctorResponse' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /compatibility:
    post:
      operationId: compatibilityPreflight
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompatibilityPreflight' } } } }
      responses:
        '200': { description: Compatibility verdict, content: { application/json: { schema: { $ref: '#/components/schemas/CompatibilityVerdict' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /heartbeat:
    post:
      operationId: teamMemberHeartbeat
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatRequest' } } } }
      responses:
        '200': { description: Heartbeat result, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatResponse' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /queue/get-next:
    post:
      operationId: getNextBareCliQueueMessages
      description: Local-ingress-only FIFO pull for the authenticated caller's member.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QueueGetNextRequest' } } } }
      responses:
        '200': { description: Queue messages, content: { application/json: { schema: { $ref: '#/components/schemas/QueueGetNextResponse' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /tasks/move:
    post:
      operationId: moveTask
      description: Local-ingress-only reorder of an open task in its assignee's queue.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskMoveRequest' } } } }
      responses:
        '200': { description: Task move result, content: { application/json: { schema: { $ref: '#/components/schemas/TaskMoveOutcome' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /graft/receiver/register:
    post:
      operationId: registerGraftReceiver
      description: Local-ingress-only registration of the current agent's graft receiver endpoint.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GraftReceiverRegistration' } } } }
      responses:
        '200': { description: Receiver registration accepted, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /graft/receiver/refresh:
    post:
      operationId: refreshGraftReceiver
      description: Local-ingress-only owner-checked liveness keepalive for the current agent's graft receiver lease; rejected with a NotOwner error when another generation now owns the stored lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GraftReceiverRefreshRequest' } } } }
      responses:
        '200': { description: Receiver lease refreshed, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /graft/receiver/unregister:
    post:
      operationId: unregisterGraftReceiver
      description: Local-ingress-only removal of the current agent's graft receiver registration.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GraftReceiverUnregistration' } } } }
      responses:
        '200': { description: Receiver registration removed, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /graft/receiver/lookup:
    post:
      operationId: lookupGraftReceiver
      description: Local-ingress-only lookup of a registered graft receiver lease.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GraftReceiverLookupRequest' } } } }
      responses:
        '200': { description: Receiver lease when registered, content: { application/json: { schema: { nullable: true, $ref: '#/components/schemas/GraftReceiverLease' } } } }
        default: { $ref: '#/components/responses/AtmError' }
  /runtime/reload:
    post:
      operationId: reloadRuntimeView
      requestBody: { required: true, content: { application/json: { schema: { type: 'null' } } } }
      responses:
        '200': { description: Runtime view reloaded, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/AtmError' }
components:
  parameters:
    Agent: { name: agent, in: query, schema: { type: string } }
    ChatId: { name: chat_id, in: query, schema: { type: string } }
    Peer: { name: peer, in: path, required: true, schema: { type: string } }
  responses:
    AtmError:
      description: ATM error
      content: { application/json: { schema: { $ref: '#/components/schemas/AtmError' } } }
  schemas:
    AgentAddress:
      type: object
      required: [agent, team]
      properties:
        agent: { type: string }
        chat_id: { type: string }
        team: { type: string }
        host: { type: string }
    WriteRequest:
      type: object
      required: [message_id, from, to, body]
      properties:
        message_id: { type: string }
        from: { $ref: '#/components/schemas/AgentAddress' }
        to: { $ref: '#/components/schemas/AgentAddress' }
        body: { type: string }
        requires_ack: { type: boolean }
        acknowledges_message_id: { type: string }
        peer_http_api_version:
          type: string
          description: Optional cross-host wire API version. The current baseline is 1.4.0; receivers reject only a major-version mismatch.
    PeekQuery:
      type: object
      description: Canonical inspect query; fields are validated by the daemon.
    ReadQuery:
      type: object
      description: Canonical read query; fields are validated by the daemon.
    ClearQuery:
      type: object
      description: Canonical clear query; fields are validated by the daemon.
    ListQuery:
      type: object
      description: Canonical list query; fields are validated by the daemon.
    DoctorResponse:
      type: object
      description: Doctor report. Herdr endpoint presence entries identify both the canonical roster name and the effective Herdr agent name.
      properties:
        herdr:
          $ref: '#/components/schemas/HerdrDoctorReport'
        runtime_status:
          $ref: '#/components/schemas/RuntimeStatusSnapshot'
          description: Optional projection of the daemon's canonical ephemeral master-roster state; added in HTTP API 1.4.0.
    RuntimeStatusSnapshot:
      type: object
      required: [liveness, readiness]
      properties:
        liveness: { type: string, enum: [running, unavailable] }
        readiness: { type: string, enum: [ready, degraded, unavailable] }
        detail: { type: string, nullable: true }
        singleton_owner_pid: { type: integer, format: uint32, nullable: true }
        degraded_ingest: { type: boolean, default: false }
        member_counts: { $ref: '#/components/schemas/RuntimeStatusCounts' }
        members:
          type: array
          items: { $ref: '#/components/schemas/RuntimeMemberObservation' }
        graft_queue_handoff_failures_total: { type: integer, format: uint64, default: 0 }
        graft_queue_marker_clear_failures_total: { type: integer, format: uint64, default: 0 }
        bare_cli_queue_full_drops_total: { type: integer, format: uint64, default: 0 }
        queue_marker_set_failures_total: { type: integer, format: uint64, default: 0 }
        herdr_queue_last_tick_at: { type: string, format: date-time, nullable: true }
        queue_messages_drained_total: { type: integer, format: uint64, default: 0 }
        queue_drain_failures_total: { type: integer, format: uint64, default: 0 }
        blocking_core_bridge_stalls_total: { type: integer, format: uint64, default: 0 }
        write_source_preflight_stalls_total: { type: integer, format: uint64, default: 0 }
    RuntimeStatusCounts:
      type: object
      required: [active_members, idle_members, offline_members, unknown_members]
      properties:
        active_members: { type: integer, format: uint64 }
        idle_members: { type: integer, format: uint64 }
        offline_members: { type: integer, format: uint64 }
        unknown_members: { type: integer, format: uint64 }
    RuntimeMemberObservation:
      type: object
      required: [team, member, state]
      properties:
        team: { type: string }
        member: { type: string }
        state: { type: string, enum: [unknown, identity_conflict, offline, idle, active, blocked] }
        revision: { type: integer, format: uint64, default: 0, description: Monotonic accepted-observation revision; added in HTTP API 1.4.0. }
        availability: { $ref: '#/components/schemas/RuntimeObservationAvailability', description: Freshness of the most recent accepted observation attempt; added in HTTP API 1.4.0. }
        last_observation_attempt_by: { $ref: '#/components/schemas/RuntimeObservationSource', nullable: true, description: Source of the latest accepted attempt; added in HTTP API 1.4.0. }
        last_observation_attempt_at: { type: string, format: date-time, nullable: true, description: Time of the latest accepted attempt; added in HTTP API 1.4.0. }
        last_observed_by: { $ref: '#/components/schemas/RuntimeObservationSource', nullable: true, description: Source of the latest successful observation; added in HTTP API 1.4.0. }
        last_observed_at: { type: string, format: date-time, nullable: true, description: Time of the latest successful observation; added in HTTP API 1.4.0. }
        session_id: { type: string, nullable: true }
        pid: { type: integer, format: uint32, nullable: true }
        last_active_at: { type: string, format: date-time, nullable: true }
        state_changed_by: { $ref: '#/components/schemas/RuntimeObservationSource', nullable: true }
        state_changed_at: { type: string, format: date-time, nullable: true }
        session_changed_by: { $ref: '#/components/schemas/RuntimeObservationSource', nullable: true }
        session_changed_at: { type: string, format: date-time, nullable: true }
    RuntimeObservationAvailability:
      type: string
      enum: [unobserved, fresh, unavailable]
      default: unobserved
    RuntimeObservationSource:
      type: string
      enum: [heartbeat, herdr_poll]
    HerdrDoctorReport:
      type: object
      properties:
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/HerdrEndpointDoctorReport' }
        breaker:
          $ref: '#/components/schemas/HerdrBreakerDoctorReport'
    HerdrBreakerDoctorReport:
      type: object
      properties:
        state: { type: string, enum: [closed, open] }
        retry_after_ms: { type: integer, format: uint64, nullable: true }
        consecutive_failures: { type: integer, format: uint32, nullable: true }
        last_error_code: { type: string, nullable: true, description: Last infrastructure error code; added in HTTP API 1.3.0. }
        last_error_detail: { type: string, nullable: true, description: Last infrastructure error detail; added in HTTP API 1.3.0. }
    HerdrEndpointDoctorReport:
      type: object
      properties:
        transport: { type: string, enum: [cli, socket], description: Transport used by the Herdr endpoint; added in HTTP API 1.2.0. }
        members:
          type: array
          items: { $ref: '#/components/schemas/HerdrMemberPresence' }
        findings:
          type: array
          description: Endpoint-wide target-resolution and named-session findings; added in HTTP API 1.3.0.
          items: { $ref: '#/components/schemas/DoctorFinding' }
    DoctorFinding:
      type: object
      description: Privacy-safe operator diagnostic.
      properties:
        severity: { type: string }
        code: { type: string }
        message: { type: string }
        remediation: { type: string }
    HerdrMemberPresence:
      type: object
      required: [name, outcome]
      description: Herdr presence result. herdr_agent is the effective Herdr identity and was added in HTTP API 1.2.0.
      properties:
        name: { type: string, description: Canonical roster member name. }
        herdr_agent: { type: string, nullable: true, description: Effective Herdr agent name; nullable for backward-compatible v1.1 payloads; added in HTTP API 1.2.0. }
        outcome: { type: object, description: Presence probe outcome. }
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: object
          description: Public CLI/HTTP primitives compiled by atm-core into the bounded backend-neutral search query.
        lifecycle:
          $ref: '#/components/schemas/WorkflowProjectionRequest'
          description: Optional generic lifecycle projection over the bounded local search result.
    WorkflowSelector:
      type: object
      description: Partial exact selector; at least one selector field is required by the runtime.
      properties:
        state: { type: string }
        stage: { type: string }
        transition: { type: string }
    WorkflowTimeRange:
      type: object
      properties:
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
    WorkflowProjectionRequest:
      type: object
      required: [scope_kind, start, end]
      description: Generic one-to-one lifecycle pairing request carried by SearchRequest.lifecycle.
      properties:
        scope_kind: { type: string }
        scope_id: { type: string }
        start: { $ref: '#/components/schemas/WorkflowSelector' }
        end: { $ref: '#/components/schemas/WorkflowSelector' }
        time_range: { $ref: '#/components/schemas/WorkflowTimeRange' }
    SearchResponse:
      type: object
      required: [hits]
      properties:
        hits: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
        aggregate: { type: object }
        next_cursor: { type: string }
    SearchHit:
      type: object
      required: [key, message_at, from_agent, to_agent, snippet]
      properties:
        key: { type: object }
        message_id: { type: string }
        message_at: { type: string, format: date-time }
        from_agent: { $ref: '#/components/schemas/AgentAddress' }
        to_agent: { $ref: '#/components/schemas/AgentAddress' }
        template_type: { type: string }
        category: { type: string }
        snippet: { type: string }
    CompatibilityPreflight:
      type: object
      description: Client and daemon release compatibility request.
    CompatibilityVerdict:
      type: object
      description: Compatibility result.
    HeartbeatRequest:
      type: object
      description: Team-member heartbeat request.
    HeartbeatResponse:
      type: object
      description: Team-member heartbeat result.
    QueueGetNextRequest:
      type: object
      required: [team, member]
      properties:
        team: { type: string }
        member: { type: string }
    QueueGetNextResponse:
      type: object
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/QueuedNudgeMessage' } }
    TaskMoveRequest:
      type: object
      required: [caller_identity, caller_team, task_id, target]
      properties:
        caller_identity: { type: string }
        caller_team: { type: string }
        task_id: { type: string }
        target:
          oneOf:
            - type: object
              required: [to]
              properties:
                to: { type: string, enum: [head, end] }
            - type: object
              required: [to, task_id]
              properties:
                to: { type: string, enum: [before] }
                task_id: { type: string }
    TaskMoveOutcome:
      type: object
      required: [task_id, assignee, from, to]
      properties:
        task_id: { type: string }
        assignee: { type: string }
        from: { type: integer, minimum: 1 }
        to: { type: integer, minimum: 1 }
    QueuedNudgeMessage:
      type: object
      required: [kind, msg_id, body]
      properties:
        kind: { type: string, enum: [steer, queue] }
        msg_id: { type: string }
        body: { type: string }
    GraftReceiverRegistration:
      type: object
      required: [team, agent, endpoint, capability, owner_generation]
      properties:
        team: { type: string }
        agent: { type: string }
        endpoint: { type: string, format: uri }
        capability: { type: string, format: byte }
        owner_generation: { type: string }
    GraftReceiverUnregistration:
      type: object
      required: [team, agent, owner_generation]
      properties:
        team: { type: string }
        agent: { type: string }
        owner_generation: { type: string }
    GraftReceiverRefreshRequest:
      type: object
      required: [team, agent, owner_generation]
      properties:
        team: { type: string }
        agent: { type: string }
        owner_generation: { type: string }
    GraftReceiverLookupRequest:
      type: object
      required: [team, agent]
      properties:
        team: { type: string }
        agent: { type: string }
    GraftReceiverLease:
      type: object
      required: [endpoint, capability, owner_generation, registered_at, last_seen_at]
      properties:
        endpoint: { type: string, format: uri }
        capability: { type: string, format: byte }
        owner_generation: { type: string }
        registered_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        unreachable_since: { type: string, format: date-time, nullable: true }
    Message:
      type: object
      required: [message_id, from, to, body]
      properties:
        message_id: { type: string }
        from: { $ref: '#/components/schemas/AgentAddress' }
        to: { $ref: '#/components/schemas/AgentAddress' }
        body: { type: string }
        requires_ack: { type: boolean }
        acknowledges_message_id: { type: string }
    MessageList:
      type: object
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/Message' } }
        cursor: { type: string }
    AtmError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
