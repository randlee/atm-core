# The only place the Jev model id, host and path are set.
model = "jev-1.13.0"
host = "api.typesafe.ai"
path = "/v1/systemone"
max_request_bytes = 96000
attempts = 4
timeout_seconds = 60

# Equal input: an LLM run is equal when |input_tokens - prompt_tokens| <= leak_tolerance * prompt_tokens
# and it made no tool calls. Set before any API-direct run was measured.
leak_tolerance = 0.01

# LLM backends, API-direct: the user message is the payload bytes; no tools. The check request's system prompt
# carries Jev's answer schema for its questions (llm.system_prompt); follow-ups (ask) have no system prompt.
# key_env is read from the environment first, then the macOS Keychain service of the same name.
[haiku]
model = "claude-haiku-5-5"
key_env = "ANTHROPIC_API_KEY"

[luna]
model = "gpt-6-luna"
key_env = "OPENAI_API_KEY"

[sessions]
dir = "~/.cache/jev-check/sessions"
keep_days = 7
