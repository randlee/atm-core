[project]
name = "jev-check"
version = "0.1.0"
description = "The one Jev client: one check is one request; over the cap is INPUT_TOO_LARGE, never split."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_check"]

[tool.pyright]
typeCheckingMode = "strict"
