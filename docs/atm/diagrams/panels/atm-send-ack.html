In this diagram:

```mermaid
flowchart TD
    A[ack request] --&gt; B[Validate actor target and ack mode]
    B --&gt;|validation error| E1[ValidationFailed]
    B --&gt; C[&quot;SQL TX 1: update message_status ack fields
SQL TX 2: insert reply content row only if ack produces reply message
SQL TX 3: update reply message_status if needed&quot;]
    C --&gt;|busy or write error| E2[MailboxWriteFailed or MailboxLockTimeout]
    C --&gt; D[Commit SQLite transaction]
    D --&gt;|commit error| E3[MailboxWriteFailed]
    D --&gt; N1[Post-commit notification subsystem]
    N1 --&gt; N2[Best-effort post-send hook path]
    N1 --&gt; N3[Generic advisory-nudge routing]
    N2 --&gt;|hook failure| W1[Warning only no rollback]
    N3 --&gt;|queue full or consumer error| W2[Degraded nudge delivery no rollback]
    N2 --&gt; O1[Return ack outcome]
    N3 --&gt; O1
```

Commentary:
