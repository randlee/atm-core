# One reproducible developer/CI/bootstrap tool contract.  Do not replace an
# exact value with a range, a major-only selector, or "latest".
[toolchain]
rust = "1.94.1"
python = "3.14.7"
# CPython 3.14.7 corrupts lint-scanner state on Windows. Keep the Unix pin
# above; Windows uses this separately exact, stable interpreter pin.
python-windows = "3.12.10"
just = "1.58.0"

[cargo]
cargo-deny = "0.20.2"
cargo-audit = "0.22.2"
cargo-shear = "1.13.3"
cargo-modules = "0.26.0"

# Binstall strategies allowed for each cargo tool.  `compile` is never allowed
# in CI; cargo-audit and cargo-modules need Binstall's third-party quick-install
# archives because their upstream release layouts are not resolvable uniformly.
[cargo-allowed-strategies]
cargo-deny = []
cargo-audit = ["quick-install"]
cargo-shear = []
cargo-modules = ["quick-install"]

