<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="phase-root-bead" content="$root_bead_id">
  <meta name="wyvern:width" content="1536">
  <meta name="wyvern:height" content="864">
  <title>$title</title>
  <script id="wyvern-initial-size">
    (() => {
      function sizeWindow(event) {
        const bounds = (event && event.detail) || window.__wyvernViewportBounds || {};
        const screen = window.screen || {};
        const width = Math.round(0.8 * (bounds.available_width || screen.availWidth || 1920));
        const height = Math.round(0.8 * (bounds.available_height || screen.availHeight || 1080));
        document.querySelector('meta[name="wyvern:width"]').content = String(width);
        document.querySelector('meta[name="wyvern:height"]').content = String(height);
        if (window.ipc && typeof window.ipc.postMessage === 'function') {
          window.ipc.postMessage('resize:' + width + 'x' + height);
        }
      }
      window.addEventListener('wyvern:viewport-bounds', sizeWindow);
      sizeWindow();
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #172b43; background: white; font: 14px system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; background: #f8fafc; border-bottom: 1px solid #dbe3ed; }
    h1 { margin: 0 auto 0 0; font-size: 17px; }
    button { font: inherit; color: inherit; background: white; border: 1px solid #a8b7c9;
      border-radius: 5px; padding: 5px 12px; cursor: pointer; }
    button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    output { min-width: 45px; text-align: center; }
    main { overflow: auto; height: calc(100vh - 59px); padding: 12px; }
    #diagram { width: 100%; }
    #diagram > svg { display: block; width: 100%; height: auto; }
    @media print { header { position: static; } button, output { display: none; }
      main { height: auto; overflow: visible; } #diagram { width: 100% !important; } }
  </style>
</head>
<body>
  <header>
    <h1>$title</h1>
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <output id="zoom-level" aria-live="polite">100%</output>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="fit" type="button">Fit</button>
  </header>
  <main aria-label="Sprint dependency diagram">
    <div id="diagram">$svg</div>
  </main>
  <script>
    const diagram = document.getElementById('diagram');
    let zoom = 1;
    function setZoom(value) {
      zoom = Math.max(0.5, Math.min(4, value));
      diagram.style.width = (zoom * 100) + '%';
      document.getElementById('zoom-level').textContent = Math.round(zoom * 100) + '%';
    }
    document.getElementById('zoom-out').addEventListener('click', () => setZoom(zoom / 1.25));
    document.getElementById('zoom-in').addEventListener('click', () => setZoom(zoom * 1.25));
    document.getElementById('fit').addEventListener('click', () => setZoom(1));
  </script>
</body>
</html>
