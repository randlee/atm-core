name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version candidate (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string
      run_by_agent:
        description: "Must be 'publisher' (agent ownership assertion)"
        required: true
        default: "publisher"
        type: string

permissions:
  contents: read

env:
  RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml
  STAGED_INSTALL_ROOT: target/phase-ae/staged-install-root

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce publisher ownership input
        shell: bash
        run: |
          set -euo pipefail
          runner='${{ github.event.inputs.run_by_agent }}'
          if [[ "$runner" != "publisher" ]]; then
            echo "Preflight must be executed by publisher agent. Got run_by_agent='$runner'" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install canonical Python tools
        uses: ./.github/actions/setup-atm-python-tools
        with:
          python-version: "3.14"

      - name: Install sc-compose CLI
        # Template JSON escaping requires the released sc-compose 1.4.0 API.
        # Keep this pin aligned with .github/workflows/ci.yml.
        run: cargo install --git https://github.com/randlee/sc-compose.git --rev 6a8af1ff46ccd64ae9cc40d7d5c815aa9b0a4661 --locked --bin sc-compose

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install cargo-shear
        uses: taiki-e/install-action@cargo-shear

      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall

      - name: Install cargo-modules
        run: cargo binstall cargo-modules@0.26.0 --no-confirm

      - name: Normalize version input
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ github.event.inputs.version }}'
          tag="$raw"
          [[ "$tag" == v* ]] || tag="v${tag}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid version: '$raw' (expected strict SemVer X.Y.Z[-prerelease][+build] or v-prefixed)" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"

      - name: Stage installed docs for validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${STAGED_INSTALL_ROOT}"
          python3 scripts/release_artifacts.py stage-install-docs \
            --manifest "${RELEASE_ARTIFACT_MANIFEST}" \
            --output-root "${STAGED_INSTALL_ROOT}"

      - name: Run canonical retained release validation suite + user-doc freshness gate
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_release.py all \
            --version '${{ steps.meta.outputs.release_version }}' \
            --staged-install-root "${STAGED_INSTALL_ROOT}" \
            --findings release-findings.json

      - name: Upload release findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-findings
          path: release-findings.json

      - name: Fail if canonical validation failed
        if: steps.validate.outcome != 'success'
        shell: bash
        run: exit 1
