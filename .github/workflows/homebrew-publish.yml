name: Publish Homebrew

# This post-release channel reads every repository-specific value from
# release/publish-artifacts.toml and may be re-dispatched for the same tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published GitHub Release tag to publish (e.g. v1.4.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-homebrew-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      channel_config: ${{ steps.config.outputs.channel_config }}
      asset_patterns: ${{ steps.config.outputs.asset_patterns }}
      release_version: ${{ steps.meta.outputs.release_version }}
    steps:
      # Release-branch fix (v1.4.4, upstream sc-publish#76): check out the
      # dispatch ref, not the immutable tag. This workflow never builds from
      # source — release assets stay tag-pinned via their download URLs and
      # verify-published-release validates via the API — so the checkout
      # exists solely to supply the verify tooling, manifest, and formula
      # template. Pinning it to the tag freezes any tooling or template
      # defect into the release forever (the tag is immutable). Same model
      # as release.yml: immutable tag for artifacts, dispatch ref for tooling.
      - uses: actions/checkout@v4
      - id: config
        name: Read Homebrew configuration from release manifest
        shell: bash
        run: |
          set -euo pipefail
          config="$(python3 .github/scripts/release_artifacts.py channel-config --manifest release/publish-artifacts.toml --channel homebrew --tag "${{ inputs.tag }}")"
          echo "channel_config=${config}" >> "$GITHUB_OUTPUT"
          {
            echo 'asset_patterns<<EOF'
            jq -r '.asset_patterns[]' <<<"${config}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/verify-published-release
        with:
          release_tag: ${{ inputs.tag }}
          asset_patterns: ${{ steps.config.outputs.asset_patterns }}
      - id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "release_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  update-tap:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - name: Require Homebrew tap credential
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo 'HOMEBREW_TAP_TOKEN is required to update the configured Homebrew tap.' >&2
            exit 1
          fi
      - name: Checkout workflow support
        uses: actions/checkout@v4
      - name: Bootstrap renderer
        uses: ./.github/actions/setup-renderer
      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ fromJSON(needs.verify-release.outputs.channel_config).channel.tap_repository }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Download configured release assets and compute SHA256
        shell: bash
        env:
          CHANNEL_CONFIG: ${{ needs.verify-release.outputs.channel_config }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.release_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          config = json.loads(os.environ["CHANNEL_CONFIG"])
          project = config["project"]
          assets = {}

          def download(target):
              filename = f"{project['archive_prefix']}_{os.environ['RELEASE_VERSION']}_{target['target']}.{target['archive']}"
              url = f"https://github.com/{os.environ['RELEASE_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}/{filename}"
              path = Path(os.environ["RUNNER_TEMP"]) / filename
              subprocess.run(
                  ["curl", "-fsSL", "--retry", "5", "--retry-delay", "30", "--retry-all-errors", "-o", str(path), url],
                  check=True,
              )
              return url, path

          for asset in config["channel"]["assets"]:
              target = config["release_targets"][asset["target"]]
              url, path = download(target)
              if asset["key"] in assets:
                  raise SystemExit(f"duplicate Homebrew asset key: {asset['key']}")
              assets[asset["key"]] = {
                  "url": url,
                  "sha256": hashlib.file_digest(path.open("rb"), "sha256").hexdigest(),
              }
          required_asset_keys = {"macos_arm", "macos_intel", "linux"}
          if set(assets) != required_asset_keys:
              raise SystemExit(
                  "Homebrew assets must contain exactly: macos_arm, macos_intel, linux"
              )
          Path("homebrew-release-assets.json").write_text(json.dumps(assets), encoding="utf-8")
          PY
      - name: Render manifest-selected formulas with the published renderer
        shell: bash
        env:
          CHANNEL_CONFIG: ${{ needs.verify-release.outputs.channel_config }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.release_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          config = json.loads(os.environ["CHANNEL_CONFIG"])
          project = config["project"]
          channel = config["channel"]
          assets = json.loads(Path("homebrew-release-assets.json").read_text())
          renderer = os.environ["PUBLISHED_RENDERER"]
          for index, formula in enumerate(channel["formulas"]):
              binaries = formula["binaries"]
              bundled_paths = []
              for entry in config.get("release_binaries", []):
                  if entry["name"] not in binaries:
                      continue
                  for bundle in entry.get("bundled_paths", []):
                      destination = bundle["destination"]
                      bundled_paths.append(
                          {
                              "destination_components": bundle["homebrew_destination_components"],
                              "source_glob": f"{destination}/*",
                          }
                      )
              variables = {
                  "formula_class": formula["class"],
                  "description": project["description"],
                  "homepage": project["homepage"],
                  "license": project["license"],
                  "version": os.environ["RELEASE_VERSION"],
                  "macos_arm_url": assets["macos_arm"]["url"],
                  "macos_arm_sha256": assets["macos_arm"]["sha256"],
                  "macos_intel_url": assets["macos_intel"]["url"],
                  "macos_intel_sha256": assets["macos_intel"]["sha256"],
                  "linux_url": assets["linux"]["url"],
                  "linux_sha256": assets["linux"]["sha256"],
                  "test_binary": formula["test_binary"],
                  "test_command": formula["test_command"],
                  "test_output": formula["test_output"],
                  "binary_paths": [f"bin/{binary}" for binary in binaries],
                  "bundled_paths": bundled_paths,
              }
              variables_path = Path(f"homebrew-vars-{index}.json")
              variables_path.write_text(json.dumps(variables), encoding="utf-8")
              output = Path("homebrew-tap") / formula["path"]
              output.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(
                  [
                      renderer,
                      "render",
                      "--mode",
                      "file",
                      "--root",
                      ".",
                      "--file",
                      formula["template"],
                      "--var-file",
                      str(variables_path.resolve()),
                      "--output",
                      str(output.resolve()),
                  ],
                  check=True,
              )
          PY
      - name: Verify formula syntax
        shell: bash
        env:
          CHANNEL_CONFIG: ${{ needs.verify-release.outputs.channel_config }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          for formula in json.loads(os.environ["CHANNEL_CONFIG"])["channel"]["formulas"]:
              subprocess.run(["ruby", "-c", str(Path("homebrew-tap") / formula["path"])], check=True)
          PY
      - name: Commit and push formula updates
        shell: bash
        env:
          CHANNEL_CONFIG: ${{ needs.verify-release.outputs.channel_config }}
          PROJECT_NAME: ${{ fromJSON(needs.verify-release.outputs.channel_config).project.name }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.release_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > homebrew-formula-paths.txt
          import json
          import os

          for formula in json.loads(os.environ["CHANNEL_CONFIG"])["channel"]["formulas"]:
              print(formula["path"])
          PY
          cd homebrew-tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          while IFS= read -r formula_path; do
            git add -- "${formula_path}"
          done < ../homebrew-formula-paths.txt
          git diff --cached --quiet && echo 'Formula already matches the release assets' && exit 0
          git commit -m "chore: bump ${PROJECT_NAME} to v${RELEASE_VERSION}"
          # Concurrency groups are per-tag, so two different tags can race the
          # tap push; fetch-rebase-retry instead of failing on the first reject.
          tap_branch="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3 4 5; do
            if git push origin "${tap_branch}"; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${tap_branch}"
            git pull --rebase origin "${tap_branch}"
          done
          echo "failed to push Homebrew formula update after 5 attempts" >&2
          exit 1
