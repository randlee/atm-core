name: CI

on:
  pull_request:
    branches: [develop, main, "integrate/*"]
  push:
    branches: [develop, main]

jobs:
  ci-scope:
    name: Classify CI scope
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        shell: bash
        run: |
          # Pushes always exercise the runtime.  A pull request containing only
          # documentation or skill Markdown does not change executable code, so
          # it does not run the long-lived daemon smoke matrix.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA")"
          if [[ -z "$changed_files" ]] || grep -qvE '^(docs/|site/|.*\.md$)' <<< "$changed_files"; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi

  just-lint:
    name: Just lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install sc-compose CLI
        # Template JSON escaping requires the released sc-compose 1.4.0 API.
        # Keep this pin aligned with .claude/lib/sc_compose_dependency.py.
        run: cargo install --git https://github.com/randlee/sc-compose.git --rev 6a8af1ff46ccd64ae9cc40d7d5c815aa9b0a4661 --locked --bin sc-compose

      - name: Expose Cargo binaries on PATH
        run: python -c "import os; cargo_bin = os.path.expanduser('~/.cargo/bin'); open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8').write(cargo_bin + os.linesep)"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install cargo-shear
        uses: taiki-e/install-action@cargo-shear

      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall

      - name: Install cargo-modules
        run: cargo binstall cargo-modules@0.26.0 --no-confirm

      - name: Install Python lint dependencies
        run: python -m pip install codespell 'pydantic>=2.12,<3'

      - name: Run just lint
        run: just lint

      - name: Show clippy diagnostics on lint failure
        if: failure()
        shell: bash
        run: |
          clippy_log="$(ls -t .just/logs/*-clippy.log 2>/dev/null | head -n 1)"
          test -n "$clippy_log"
          cat "$clippy_log"

      - name: Run cargo audit
        run: cargo audit

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check --all

  clippy:
    name: Clippy
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ubuntu-clippy-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ubuntu-clippy-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ubuntu-clippy-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: [clippy, ci-scope]
    if: ${{ !cancelled() && needs.clippy.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Documentation-only runtime skip
        if: ${{ needs.ci-scope.outputs.runtime != 'true' }}
        run: echo "Runtime tests are intentionally skipped for documentation-only changes."

      - uses: actions/checkout@v4
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}

      - name: Install Rust toolchain
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install Python
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python test dependencies
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: python -m pip install 'pydantic>=2.12,<3'

      - name: Install sc-compose CLI for passthrough parity tests
        # The AN.7 process-level tests compare the ATM command with the
        # pinned upstream CLI on every platform, so the test lane needs the
        # same source revision already used by just-lint.
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: cargo install --git https://github.com/randlee/sc-compose.git --rev 113729e60e3409ad8c651a74956ffa5c167dd1b6 --locked --bin sc-compose

      - name: Cache cargo registry
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: cargo build --verbose

      # Historical reference only while Phase AL constructs the replacement
      # executable. This must not be cited as AL acceptance evidence.
      - name: Build historical legacy-daemon smoke binaries (reference only)
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        continue-on-error: true
        run: cargo build --release -p agent-team-mail -p atm-daemon --verbose

      - name: Prepare historical legacy-daemon smoke binaries (reference only)
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "atm-smoke-install"
          $binDir = Join-Path $installRoot "bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $suffix = if ($env:RUNNER_OS -eq "Windows") { ".exe" } else { "" }
          Copy-Item "target/release/atm$suffix" (Join-Path $binDir "atm$suffix") -Force
          Copy-Item "target/release/atm-daemon$suffix" (Join-Path $binDir "atm-daemon$suffix") -Force
          "ATM_SMOKE_INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run replacement-workspace tests excluding legacy atm-daemon
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        env:
          ATM_TEST_RECV_TIMEOUT_SECS: "60"
        run: cargo test --workspace --exclude atm-daemon --verbose

      - name: Install Maturin for Hermes graft bridge tests
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: python -m pip install maturin

      - name: Run Hermes graft steer boundary tests
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: python .just/run_hermes_graft_bridge_tests.py

      - name: Test admission-capacity benchmark runner
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: python -m unittest scripts/smoke/test_run_admission_capacity.py

      - name: Run graft receiver crash/reclaim proof
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: python scripts/graft_receiver_reclaim.py

      # Historical reference only; replacement-runtime proof owns AL acceptance.
      - name: Run historical shared-host singleton smoke (reference only)
        continue-on-error: true
        if: ${{ always() && needs.ci-scope.outputs.runtime == 'true' }}
        run: python scripts/smoke/run_thorough_shared_host.py

  hermes-atm-release-wheels:
    name: Hermes ATM release wheel (${{ matrix.name }})
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux x86_64
            os: ubuntu-latest
            artifact: linux-x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            smoke: true
          - name: musllinux x86_64
            os: ubuntu-latest
            artifact: linux-musl-x86_64
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            smoke: false
          - name: manylinux aarch64
            os: ubuntu-latest
            artifact: linux-aarch64
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            smoke: false
          - name: macOS aarch64
            os: macos-14
            artifact: macos-aarch64
            target: aarch64-apple-darwin
            manylinux: "off"
            smoke: true
          - name: Windows x86_64
            os: windows-latest
            artifact: windows-x86_64
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python for package smoke verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build PyPI-compatible atm-graft wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          command: build
          maturin-version: v1.11.5
          rust-toolchain: "1.94.1"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: crates/atm-graft-python
          args: --release --locked --compatibility pypi --out ../../dist

      - name: Build universal hermes-atm wheel
        run: python -m pip wheel --no-deps --wheel-dir dist crates/hermes-atm

      - name: Verify abi3 artifact metadata
        shell: python
        run: |
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist").glob("atm_graft*.whl"))
          assert len(wheels) == 1, wheels
          assert "cp311-abi3" in wheels[0].name, wheels[0]
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_metadata = next(name for name in archive.namelist() if name.endswith(".dist-info/WHEEL"))
              assert "Tag: cp311-abi3" in archive.read(wheel_metadata).decode("utf-8")

      - name: Smoke-test native wheel on its host target
        if: ${{ matrix.smoke }}
        shell: bash
        run: |
          python -m pip install 'pydantic>=2,<3'
          python -m pip install --no-deps dist/atm_graft*.whl dist/hermes_atm*.whl
          python -c "import atm_graft, hermes_atm"

      - name: Upload release-wheel candidates
        uses: actions/upload-artifact@v4
        with:
          name: hermes-atm-wheels-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  hermes-atm-abi3-compat:
    name: Hermes ATM abi3 compatibility (Python ${{ matrix.python-version }})
    needs: [ci-scope, hermes-atm-release-wheels]
    if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download manylinux x86_64 candidate
        uses: actions/download-artifact@v4
        with:
          name: hermes-atm-wheels-linux-x86_64
          path: dist

      - name: Install and test abi3 wheel pair
        run: |
          python -m pip install 'pydantic>=2,<3'
          python -m pip install --no-deps dist/atm_graft*.whl dist/hermes_atm*.whl
          python -c "import atm_graft, hermes_atm"
          python -m unittest discover -s crates/hermes-atm/tests -p "test_*.py"

  hermes-atm-sdist:
    name: Hermes ATM source-distribution fallback
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Maturin
        run: python -m pip install maturin

      - name: Build atm-graft source distribution
        run: maturin sdist --manifest-path crates/atm-graft-python/Cargo.toml --out dist

      - name: Install source distribution in a fresh environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/atm-graft-sdist-venv"
          "$RUNNER_TEMP/atm-graft-sdist-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/atm-graft-sdist-venv/bin/python" -m pip install dist/atm_graft*.tar.gz
          "$RUNNER_TEMP/atm-graft-sdist-venv/bin/python" -c "import atm_graft"

      - name: Upload source-distribution candidate
        uses: actions/upload-artifact@v4
        with:
          name: atm-graft-sdist
          path: dist/atm_graft*.tar.gz
          if-no-files-found: error
