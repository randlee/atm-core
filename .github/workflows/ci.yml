name: CI

on:
  pull_request:
    # `branches` filters on the PR *base*. Any branch a stacked layer can sit
    # on must be listed, or that layer's PR gets no CI at all. `*` does not
    # match `/`, which the lower-case naming rule already forbids in slugs.
    branches:
      - develop
      - main
      - "integrate/*"
      - "integration/*"
      - "sprint/*"
      - "fix/*"
      - "hotfix/*"
      - "feature/*"
      - "plan/*"
      - "docs/*"
      - "chore/*"
      - "ci/*"
      - "release/*"
      - "merge/*"
      - "evidence/*"
      - "triage/*"
  push:
    branches: [develop, main]

# One live run per ref: a new push to a PR branch cancels the queued/running
# run for the superseded commit instead of stacking a full matrix behind it.
# Pushes to develop/main are never cancelled (every landed commit gets a run,
# classified by its own change set like a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-scope:
    name: Classify CI scope
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        shell: bash
        run: |
          # A change set containing only documentation, site content, report
          # templates, release manifests, triage/sprint records, or agent
          # configuration (.claude/, .codex/, .agents/, .cursor/) does not change
          # executable code, so it does not run the long-lived daemon smoke
          # matrix.  Pull requests and pushes use the same criteria: a PR is
          # classified against its base, a push against the previous head of
          # the branch.  Anything else (workflow_call, a branch creation with
          # no previous head) exercises the runtime.
          case "${{ github.event_name }}" in
            pull_request) range_start="${{ github.event.pull_request.base.sha }}" ;;
            push)         range_start="${{ github.event.before }}" ;;
            *)            range_start="" ;;
          esac
          if [[ -z "$range_start" || "$range_start" =~ ^0+$ ]] || ! git cat-file -e "$range_start^{commit}" 2>/dev/null; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$range_start" "$GITHUB_SHA")"
          if [[ -z "$changed_files" ]] || grep -qvE '^(docs/|site/|templates/|release/|\.triage/|\.sprints/|\.claude/|\.codex/|\.agents/|\.cursor/|.*\.md$)' <<< "$changed_files"; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi

  just-lint:
    name: Just lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Lint runs on ubuntu only; the macOS/Windows lint legs run on a PR
        # to main (the release PR) and nowhere else. Lint output is
        # platform-independent for this repo, macOS runner slots are the CI
        # queue's bottleneck, and the Windows leg alone took 12-14 min on
        # every push to develop (Rand, 2026-09-26). Each leg carries its
        # exact interpreter pin: Unix uses the 3.14.7 contract, Windows uses
        # the separate stable pin because CPython 3.14.7 corrupts the lint
        # scanner there (see tools/bootstrap.toml).
        include: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'main' && '[{"os":"ubuntu-latest","python":"3.14.7"},{"os":"macos-latest","python":"3.14.7"},{"os":"windows-latest","python":"3.12.10"}]' || '[{"os":"ubuntu-latest","python":"3.14.7"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Expose Cargo binaries on PATH
        run: python -c "import os; cargo_bin = os.path.expanduser('~/.cargo/bin'); open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8').write(cargo_bin + os.linesep)"

      - name: Cache bootstrap outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/binstall
            .bootstrap-venv
          key: ${{ runner.os }}-bootstrap-${{ hashFiles('tools/bootstrap.toml', 'tools/bootstrap-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-bootstrap-

      # The prerelease-tag candidate check runs cargo update --offline. Keep
      # the registry available on fresh just-lint runners so that check is not
      # dependent on an incidental warm local Cargo cache.
      - name: Cache Cargo registry for lint
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-just-lint-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-just-lint-cargo-registry-

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      - name: Pre-seed pinned cargo-binstall (bootstrap also verifies)
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0
        with:
          version: "1.22.0"

      - name: Bootstrap exact repository tools
        run: just bootstrap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned ecosystem tools
        shell: bash
        run: |
          set -euo pipefail
          sc-compose --version
          wyvern --version

      - name: Run just lint
        run: just lint

      - name: Show clippy diagnostics on lint failure
        if: failure()
        shell: bash
        run: |
          clippy_log="$(ls -t .just/logs/*-clippy.log 2>/dev/null | head -n 1)"
          test -n "$clippy_log"
          cat "$clippy_log"

      - name: Upload lint logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: just-lint-logs-${{ matrix.os }}
          path: .just/logs/**
          retention-days: 7

      - name: Run cargo audit
        run: cargo audit

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check --all

  clippy:
    name: Clippy
    needs: [fmt, ci-scope]
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only clippy skip
        if: ${{ needs.ci-scope.outputs.runtime != 'true' }}
        run: echo "Clippy is intentionally skipped for documentation-only changes."
      - uses: actions/checkout@v4
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}

      - name: Install Rust toolchain
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: clippy, rustfmt

      # Only develop/main save; PRs restore the default branch (develop) cache.
      # Per-PR saves filled the 10 GB repo limit with identical 3 GB targets.
      - name: Cache cargo
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Run clippy
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: [clippy, ci-scope, hermes-atm-release-wheels]
    if: ${{ always() && !cancelled() && needs.clippy.result == 'success' && (needs.ci-scope.outputs.runtime != 'true' || needs.hermes-atm-release-wheels.result == 'success' || needs.hermes-atm-release-wheels.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14.7"
          - os: macos-latest
            python: "3.14.7"
          - os: windows-latest
            python: "3.12.10"
    # Documentation-only changes keep the required check names but run the
    # skip step on ubuntu instead of waiting for a macOS/Windows runner slot.
    runs-on: ${{ needs.ci-scope.outputs.runtime == 'true' && matrix.os || 'ubuntu-latest' }}
    steps:
      - name: Documentation-only runtime skip
        if: ${{ needs.ci-scope.outputs.runtime != 'true' }}
        run: echo "Runtime tests are intentionally skipped for documentation-only changes."

      - uses: actions/checkout@v4
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}

      - name: Install Rust toolchain
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          # Keep these components explicit even though this job only calls
          # maturin/cargo test. Without them, maturin's nested toolchain
          # resolution can race the hosted runner's preinstalled cargo-fmt
          # and fail with rustfmt-preview's `bin/cargo-fmt` conflict.
          components: clippy, rustfmt

      - name: Install Python
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install just
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      - name: Expose Cargo binaries on PATH
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: python -c "import os; cargo_bin = os.path.expanduser('~/.cargo/bin'); open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8').write(cargo_bin + os.linesep)"

      # Only develop/main save; PRs restore the default branch (develop) cache.
      # Per-PR saves filled the 10 GB repo limit with identical 3 GB targets.
      - name: Cache cargo
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Cache bootstrap outputs
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/binstall
            .bootstrap-venv
          key: ${{ runner.os }}-bootstrap-${{ hashFiles('tools/bootstrap.toml', 'tools/bootstrap-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-bootstrap-

      - name: Pre-seed pinned cargo-binstall (bootstrap also verifies)
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0
        with:
          version: "1.22.0"

      - name: Bootstrap exact repository tools
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: just bootstrap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned ecosystem tools
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sc-compose --version
          wyvern --version

      - name: Build workspace
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: cargo build --verbose

      # Historical reference only while Phase AL constructs the replacement
      # executable. This must not be cited as AL acceptance evidence.
      - name: Build historical legacy-daemon smoke binaries (reference only)
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        continue-on-error: true
        run: cargo build --release -p agent-team-mail -p atm-daemon --verbose

      - name: Prepare historical legacy-daemon smoke binaries (reference only)
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "atm-smoke-install"
          $binDir = Join-Path $installRoot "bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $suffix = if ($env:RUNNER_OS -eq "Windows") { ".exe" } else { "" }
          Copy-Item "target/release/atm$suffix" (Join-Path $binDir "atm$suffix") -Force
          Copy-Item "target/release/atm-daemon$suffix" (Join-Path $binDir "atm-daemon$suffix") -Force
          "ATM_SMOKE_INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run replacement-workspace tests excluding legacy atm-daemon
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        env:
          ATM_TEST_RECV_TIMEOUT_SECS: "60"
        run: cargo test --workspace --exclude atm-daemon --verbose

      - name: Run Herdr transport fixtures
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: cargo test -p atm-herdr --all-features --verbose
        env:
          # AY.7's Windows-only integration test writes a deterministic
          # doctor-contract fixture here. It is CI evidence, not live Herdr
          # evidence, and is uploaded only from the Windows lane below.
          ATM_WINDOWS_PROCESS_AUDIT_DIR: ${{ runner.temp }}/atm-herdr-process-audit

      - name: Upload Windows Herdr process-audit doctor fixture
        if: ${{ always() && needs.ci-scope.outputs.runtime == 'true' && matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-herdr-process-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/atm-herdr-process-audit/windows-ci-doctor.json
          if-no-files-found: error
          retention-days: 7

      - name: Run ATM CLI surface compatibility contract
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: cargo test -p agent-team-mail --features cli-surface-dump --test cli_surface --verbose

      - name: Download host manifest-declared wheel candidates
        if: ${{ needs.ci-scope.outputs.runtime == 'true' && needs.hermes-atm-release-wheels.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          merge-multiple: true
          path: release-wheels

      # PR and push runs outside main do not build release wheels; the host wheel pair the parity
      # fixture installs below is built here instead, from the same cached
      # dev-profile target directory the workspace build just populated.
      - name: Build host wheel candidate
        if: ${{ needs.ci-scope.outputs.runtime == 'true' && needs.hermes-atm-release-wheels.result != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check maturin==1.14.1
          maturin build --locked -i python --manifest-path crates/atm-graft-python/Cargo.toml --out release-wheels
          python -m pip wheel --no-deps --wheel-dir release-wheels crates/hermes-atm

      - name: Select host release atm-graft wheel
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        shell: python
        run: |
          import os
          import platform
          from pathlib import Path
          import sysconfig

          system = platform.system()
          machine = sysconfig.get_platform().rsplit("-", 1)[-1]
          prefixes = {"Linux": ("manylinux", "linux"), "Darwin": ("macosx",), "Windows": ("win",)}
          if system not in prefixes:
              raise RuntimeError(f"unsupported host wheel platform: {system}")
          compatible = []
          for wheel in Path("release-wheels").glob("atm_graft*.whl"):
              tags = wheel.stem.rsplit("-", 1)[-1].split(".")
              if any(tag.startswith(prefix) and tag.endswith("_" + machine) for tag in tags for prefix in prefixes[system]):
                  compatible.append(wheel)
          if not compatible:
              raise RuntimeError("manifest wheel matrix produced no host-compatible atm-graft wheel")
          if len(compatible) != 1:
              raise RuntimeError(f"manifest wheel matrix produced multiple host-compatible atm-graft wheels: {compatible}")
          wheel = compatible[0]
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write(f"ATM_GRAFT_WHEEL={wheel.resolve()}\n")
              environment.write(f"ATM_WHEEL_OUTPUT_DIR={Path('bridge-wheels').resolve()}\n")

      - name: Install Hermes parity fixture packages
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import os

          wheels = Path("release-wheels")
          graft = Path(os.environ["ATM_GRAFT_WHEEL"])
          hermes = sorted(wheels.glob("hermes_atm*.whl"))
          if len(hermes) != 1:
              raise RuntimeError(
                  f"expected one hermes-atm universal wheel, found {hermes=}"
              )
          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--disable-pip-version-check",
                  "--no-deps",
                  "--requirement",
                  "tools/bootstrap-requirements.txt",
              ],
              check=True,
          )
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "--no-deps", str(graft), str(hermes[0])],
              check=True,
          )
          subprocess.run(
              [sys.executable, "-c", "import atm_graft, hermes_atm"], check=True
          )

      - name: Run Hermes graft steer boundary tests
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: python .just/run_hermes_graft_bridge_tests.py

      - name: Run ATM queue lifecycle hook tests
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: just test-queue-hooks-python

      # Codex/hermes are not used on Windows (ADR-054 AQ2.5 AC10); this leg
      # is intentionally excluded from the windows-latest matrix entry so
      # the Windows leg never runs Codex-specific hook tests at all.
      - name: Run Codex ATM queue lifecycle hook tests
        if: ${{ needs.ci-scope.outputs.runtime == 'true' && matrix.os != 'windows-latest' }}
        run: just test-queue-hooks-python-codex

      - name: Test admission-capacity benchmark runner
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: just test-admission-capacity

      - name: Run CI-only CLI/native parity fixture
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        env:
          ATM_CLI_PARITY_CI: "1"
        run: python scripts/ci/cli_native_parity.py

      - name: Run graft receiver crash/reclaim proof
        if: ${{ needs.ci-scope.outputs.runtime == 'true' }}
        run: python scripts/graft_receiver_reclaim.py

      # Historical reference only; replacement-runtime proof owns AL acceptance.
      - name: Run historical shared-host singleton smoke (reference only)
        continue-on-error: true
        if: ${{ always() && needs.ci-scope.outputs.runtime == 'true' }}
        run: python scripts/smoke/run_thorough_shared_host.py

  release-wheel-plan:
    name: Read manifest Python wheel build plan
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sdist_matrix: ${{ steps.plan.outputs.sdist_matrix }}
      rust_toolchain: ${{ steps.plan.outputs.rust_toolchain }}
      workspace_toml: ${{ steps.plan.outputs.workspace_toml }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          build_plan="$(python3 .github/scripts/release_artifacts.py build-plan --manifest release/publish-artifacts.toml)"
          echo "matrix=$(python3 .github/scripts/release_artifacts.py python-wheel-matrix --manifest release/publish-artifacts.toml)" >> "$GITHUB_OUTPUT"
          echo "sdist_matrix=$(python3 .github/scripts/release_artifacts.py python-sdist-matrix --manifest release/publish-artifacts.toml)" >> "$GITHUB_OUTPUT"
          echo "rust_toolchain=$(jq -r .rust_toolchain <<<"$build_plan")" >> "$GITHUB_OUTPUT"
          echo "workspace_toml=$(jq -r .workspace_toml <<<"$build_plan")" >> "$GITHUB_OUTPUT"
          python3 - <<'PYVERSION' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("Cargo.toml", "rb") as manifest:
              print("version=" + tomllib.load(manifest)["workspace"]["package"]["version"])
          PYVERSION

  hermes-atm-release-wheels:
    name: Release wheel (${{ matrix.name }})
    needs: [ci-scope, release-wheel-plan]
    if: ${{ needs.ci-scope.outputs.runtime == 'true' && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-wheel-plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: ./.github/actions/setup-python-release-build
        with:
          release_ref: ${{ github.sha }}
          release_version: ${{ needs.release-wheel-plan.outputs.version }}
          pyproject: ${{ matrix.pyproject }}
          build_system: ${{ matrix.build_system }}
          install_maturin_zig: ${{ matrix.os == 'ubuntu-24.04-arm' || (matrix.manylinux != '' && matrix.manylinux != 'off') }}
          rust_toolchain: ${{ needs.release-wheel-plan.outputs.rust_toolchain }}
          workspace_toml: ${{ needs.release-wheel-plan.outputs.workspace_toml }}
      - name: Build wheels (maturin)
        if: ${{ matrix.build_system == 'maturin' && matrix.target == '' && matrix.os != 'ubuntu-24.04-arm' }}
        run: maturin build --release --manifest-path ${{ matrix.cargo_manifest }} --out dist
      - name: Build ARM64 Linux wheel (maturin + Zig)
        if: ${{ matrix.build_system == 'maturin' && matrix.target == '' && matrix.os == 'ubuntu-24.04-arm' }}
        run: >-
          maturin build --release --manifest-path ${{ matrix.cargo_manifest }} --out dist
          --compatibility manylinux2014 --zig
      - name: Build declared wheel target (maturin)
        if: ${{ matrix.build_system == 'maturin' && matrix.target != '' }}
        shell: bash
        env:
          WHEEL_TARGET: ${{ matrix.target }}
          WHEEL_MANYLINUX: ${{ matrix.manylinux }}
          CARGO_MANIFEST: ${{ matrix.cargo_manifest }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          set -euo pipefail
          rustup target add "$WHEEL_TARGET"
          args=(--release --locked --manifest-path "$CARGO_MANIFEST" --out dist --target "$WHEEL_TARGET")
          if [[ "$WHEEL_MANYLINUX" != "off" ]]; then args+=(--compatibility "manylinux_${WHEEL_MANYLINUX}" --zig); fi
          maturin build "${args[@]}"
      - name: Build wheels (setuptools)
        if: ${{ matrix.build_system == 'setuptools' }}
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir dist '${{ matrix.source }}'
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.artifact }}-${{ matrix.id || matrix.os }}
          path: dist/*.whl

  hermes-atm-abi3-compat:
    name: Hermes ATM abi3 compatibility (Python ${{ matrix.python-version }})
    needs: [ci-scope, hermes-atm-release-wheels]
    if: ${{ needs.ci-scope.outputs.runtime == 'true' && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download manifest-declared Ubuntu wheel candidates
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*-ubuntu-latest
          merge-multiple: true
          path: dist

      - name: Select host-compatible abi3 wheel
        shell: python
        run: |
          import os
          import platform
          from pathlib import Path
          import sysconfig

          system = platform.system()
          machine = sysconfig.get_platform().rsplit("-", 1)[-1]
          prefixes = {"Linux": ("manylinux", "linux"), "Darwin": ("macosx",), "Windows": ("win",)}
          if system not in prefixes:
              raise RuntimeError(f"unsupported host wheel platform: {system}")
          candidates = []
          for wheel in Path("dist").glob("atm_graft*.whl"):
              tags = wheel.stem.rsplit("-", 1)[-1].split(".")
              if any(tag.startswith(prefix) and tag.endswith("_" + machine) for tag in tags for prefix in prefixes[system]):
                  candidates.append(wheel)
          if not candidates:
              raise RuntimeError("manifest wheel matrix produced no host-compatible atm-graft wheel")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              if len(candidates) != 1:
                  raise RuntimeError(f"manifest wheel matrix produced multiple host-compatible atm-graft wheels: {candidates}")
              environment.write(f"ATM_GRAFT_WHEEL={candidates[0].resolve()}\n")

      - name: Install and test abi3 wheel pair
        run: |
          python -m pip install --disable-pip-version-check --no-deps --requirement tools/bootstrap-requirements.txt
          python -m pip install --no-deps "$ATM_GRAFT_WHEEL" dist/hermes_atm*.whl
          python -c "import atm_graft, hermes_atm"
          python -m unittest discover -s crates/hermes-atm/tests -p "test_*.py"

  hermes-atm-sdist:
    name: Hermes ATM source-distribution fallback
    if: ${{ needs.ci-scope.outputs.runtime == 'true' && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-wheel-plan.outputs.sdist_matrix) }}
    needs: [ci-scope, release-wheel-plan]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-python-release-build
        with:
          release_ref: ${{ github.sha }}
          release_version: ${{ needs.release-wheel-plan.outputs.version }}
          pyproject: ${{ matrix.pyproject }}
          build_system: ${{ matrix.build_system }}
          rust_toolchain: ${{ needs.release-wheel-plan.outputs.rust_toolchain }}
          workspace_toml: ${{ needs.release-wheel-plan.outputs.workspace_toml }}
      - name: Build sdist (maturin)
        if: ${{ matrix.build_system == 'maturin' }}
        run: maturin sdist --manifest-path ${{ matrix.cargo_manifest }} --out dist
      - name: Build sdist (setuptools)
        if: ${{ matrix.build_system == 'setuptools' }}
        run: |
          python -m pip install build==1.3.0
          python -m build --sdist --outdir dist '${{ matrix.source }}'
      - name: Install atm-graft sdist in a fresh environment
        if: ${{ matrix.name == 'atm-graft' }}
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/atm-graft-sdist-venv"
          "$RUNNER_TEMP/atm-graft-sdist-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/atm-graft-sdist-venv/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/atm-graft-sdist-venv/bin/python" -c "import atm_graft"
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist-${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error
