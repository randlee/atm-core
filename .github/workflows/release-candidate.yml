name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string
      run_by_agent:
        description: "Must be 'publisher' (agent ownership assertion)"
        required: true
        default: "publisher"
        type: string

permissions:
  contents: write

jobs:
  establish-provenance:
    runs-on: ubuntu-latest
    outputs:
      release_candidate_tag: ${{ steps.candidate.outputs.tag }}
      release_candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce publisher ownership input
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ github.event.inputs.run_by_agent }}' == 'publisher' ]] \
            || { echo "Release candidate must be created by publisher." >&2; exit 1; }

      - id: candidate
        name: Reuse or create release-candidate tag from develop
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ github.event.inputs.version }}'
          release_tag="$raw"
          [[ "$release_tag" == v* ]] || release_tag="v${release_tag}"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Invalid version: '$raw' (expected X.Y.Z or vX.Y.Z)" >&2; exit 1; }
          candidate_tag="release-candidate-${release_tag}"

          git fetch origin develop --prune --tags
          develop_sha="$(git rev-parse origin/develop)"
          if git rev-parse --verify "refs/tags/${candidate_tag}" >/dev/null 2>&1; then
            candidate_sha="$(git rev-parse "${candidate_tag}^{commit}")"
            git merge-base --is-ancestor "${candidate_tag}" origin/develop \
              || { echo "${candidate_tag} is not an ancestor of origin/develop" >&2; exit 1; }
            echo "Reusing ${candidate_tag} at ${candidate_sha}; origin/develop is ${develop_sha}."
          else
            git tag -a "${candidate_tag}" origin/develop -m "Release candidate ${release_tag}"
            git push origin "refs/tags/${candidate_tag}"
            candidate_sha="${develop_sha}"
            echo "Created ${candidate_tag} at origin/develop (${candidate_sha})."
          fi
          {
            echo "tag=${candidate_tag}"
            echo "sha=${candidate_sha}"
          } >> "$GITHUB_OUTPUT"
