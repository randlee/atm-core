name: GitHub Pages

on:
  push:
    branches:
      - develop
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Report pages resolve procedure revisions from git ancestry;
          # a shallow clone selects different revisions and fails --check.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # render_procedure_pages.py imports sc_compose to render the procedure
      # pages --check compares against, so the gate cannot run without it.
      # Pinned to the same line the repo's tooling uses (bootstrap-requirements
      # pins sc-lint the same way); bump both together.
      - name: Install procedure renderer dependencies
        run: python3 -m pip install --disable-pip-version-check sc-compose==1.8.0

      - name: Verify generated site pages and links
        run: |
          python3 .just/check_site_generated.py
          python3 .just/check_site_links.py

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
