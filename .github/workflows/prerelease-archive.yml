name: Prerelease Archive

on:
  push:
    tags: ["prerelease/v*.*.*"]

permissions:
  contents: read

concurrency:
  group: prerelease-archive-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      rust_toolchain: ${{ steps.version.outputs.rust_toolchain }}
      matrix: ${{ steps.matrix.outputs.value }}
      workspace_toml: ${{ steps.version.outputs.workspace_toml }}
      has_python_wheels: ${{ steps.version.outputs.has_python_wheels }}
      has_python_sdists: ${{ steps.version.outputs.has_python_sdists }}
      python_wheel_matrix: ${{ steps.matrix.outputs.python_wheel_matrix }}
      python_sdist_matrix: ${{ steps.matrix.outputs.python_sdist_matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prefix="$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('release/publish-artifacts.toml','rb'))['prerelease']['tag_prefix'])
          PY
          )"
          [[ "$tag" == "$prefix"* ]] || { echo "unexpected prerelease tag: $tag" >&2; exit 1; }
          version="${tag#"$prefix"}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid prerelease version" >&2; exit 1; }
          plan="$(python3 .github/scripts/release_artifacts.py build-plan --manifest "$RELEASE_ARTIFACT_MANIFEST")"
          workspace="$(jq -r .workspace_toml <<<"$plan")"
          rust_toolchain="$(jq -r .rust_toolchain <<<"$plan")"
          has_python_wheels="$(jq -r .has_python_wheels <<<"$plan")"
          has_python_sdists="$(jq -r .has_python_sdists <<<"$plan")"
          python3 .github/scripts/release_artifacts.py validate-manifest --manifest "$RELEASE_ARTIFACT_MANIFEST" --workspace-toml "$workspace"
          python3 .github/scripts/release_artifacts.py verify-version --manifest "$RELEASE_ARTIFACT_MANIFEST" --workspace-toml "$workspace" --version "$version"
          python3 .github/scripts/release_artifacts.py verify-version-lockstep --manifest "$RELEASE_ARTIFACT_MANIFEST" --workspace-toml "$workspace"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "rust_toolchain=$rust_toolchain" >> "$GITHUB_OUTPUT"
          echo "workspace_toml=$workspace" >> "$GITHUB_OUTPUT"
          echo "has_python_wheels=$has_python_wheels" >> "$GITHUB_OUTPUT"
          echo "has_python_sdists=$has_python_sdists" >> "$GITHUB_OUTPUT"
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 .github/scripts/release_artifacts.py release-target-matrix --manifest "$RELEASE_ARTIFACT_MANIFEST")"
          echo "value=$matrix" >> "$GITHUB_OUTPUT"
          echo "python_wheel_matrix=$(python3 .github/scripts/release_artifacts.py python-wheel-matrix --manifest "$RELEASE_ARTIFACT_MANIFEST")" >> "$GITHUB_OUTPUT"
          echo "python_sdist_matrix=$(python3 .github/scripts/release_artifacts.py python-sdist-matrix --manifest "$RELEASE_ARTIFACT_MANIFEST")" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.rust_toolchain }}
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}

      - name: Install Linux native build deps
        uses: ./.github/actions/install-linux-native-deps

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-prerelease-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          bins="$(python3 .github/scripts/release_artifacts.py cargo-build-bin-args --manifest "$RELEASE_ARTIFACT_MANIFEST")"
          cargo build --release --target "${{ matrix.target }}" $bins

      - name: Package manifest-declared prerelease archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import sys
          import subprocess
          import tarfile
          import zipfile

          target_name = "${{ matrix.target }}"
          version = "${{ needs.plan.outputs.version }}"
          config = json.loads(
              subprocess.check_output(
                  [
                      sys.executable,
                      ".github/scripts/release_artifacts.py",
                      "release-package-config",
                      "--manifest",
                      os.environ["RELEASE_ARTIFACT_MANIFEST"],
                      "--target",
                      target_name,
                  ],
                  text=True,
              )
          )
          project = config["project"]
          target = config["target"]
          stage = Path(f"{project['archive_prefix']}_{version}_{target_name}")
          if stage.exists():
              shutil.rmtree(stage)
          (stage / "bin").mkdir(parents=True)
          for binary in config["binaries"]:
              filename = binary["name"] + (".exe" if "windows" in target_name else "")
              shutil.copy2(Path("target") / target_name / "release" / filename, stage / "bin" / filename)
              for bundled_path in binary.get("bundled_paths", []):
                  source = Path(bundled_path["source"])
                  destination = stage / bundled_path["destination"]
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copytree(source, destination, dirs_exist_ok=True)
          archive = Path(f"{stage}.{target['archive']}")
          if target["archive"] == "tar.gz":
              with tarfile.open(archive, "w:gz") as output:
                  output.add(stage, arcname=stage.name)
          elif target["archive"] == "zip":
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
                  for item in stage.rglob("*"):
                      if item.is_file():
                          output.write(item, item.relative_to(stage.parent))
          else:
              raise SystemExit(f"unsupported archive type: {target['archive']}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"ARCHIVE={archive}\n")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
  build-python-wheels:
    needs: plan
    if: ${{ needs.plan.outputs.has_python_wheels == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.python_wheel_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: ./.github/actions/setup-python-release-build
        with:
          release_ref: ${{ needs.plan.outputs.source_sha }}
          release_version: ${{ needs.plan.outputs.version }}
          pyproject: ${{ matrix.pyproject }}
          build_system: ${{ matrix.build_system }}
          install_maturin_zig: ${{ matrix.os == 'ubuntu-24.04-arm' || (matrix.manylinux != '' && matrix.manylinux != 'off') }}
          rust_toolchain: ${{ needs.plan.outputs.rust_toolchain }}
          workspace_toml: ${{ needs.plan.outputs.workspace_toml }}
      - name: Build wheels (maturin)
        if: ${{ matrix.build_system == 'maturin' && matrix.target == '' && matrix.os != 'ubuntu-24.04-arm' }}
        run: maturin build --release --manifest-path ${{ matrix.cargo_manifest }} --out dist
      - name: Build ARM64 Linux wheel (maturin + Zig)
        if: ${{ matrix.build_system == 'maturin' && matrix.target == '' && matrix.os == 'ubuntu-24.04-arm' }}
        run: >-
          maturin build --release --manifest-path ${{ matrix.cargo_manifest }} --out dist
          --compatibility manylinux2014 --zig
      - name: Build declared wheel target (maturin)
        if: ${{ matrix.build_system == 'maturin' && matrix.target != '' }}
        shell: bash
        env:
          WHEEL_TARGET: ${{ matrix.target }}
          WHEEL_MANYLINUX: ${{ matrix.manylinux }}
          CARGO_MANIFEST: ${{ matrix.cargo_manifest }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          set -euo pipefail
          rustup target add "$WHEEL_TARGET"
          args=(--release --locked --manifest-path "$CARGO_MANIFEST" --out dist --target "$WHEEL_TARGET")
          if [[ "$WHEEL_MANYLINUX" != "off" ]]; then
            args+=(--compatibility "manylinux_${WHEEL_MANYLINUX}" --zig)
          fi
          maturin build "${args[@]}"
      - name: Build wheels (setuptools)
        if: ${{ matrix.build_system == 'setuptools' }}
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir dist '${{ matrix.source }}'
      - name: Verify declared wheel platform
        if: ${{ matrix.platform != '' }}
        env:
          WHEEL_PLATFORM: ${{ matrix.platform }}
        run: python3 .github/scripts/release_python.py --asset-dir dist --platform "$WHEEL_PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.artifact }}-${{ matrix.id || matrix.os }}
          path: dist/*.whl
  build-python-sdists:
    needs: plan
    if: ${{ needs.plan.outputs.has_python_sdists == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.python_sdist_matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-python-release-build
        with:
          release_ref: ${{ needs.plan.outputs.source_sha }}
          release_version: ${{ needs.plan.outputs.version }}
          pyproject: ${{ matrix.pyproject }}
          build_system: ${{ matrix.build_system }}
          rust_toolchain: ${{ needs.plan.outputs.rust_toolchain }}
          workspace_toml: ${{ needs.plan.outputs.workspace_toml }}
      - name: Build sdist (maturin)
        if: ${{ matrix.build_system == 'maturin' }}
        run: maturin sdist --manifest-path ${{ matrix.cargo_manifest }} --out dist
      - name: Build sdist (setuptools)
        if: ${{ matrix.build_system == 'setuptools' }}
        run: |
          python -m pip install build==1.3.0
          python -m build --sdist --outdir dist '${{ matrix.source }}'
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist-${{ matrix.artifact }}
          path: dist/*.tar.gz
  release:
    needs: [plan, build, build-python-wheels, build-python-sdists]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: "*"
      - name: Generate checksums and publish GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          find assets -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.whl' \) -exec cp -n {} . \;
          python3 .github/scripts/release_artifacts.py verify-python-release-assets --manifest "$RELEASE_ARTIFACT_MANIFEST" --asset-dir .
          mapfile -t assets_to_publish < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.whl' \) -print | sed 's#^./##' | sort -u)
          ((${#assets_to_publish[@]} > 0)) || { echo "no prerelease assets were downloaded" >&2; exit 1; }
          shasum -a 256 "${assets_to_publish[@]}" > checksums.txt
          tag="${GITHUB_REF_NAME}"
          if gh release create "$tag" --prerelease --title "$tag" --generate-notes "${assets_to_publish[@]}" checksums.txt; then
            exit 0
          fi

          echo "release creation did not win; verifying an identical existing prerelease"
          metadata="$(gh release view "$tag" --json isDraft,isPrerelease,assets)"
          [[ "$(jq -r .isPrerelease <<<"$metadata")" == "true" ]] || { echo "$tag is not a prerelease" >&2; exit 1; }
          [[ "$(jq -r .isDraft <<<"$metadata")" == "false" ]] || { echo "$tag is still a draft" >&2; exit 1; }
          expected_assets="$(printf '%s\n' "${assets_to_publish[@]}" checksums.txt | sort)"
          actual_assets="$(jq -r '.assets[].name' <<<"$metadata" | sort)"
          [[ "$actual_assets" == "$expected_assets" ]] || { echo "$tag has a different asset set" >&2; exit 1; }
          mkdir existing-release
          gh release download "$tag" --pattern checksums.txt --dir existing-release
          cmp checksums.txt existing-release/checksums.txt || { echo "$tag has different archive checksums" >&2; exit 1; }
          echo "existing prerelease $tag is identical; concurrent run converged"
