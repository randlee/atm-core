name: Setup sc-lint
description: >-
  Install and verify the pinned sc-lint release and sibling analyzers, or an
  explicitly selected immutable source revision. Release defaults retain the
  shared ecosystem pin and .just utilities; source mode builds the same-commit
  Python wheel into the consumer .sc-lint/venv.
inputs:
  source-revision:
    description: Optional full immutable commit SHA; alternatively project.sc_lint_source_revision in the rendered release manifest
    required: false
    default: ""
  version:
    description: Released sc-lint version to install (deliberate ecosystem pin)
    required: false
    default: "0.4.0"
  repository:
    description: GitHub repository slug hosting sc-lint releases
    required: false
    default: "randlee/sc-lint"
runs:
  using: composite
  steps:
    - name: Resolve immutable sc-lint source (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        if [ -n "$SC_LINT_SOURCE_REVISION_INPUT" ] || grep -q sc_lint_source_revision release/publish-artifacts.toml 2>/dev/null || [ -f .sc-lint/source-install.json ]; then
          python3 .github/scripts/setup_sc_lint_source.py resolve
        else
          echo 'SC_LINT_SOURCE_REVISION=' >> "$GITHUB_ENV"
        fi
    - name: Resolve immutable sc-lint source (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        $manifest = 'release/publish-artifacts.toml'
        $declared = (Test-Path $manifest) -and (Select-String -Quiet -Pattern sc_lint_source_revision -Path $manifest)
        if ($env:SC_LINT_SOURCE_REVISION_INPUT -or $declared -or (Test-Path '.sc-lint/source-install.json')) {
          python .github/scripts/setup_sc_lint_source.py resolve
        } else {
          Add-Content -Path $env:GITHUB_ENV -Value 'SC_LINT_SOURCE_REVISION='
        }
    - name: Install immutable sc-lint source (Unix)
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION != ''
      shell: bash
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: python3 .github/scripts/setup_sc_lint_source.py install
    - name: Install immutable sc-lint source (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION != ''
      shell: pwsh
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: python .github/scripts/setup_sc_lint_source.py install
    - name: Install sc-lint release (Unix)
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: bash
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        case "${RUNNER_OS}:${RUNNER_ARCH}" in
          Linux:X64) target="x86_64-unknown-linux-gnu" ;;
          macOS:X64) target="x86_64-apple-darwin" ;;
          macOS:ARM64) target="aarch64-apple-darwin" ;;
          *)
            echo "sc-lint setup: unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac
        archive="sc-lint_${SC_LINT_VERSION}_${target}.tar.gz"
        url="https://github.com/${SC_LINT_REPOSITORY}/releases/download/v${SC_LINT_VERSION}/${archive}"
        install_dir="${RUNNER_TEMP}/sc-lint-${SC_LINT_VERSION}/${target}"
        mkdir -p "${install_dir}"
        curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
          --output "${RUNNER_TEMP}/${archive}" "${url}" || {
          echo "sc-lint setup: could not download ${url}; verify that release v${SC_LINT_VERSION} publishes this runner asset" >&2
          exit 1
        }
        tar -xzf "${RUNNER_TEMP}/${archive}" -C "${install_dir}"
        test -x "${install_dir}/sc-lint" || {
          echo "sc-lint setup: release archive is missing executable sc-lint" >&2
          exit 1
        }
        for backend in sc-lint-boundary sc-lint-portability sc-lint-runtime; do
          test -x "${install_dir}/${backend}" || {
            echo "sc-lint setup: release archive is missing sibling backend ${backend}" >&2
            exit 1
          }
        done
        echo "${install_dir}" >> "${GITHUB_PATH}"
    - name: Install sc-lint release (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: pwsh
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:RUNNER_ARCH -ne 'X64') {
          throw "sc-lint setup: unsupported Windows architecture $env:RUNNER_ARCH"
        }
        $target = 'x86_64-pc-windows-msvc'
        $archive = "sc-lint_$env:SC_LINT_VERSION`_$target.zip"
        $url = "https://github.com/$env:SC_LINT_REPOSITORY/releases/download/v$env:SC_LINT_VERSION/$archive"
        $installDir = Join-Path $env:RUNNER_TEMP "sc-lint-$env:SC_LINT_VERSION\$target"
        New-Item -ItemType Directory -Force -Path $installDir | Out-Null
        $archivePath = Join-Path $env:RUNNER_TEMP $archive
        try {
          Invoke-WebRequest -Uri $url -OutFile $archivePath
        } catch {
          throw "sc-lint setup: could not download $url; verify that release v$env:SC_LINT_VERSION publishes this runner asset. $($_.Exception.Message)"
        }
        Expand-Archive -Path $archivePath -DestinationPath $installDir -Force
        foreach ($binary in @('sc-lint.exe', 'sc-lint-boundary.exe', 'sc-lint-portability.exe', 'sc-lint-runtime.exe')) {
          if (-not (Test-Path (Join-Path $installDir $binary))) {
            throw "sc-lint setup: release archive is missing sibling backend $binary"
          }
        }
        Add-Content -Path $env:GITHUB_PATH -Value $installDir
    - name: Verify sc-lint version contract
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: bash
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        version_json="$(sc-lint version --json)"
        jq -e --arg expected "${SC_LINT_VERSION}" \
          '.ok == true and .data.crate_version == $expected' \
          <<<"${version_json}" >/dev/null || {
          echo "sc-lint setup: version contract failed; expected ${SC_LINT_VERSION}" >&2
          exit 1
        }
    - name: Verify sc-lint version contract (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: pwsh
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        $value = sc-lint version --json | ConvertFrom-Json
        if (-not $value.ok -or $value.data.crate_version -ne $env:SC_LINT_VERSION) {
          throw "sc-lint setup: expected version $env:SC_LINT_VERSION, got $($value.data.crate_version)"
        }
    - name: Materialize pinned sc-lint Python utilities (Unix)
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: bash
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/sc-lint-source-${SC_LINT_VERSION}.tar.gz"
        source_root="${RUNNER_TEMP}/sc-lint-source-${SC_LINT_VERSION}"
        mkdir -p "${source_root}"
        curl --fail --location --retry 4 --retry-all-errors --silent --show-error \
          --output "${archive}" \
          "https://github.com/${SC_LINT_REPOSITORY}/archive/refs/tags/v${SC_LINT_VERSION}.tar.gz"
        tar -xzf "${archive}" -C "${source_root}" --strip-components=1
        mkdir -p "${GITHUB_WORKSPACE}/.just"
        cp "${source_root}/.just/"*.py "${GITHUB_WORKSPACE}/.just/"
        printf '%s\n' "${SC_LINT_VERSION}" > "${GITHUB_WORKSPACE}/.just/.sc-lint-runtime-version"
        test -f "${GITHUB_WORKSPACE}/.just/run_lint.py"
    - name: Materialize pinned sc-lint Python utilities (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: pwsh
      env:
        SC_LINT_VERSION: ${{ inputs.version }}
        SC_LINT_REPOSITORY: ${{ inputs.repository }}
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path $env:RUNNER_TEMP "sc-lint-source-$env:SC_LINT_VERSION.zip"
        $sourceRoot = Join-Path $env:RUNNER_TEMP "sc-lint-source-$env:SC_LINT_VERSION"
        Invoke-WebRequest -Uri "https://github.com/$env:SC_LINT_REPOSITORY/archive/refs/tags/v$env:SC_LINT_VERSION.zip" -OutFile $archive
        Expand-Archive -Path $archive -DestinationPath $sourceRoot -Force
        $extracted = Get-ChildItem -Directory $sourceRoot | Select-Object -First 1
        $justRoot = Join-Path $env:GITHUB_WORKSPACE '.just'
        New-Item -ItemType Directory -Force -Path $justRoot | Out-Null
        Copy-Item (Join-Path $extracted.FullName '.just\*.py') $justRoot -Force
        Set-Content -Path (Join-Path $justRoot '.sc-lint-runtime-version') -Value $env:SC_LINT_VERSION -NoNewline
        if (-not (Test-Path (Join-Path $justRoot 'run_lint.py'))) {
          throw 'sc-lint setup: source archive is missing .just/run_lint.py'
        }
    - name: Smoke-test repository root discovery (Unix)
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: bash
      run: |
        set -euo pipefail
        root="${GITHUB_WORKSPACE:-${PWD}}"
        smoke_json="$(sc-lint --json --root "${root}" lint sc-boundary)"
        jq -e '.ok == true and (.error.code // "") != "CLI.CONFIG_ERROR"' \
          <<<"${smoke_json}" >/dev/null || {
          echo "sc-lint setup: root discovery failed or returned CLI.CONFIG_ERROR" >&2
          exit 1
        }
    - name: Smoke-test repository root discovery (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION == ''
      shell: pwsh
      run: |
        $root = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
        $value = sc-lint --json --root $root lint sc-boundary | ConvertFrom-Json
        if (-not $value.ok -or $value.error.code -eq 'CLI.CONFIG_ERROR') {
          throw "sc-lint root discovery failed: $($value | ConvertTo-Json -Compress)"
        }
    - name: Verify source sc-lint consumer semantics (Unix)
      if: runner.os != 'Windows' && env.SC_LINT_SOURCE_REVISION != ''
      shell: bash
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
      run: python3 .github/scripts/setup_sc_lint_source.py smoke
    - name: Verify source sc-lint consumer semantics (Windows)
      if: runner.os == 'Windows' && env.SC_LINT_SOURCE_REVISION != ''
      shell: pwsh
      env:
        SC_LINT_SOURCE_REVISION_INPUT: ${{ inputs.source-revision }}
      run: python .github/scripts/setup_sc_lint_source.py smoke
