name: Setup lint toolchain
description: Install sc-lint plus the cargo-deny/cargo-shear/codespell tools required by cargo test --workspace
inputs:
  sc-lint-version:
    description: Released sc-lint version to install
    required: false
    default: "0.4.0"
  include-sc-lint:
    description: Install the externally released sc-lint bundle
    required: false
    default: "true"
  cargo-deny-version:
    description: Pinned cargo-deny version
    required: false
    default: "0.19.4"
  cargo-shear-version:
    description: Pinned cargo-shear version
    required: false
    default: "1.13.3"
  codespell-version:
    description: Pinned codespell version
    required: false
    default: "2.4.2"
runs:
  using: composite
  steps:
    - name: Set up sc-lint
      if: inputs.include-sc-lint == 'true'
      uses: ./.github/actions/setup-sc-lint
      with:
        version: ${{ inputs.sc-lint-version }}

    - name: Install cargo-deny
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny@${{ inputs.cargo-deny-version }}

    - name: Install cargo-shear
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-shear@${{ inputs.cargo-shear-version }}

    - name: Install codespell (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: python3 -m pip install --break-system-packages codespell==${{ inputs.codespell-version }}

    - name: Install codespell (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: python -m pip install codespell==${{ inputs.codespell-version }}
