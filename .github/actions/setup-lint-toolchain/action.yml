name: Setup lint toolchain
description: Install the cargo-deny/cargo-shear/codespell tools required by cargo test --workspace
inputs:
  cargo-deny-version:
    description: Pinned cargo-deny version
    required: false
    default: "0.19.4"
  cargo-shear-version:
    description: Pinned cargo-shear version
    required: false
    default: "1.13.3"
  codespell-version:
    description: Pinned codespell version
    required: false
    default: "2.4.2"
runs:
  using: composite
  steps:
    # Release-branch fix (v1.4.4, upstream sc-publish#67): sc-lint is a lint
    # tool owned by repo CI; the publish preflight must not install or gate on
    # it. The setup-sc-lint step is removed here pending upstream deletion.
    - name: Install cargo-deny
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny@${{ inputs.cargo-deny-version }}

    - name: Install cargo-shear
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-shear@${{ inputs.cargo-shear-version }}

    - name: Install codespell (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: python3 -m pip install --break-system-packages codespell==${{ inputs.codespell-version }}

    - name: Install codespell (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: python -m pip install codespell==${{ inputs.codespell-version }}
