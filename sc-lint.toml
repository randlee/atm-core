[tool.sc-lint]
minimum_version = "0.7.0"

[tool.sc-lint.analyzers.boundary]
enabled = false
reason = "Phase BG-2 owns boundary analyzer migration."

[tool.sc-lint.analyzers.portability]
config_home_env = "ATM_CONFIG_HOME"
enabled = true
exclude_paths = ["crates/atm-core/src/doctor/herdr_state.rs", "crates/atm-herdr/src/transport.rs", "crates/atm-herdr/src/transport_socket.rs", "crates/atm-core/src/atm_temp.rs", "crates/atm-core/src/atm_temp_sweeper.rs", "crates/atm-core/src/descriptor_limit.rs", "crates/atm-core/src/persistence.rs", "crates/atm-core/src/transfer_script.rs", "crates/atm-daemon-bootstrap/src/lib.rs", "crates/atm-daemon-client/src/lib.rs", "crates/atm-http-runtime/src/client.rs", "crates/atm-http-runtime/src/client_tail.rs", "crates/atm-http-runtime/src/http1_server.rs", "crates/atm-http-runtime/src/lib.rs", "crates/atm-http-runtime/src/loopback_tcp.rs", "crates/atm-http-runtime/src/runtime_listener.rs", "crates/atm-http-runtime/src/runtime_setup.rs", "crates/atm-http-runtime/src/unix_socket.rs", "crates/atm/src/main.rs"]
reason = "PORT-007 exact Windows named-pipe namespace files are tracked by sc-lint#192 and atm-phase-bg.2; PORT-010 exact Unix adapter implementation files are tracked by sc-lint#372 and atm-phase-bg.3. Re-enable each rule on these files when the analyzer supports narrow reviewed platform exceptions."
targets = ["linux", "macos", "windows"]
unix_path_prefixes = ["/tmp/", "/home/", "/usr/", "/etc/"]

[tool.sc-lint.analyzers.runtime]
enabled = false
reason = "Published sc-lint runtime analysis is not runnable until randlee/sc-lint#373 ships; retain the vendored runtime-waits check until bg-6 performs the cutover."

