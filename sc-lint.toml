[tool.sc-lint]
minimum_version = "0.7.0"

[tool.sc-lint.analyzers.boundary]
enabled = false
reason = "Phase BG-2 owns boundary analyzer migration."

[tool.sc-lint.analyzers.portability]
enabled = false
reason = "Phase BG-3 owns portability analyzer migration."
targets = ["linux", "macos", "windows"]

[tool.sc-lint.analyzers.runtime]
enabled = false
reason = "Phase BG-4 owns runtime analyzer migration."

[[tool.sc-lint.lint]]
name = "adr-index"
command = ["just", "_py", ".just/run_lint.py", "adr-index"]

