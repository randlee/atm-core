reason = "Boundary inventory, crate cycles, forbidden crate edges, and composition-root policy for the atm-core workspace."

[tool.sc-lint.analyzers.portability]
config_home_env = "ATM_CONFIG_HOME"
enabled = true
targets = ["linux", "macos", "windows"]
unix_path_prefixes = ["/tmp/", "/home/", "/usr/", "/etc/"]

[tool.sc-lint.analyzers.runtime]
enabled = true
exclude_paths_by_rule = { "SCB-RUNTIME-003" = ["crates/atm/src/commands/internal_nudge.rs", "crates/atm-daemon-client/src/lib.rs"] }
reason = "SCB-RUNTIME-003: internal_nudge.rs tmux delays and subprocess polling run on spawn_blocking, outside Tokio tasks. atm-daemon-client/src/lib.rs launch gate and publication polling are synchronous client APIs, with no production callers in the workspace. See randlee/sc-lint#82."

[tool.sc-lint.lint_profiles]
ci = ["adr-index", "arch-gates", "atm-graft-python-boundary", "boundaries", "capability-degradation", "clippy", "clippy-windows", "daemon-signing-coupling", "daemon-singleton", "deny-linux", "deny-macos", "deny-windows", "env-var-boundary", "fixed-sleep", "fmt", "function-length", "hermes-adapter", "hermes-atm-boundary", "identities", "kit-drift", "legacy-mailbox-paths", "legacy-transport-removal", "lines", "manifests-linux", "manifests-macos", "manifests-windows", "nudge-taxonomy", "peer-dial-seam", "pytests", "read-concurrency-gates", "runtime-observation-boundary", "runtime-stderr", "same-host-portability", "sc-boundary", "sc-portability", "sc-runtime", "shear-linux", "shear-macos", "shear-windows", "silent-emit", "site-generated", "site-links", "spell-linux", "spell-macos", "spell-windows", "template-frontmatter", "ttl-triage", "version"]

