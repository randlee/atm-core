[tool.sc-lint]
minimum_version = "0.8.0"

[tool.sc-lint.analyzers.boundary]
enabled = true
fail_rules = ["SCB-DEPENDENCY-001", "SCB-DEPENDENCY-002", "SCB-CYCLE-002", "SCB-CYCLE-003"]
reason = "Boundary inventory, crate cycles and forbidden crate edges for the atm-core workspace."

[tool.sc-lint.analyzers.portability]
config_home_env = "ATM_CONFIG_HOME"
enabled = true
exclude_paths_by_rule = { "PORT-006" = ["crates/atm-daemon-bootstrap/src/peer_launch_config.rs"], "PORT-007" = ["crates/atm-core/src/doctor/herdr_state.rs", "crates/atm-herdr/src/transport.rs", "crates/atm-herdr/src/transport_socket.rs"], "PORT-008" = ["crates/atm-daemon-bootstrap/src/peer_launch_config.rs"], "PORT-010" = ["crates/atm-core/src/atm_temp.rs", "crates/atm-core/src/atm_temp_sweeper.rs", "crates/atm-core/src/descriptor_limit.rs", "crates/atm-core/src/persistence.rs", "crates/atm-core/src/transfer_script.rs", "crates/atm-daemon-bootstrap/src/lib.rs", "crates/atm-daemon-client/src/lib.rs", "crates/atm-http-runtime/src/client.rs", "crates/atm-http-runtime/src/client_tail.rs", "crates/atm-http-runtime/src/http1_server.rs", "crates/atm-http-runtime/src/lib.rs", "crates/atm-http-runtime/src/loopback_tcp.rs", "crates/atm-http-runtime/src/runtime_listener.rs", "crates/atm-http-runtime/src/runtime_setup.rs", "crates/atm-http-runtime/src/unix_socket.rs", "crates/atm/src/main.rs", "crates/atm-daemon-bootstrap/src/peer_launch_config.rs", "crates/atm-daemon-bootstrap/src/protected_trust_root.rs", "crates/atm-herdr/src/transport_socket.rs"] }
reason = "Every remaining exception is rule-scoped: crates/atm-herdr/src/transport_socket.rs remains under PORT-007 for its \\?\\ paths until randlee/sc-lint#192 and under PORT-010 for its paired Unix helper until randlee/sc-lint#372; crates/atm-http-runtime/src/unix_socket.rs remains under PORT-010 until randlee/sc-lint#372 because loopback_tcp.rs is not an out-of-line Windows adapter. peer_launch_config.rs PORT-006/PORT-008 has the platform-neutral path/identity remediation tracked by randlee/sc-lint#372. No analyzer-wide portability exclusion remains."
targets = ["linux", "macos", "windows"]
unix_path_prefixes = ["/tmp/", "/home/", "/usr/", "/etc/"]

[tool.sc-lint.analyzers.runtime]
enabled = true
reason = "Published sc-lint 0.8.0 runtime analyzer replaces the repository-local runtime-waits checker."

