# Agent registry for plan-anchoring, installed as .cursor/skills/plan-anchoring/registry.yaml.
# Paths are relative to the install root (the folder install.py --dest named).
agents:
  anchor-plan-review:
    version: 0.10.1
    path: .cursor/agents/anchor-plan-review.md
  anchor-sprint-review:
    version: 0.10.1
    path: .cursor/agents/anchor-sprint-review.md
  anchor-tuning:
    version: 0.10.1
    path: .cursor/agents/anchor-tuning.md

skills:
  plan-anchoring:
    version: 0.10.1
    path: .cursor/skills/plan-anchoring/SKILL.md
    depends_on:
      anchor-plan-review: "0.x"
      anchor-sprint-review: "0.x"
      anchor-tuning: "0.x"
