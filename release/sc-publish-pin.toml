# sc-publish pin manifest (convention: copy to release/sc-publish-pin.toml).
#
# Records the exact upstream kit revision this repository is qualified
# against. Every consumer repository pins one qualified 40-character commit
# SHA; nothing tracks a moving branch. Advance the pin only to a revision
# that has passed the qualification checklist in README.sc-publish.md, and
# advance all consumer repositories together when the org blesses a new
# revision.

[sc-publish]
repository = "https://github.com/randlee/sc-publish"
# The org-blessed, consumer-qualified kit revision (full 40-character SHA).
revision = "cbb9ce0858d168397421fa1d603a0ebfd5e19ac9"
# The consumer tree is unchanged canonical-installer output of this exact
# revision; rendered manifests come from the consumer input below. No shared
# kit file is hand-edited in this repository.
