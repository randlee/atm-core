[workspace]
members = [
    "crates/atm-architecture",
    "crates/atm-error",
    "crates/atm-storage",
    "crates/atm-storage-sqlserver-proof",
    "crates/atm-core",
    "crates/atm-http-runtime",
    "crates/atm-runtime",
    "crates/atm-runtime-test-support",
    "crates/atm",
    "crates/atm-daemon-bootstrap",
    "crates/atm-daemon-client",
    "crates/atm-peer-tls-interop",
    "crates/peer-tls",
    "crates/atm-graft",
    "crates/atm-graft-python",
    "crates/atm-query-python",
    "crates/sc-lint-boundary",
    "crates/sc-lint-directives",
    "crates/atm-daemon",
    "crates/atm-storage-rusqlite",
    "crates/atm-template-sc-compose",
]
resolver = "2"

[workspace.package]
version = "1.4.4"
edition = "2024"
rust-version = "1.94.1"
authors = ["atm-core contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/randlee/atm-core"
homepage = "https://github.com/randlee/atm-core"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
cargo_metadata = "0.23"
sc-observability = "1.2.0"
sc-observability-types = "1.2.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
x509-parser = "0.16"
zeroize = "1"
tokio = { version = "1.48", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1.8", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["server", "service", "tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tower = { version = "0.5", default-features = false, features = ["limit", "load-shed", "util"] }
sha2 = "0.10"
ulid = { version = "1.2.1", features = ["serde"] }
base64 = "0.22"
getrandom = "0.3"
syn = { version = "2", features = ["full", "visit"] }
semver = { version = "1", features = ["serde"] }
async-trait = "0.1"
