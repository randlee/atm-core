[workspace]
members = [
    "crates/atm-core",
    "crates/atm",
    "crates/sc-lint-attributes",
    "crates/sc-lint-boundary",
    "crates/atm-daemon",
    "crates/atm-rusqlite",
]
resolver = "2"

[workspace.package]
version = "1.1.2"
edition = "2024"
rust-version = "1.94.1"
authors = ["atm-core contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/randlee/atm-core"
homepage = "https://github.com/randlee/atm-core"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }
cargo_metadata = "0.23"
