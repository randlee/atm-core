[workspace]
members = [
    "crates/atm-architecture",
    "crates/atm-error",
    "crates/atm-storage",
    "crates/atm-storage-sqlserver-proof",
    "crates/atm-core",
    "crates/atm-runtime",
    "crates/atm-runtime-test-support",
    "crates/atm",
    "crates/atm-daemon-bootstrap",
    "crates/atm-daemon-client",
    "crates/atm-graft",
    "crates/atm-graft-python",
    "crates/sc-lint-attributes",
    "crates/sc-lint-boundary",
    "crates/sc-lint-directives",
    "crates/atm-daemon",
    "crates/atm-storage-rusqlite",
]
resolver = "2"

[workspace.package]
version = "1.4.0-beta"
edition = "2024"
rust-version = "1.94.1"
authors = ["atm-core contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/randlee/atm-core"
homepage = "https://github.com/randlee/atm-core"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
cargo_metadata = "0.23"
sc-observability = "1.2.0"
sc-observability-types = "1.2.0"
arc-swap = "1.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
ulid = { version = "1.2.1", features = ["serde"] }
base64 = "0.22"
getrandom = "0.3"
syn = { version = "2", features = ["full", "visit"] }
semver = { version = "1", features = ["serde"] }
