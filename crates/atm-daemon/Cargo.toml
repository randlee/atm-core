[package]
name = "atm-daemon"
autolib = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "ATM daemon runtime crate scaffold."
repository.workspace = true
homepage.workspace = true

[dependencies]
tokio.workspace = true
sc-observability.workspace = true
sc-observability-types.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
tracing.workspace = true
atm-core = { package = "agent-team-mail-core", path = "../atm-core", version = "1.4.1-beta-ai-1", features = ["test-utils"] }
atm-daemon-bootstrap = { path = "../atm-daemon-bootstrap", version = "1.4.1-beta-ai-1" }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
