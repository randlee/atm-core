[package]
name = "atm-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "ATM daemon runtime crate scaffold."
repository.workspace = true
homepage.workspace = true

[dependencies]
ulid.workspace = true
atm-core = { package = "agent-team-mail-core", path = "../atm-core", version = "1.4.0-beta-ai.37" }
atm-daemon-bootstrap = { path = "../atm-daemon-bootstrap", version = "1.4.0-beta-ai.37" }
atm-runtime = { path = "../atm-runtime", version = "1.4.0-beta-ai.37" }
atm-storage = { path = "../atm-storage", version = "1.4.0-beta-ai.37" }
arc-swap.workspace = true
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
interprocess = "2.4.2"
sc-observability.workspace = true
sc-observability-types.workspace = true
serde_json.workspace = true
rustls.workspace = true
sha2.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
signal-hook = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[dev-dependencies]
atm-core = { package = "agent-team-mail-core", path = "../atm-core", version = "1.4.0-beta-ai.37", features = ["test-utils"] }
atm-daemon-client = { path = "../atm-daemon-client", version = "1.4.0-beta-ai.37" }
atm-runtime = { path = "../atm-runtime", version = "1.4.0-beta-ai.37", features = ["test-utils"] }
atm-runtime-test-support = { path = "../atm-runtime-test-support" }
sc-observability = { workspace = true, features = ["fault-injection"] }
serial_test = "3"
tempfile = "3"
rcgen = "0.13"
