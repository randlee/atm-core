[package]
name = "atm-cron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Persistent cron scheduling through ATM's sealed scheduler boundary."

[features]
test-utils = ["atm-core/test-utils"]

[dependencies]
async-trait.workspace = true
atm-core.workspace = true
chrono = { version = "0.4", features = ["serde"] }
cron.workspace = true
getrandom.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
atm-core = { workspace = true, features = ["test-utils"] }
atm-runtime-test-support.workspace = true
syn.workspace = true
tokio.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }

[[test]]
name = "worker"
required-features = ["test-utils"]

[[test]]
name = "expr"
required-features = ["test-utils"]
