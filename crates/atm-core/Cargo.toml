[package]
name = "agent-team-mail-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for local agent team mail workflows."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agent-team-mail-core"
readme = "../../README.md"
keywords = ["agent", "mail", "workflow", "teams", "local"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "atm_core"

[features]
test-utils = []

[dependencies]
atm-error = { path = "../atm-error", version = "1.4.0-beta-ai.38" }
atm-storage = { path = "../atm-storage", version = "1.4.0-beta-ai.38" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
interprocess = "2.4.2"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
parking_lot = "0.12"
ulid.workspace = true
base64.workspace = true
getrandom.workspace = true
semver.workspace = true
fs2 = "0.4"

[dev-dependencies]
atm-runtime-test-support = { path = "../atm-runtime-test-support" }
serial_test = "3"
tempfile = "3"
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell"] }
