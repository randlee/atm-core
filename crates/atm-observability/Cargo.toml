[package]
name = "atm-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared retained-log bootstrap helpers for ATM process adapters."
repository.workspace = true
homepage.workspace = true

[dependencies]
atm-core.workspace = true
atm-runtime.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
sha2.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["transport", "tls-native-roots"] }
sc-observability.workspace = true
sc-observability-log.workspace = true
sc-observability-types.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tonic = { workspace = true, features = ["router"] }
atm-core = { workspace = true, features = ["test-utils"] }
serial_test = "3"
tempfile = "3"
opentelemetry-proto = { version = "=0.33.0", default-features = false, features = ["gen-tonic", "trace", "logs", "metrics"] }
tokio-stream = { version = "0.1", features = ["net"] }
trybuild = "1"
