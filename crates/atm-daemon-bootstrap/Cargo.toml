[package]
name = "atm-daemon-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared same-host ATM daemon bootstrap helpers."
repository.workspace = true
homepage.workspace = true

[features]
benchmark-harness = []
test-support = [
    "dep:atm-runtime-test-support",
    "dep:tempfile",
    "atm-core/test-utils",
    "atm-cron/test-utils",
    "atm-herdr/test-utils",
    "atm-http-runtime/test-support",
]

[[bin]]
name = "atm-daemon-benchmark"
path = "src/bin/atm-daemon-benchmark.rs"
required-features = ["benchmark-harness"]

[dependencies]
sc-lint-attributes = "0.8.3"
async-trait.workspace = true
atm-core.workspace = true
atm-cron.workspace = true
atm-observability.workspace = true
atm-herdr.workspace = true
atm-http-runtime.workspace = true
atm-runtime.workspace = true
atm-storage.workspace = true
atm-storage-rusqlite.workspace = true
atm-template-sc-compose.workspace = true
atm-runtime-test-support = { workspace = true, optional = true }
# Lifecycle-only standard SDK provider handles (ADR-064); construction stays in atm-observability.
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
peer-tls.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
chrono = { version = "0.4", features = ["serde"] }
fs4 = "0.13"
serde_json.workspace = true
serde.workspace = true
toml = "0.8"
ulid.workspace = true
tempfile = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }

[dev-dependencies]
atm-cron = { workspace = true, features = ["test-utils"] }
atm-core = { workspace = true, features = ["test-utils"] }
atm-herdr = { workspace = true, features = ["test-utils"] }
atm-http-runtime = { workspace = true, features = ["test-support"] }
atm-runtime-test-support.workspace = true
atm-storage-rusqlite = { workspace = true, features = ["test-support"] }
# In-process OTLP gRPC collector for the BD6 lifecycle proofs.
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic", "trace", "logs", "metrics"] }
serial_test = "3"
sc-observability-log.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { workspace = true, features = ["router"] }
tracing-subscriber.workspace = true
