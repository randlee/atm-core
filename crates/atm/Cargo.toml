[package]
name = "agent-team-mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI for local agent team mail workflows."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agent-team-mail"
readme = "../../README.md"
keywords = ["agent", "mail", "cli", "teams", "workflow"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["src/bin/atm_post_send_hook_fixture.rs"]

[[bin]]
name = "atm"
path = "src/main.rs"

[features]
fault-injection = ["sc-observability/fault-injection"]

[dependencies]
atm-core = { package = "agent-team-mail-core", path = "../atm-core", version = "1.3.1" }
atm-daemon-bootstrap = { path = "../atm-daemon-bootstrap", version = "1.3.1" }
atm-daemon-client = { path = "../atm-daemon-client", version = "1.3.1" }
anyhow.workspace = true
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
interprocess = "2.4.2"
sc-observability.workspace = true
sc-observability-types.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
time = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
atm-core = { package = "agent-team-mail-core", path = "../atm-core", version = "1.3.1", features = ["test-utils"] }
atm-runtime-test-support = { path = "../atm-runtime-test-support" }
sc-observability = { workspace = true, features = ["fault-injection"] }
serial_test = "3"
tempfile = "3"
