[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "atm-graft"
# Keep the wheel metadata aligned with the workspace release version.
version = "1.6.5"
description = "Python bindings for the ATM graft client: embed an agent host in an ATM team"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "atm-core contributors" }]
license = { text = "MIT OR Apache-2.0" }
dependencies = ["pydantic>=2,<3"]

[project.urls]
Homepage = "https://github.com/randlee/atm-core"
Repository = "https://github.com/randlee/atm-core"
Issues = "https://github.com/randlee/atm-core/issues"

[tool.maturin]
# A mixed wheel needs a Python package matching the first component.  The
# native extension lives beneath it and the package exposes its public API.
module-name = "atm_graft._atm_graft"
python-source = "python"
# The generic wheel contains only the Rust-backed ``atm_graft`` package.
# Hermes lifecycle and Telegram policy are distributed separately as
# ``hermes-atm``.
python-packages = ["atm_graft"]
features = ["abi3", "extension-module"]
