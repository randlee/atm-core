[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "atm-graft"
version = "1.4.0b38"
requires-python = ">=3.9"

[tool.maturin]
module-name = "atm_graft"
python-source = "python"
python-packages = ["atm_graft_hermes_adapter", "atm_graft_hermes_bridge"]
features = ["extension-module"]
