[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "atm-graft"
version = "1.4.1"
requires-python = ">=3.9"

[tool.maturin]
# A mixed wheel needs a Python package matching the first component.  The
# native extension lives beneath it and the package exposes its public API.
module-name = "atm_graft._atm_graft"
python-source = "python"
python-packages = [
    "atm_graft_hermes_adapter",
    "atm_graft_hermes_bridge",
    "atm_graft_hermes_loader",
]
features = ["extension-module"]
