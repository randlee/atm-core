[package]
name = "atm-graft-python"
version = "1.4.0-beta-ai.37"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "PyO3 bindings for the typed atm-graft client."
repository.workspace = true
homepage.workspace = true

[lib]
name = "atm_graft_python"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
atm-graft = { path = "../atm-graft", version = "1.4.0-beta-ai.37" }
atm-core = { package = "agent-team-mail-core", path = "../atm-core", version = "1.4.0-beta-ai.37" }
pyo3 = "0.29"

[dev-dependencies]
atm-core = { package = "agent-team-mail-core", path = "../atm-core", version = "1.4.0-beta-ai.37", features = ["test-utils"] }
atm-graft = { path = "../atm-graft", version = "1.4.0-beta-ai.37", features = ["test-support"] }
tempfile = "3"
