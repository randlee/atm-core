[package]
name = "atm-graft-python"
# Published to PyPI by Maturin as `atm-graft`; never cargo-publish this bridge
# crate as a separate crates.io artifact.
publish = false
# Maturin consumes this crate's Cargo version as Python package metadata; keep
# it equivalent to the workspace release while using PEP 440-compatible form.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "PyO3 bindings for the typed atm-graft client."
repository.workspace = true
homepage.workspace = true

[lib]
name = "atm_graft_python"
crate-type = ["cdylib", "rlib"]

[features]
default = ["abi3"]
# The public Python surface uses only PyO3 APIs compatible with CPython's
# stable ABI.  One CPython 3.11 abi3 wheel therefore supports CPython 3.11+
# on a given operating-system/architecture target.
abi3 = ["pyo3/abi3-py311"]
extension-module = ["pyo3/extension-module"]

[dependencies]
atm-graft.workspace = true
atm-core.workspace = true
atm-observability.workspace = true
pyo3 = "0.29"
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
atm-core = { workspace = true, features = ["test-utils"] }
atm-graft = { workspace = true, features = ["test-support"] }
tempfile = "3"
