sprint = "AG.23"
description = "Remove synthetic deferred-receipt construction from daemon dispatch so code returns delivery facts instead of daemon-authored mailbox receipts."
min_net_crates_loc = -100

scan_files = [
  "crates/atm-daemon/src/composition.rs",
  "crates/atm-daemon/src/peer_transport.rs",
  "docs/plans/phase-AG/plan-phase-AG.md",
]

allowed_changed_files = [
  "crates/atm-daemon/src/composition.rs",
  "crates/atm-daemon/src/peer_transport.rs",
  "docs/plans/phase-AG/plan-phase-AG.md",
]

forbidden_literals = [
  "persist_outcome_unknown_request",
  "resume_pending_replay",
  "final sender-inbox receipt",
  "final delivery/failure receipt lands in sender inbox",
  "sender receipt synthesis",
  "deferred-receipt",
]

forbidden_regexes = [
  "persist_outcome_unknown_request\\s*\\(",
  "resume_pending_replay\\s*\\(",
  "final sender[- ]inbox receipt",
  "sender[- ]receipt (closure|synthesis|obligation)",
]
