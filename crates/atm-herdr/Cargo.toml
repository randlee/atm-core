[package]
name = "atm-herdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Tokio-native process adapter for the Herdr CLI."
repository.workspace = true
homepage.workspace = true

[features]
test-utils = []

[dependencies]
sc-lint-attributes = { workspace = true }
atm-core = { workspace = true, features = ["runtime-clock"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
atm-core = { workspace = true, features = ["test-utils"] }

[[bin]]
name = "fake-herdr"
path = "tests/support/fake_herdr/main.rs"
test = false
bench = false
required-features = ["test-utils"]
