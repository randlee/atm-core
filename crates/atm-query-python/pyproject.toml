[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "atm-query"
# Maturin derives this wheel version from the bridge Cargo package, matching
# the supported release path used by atm-graft.
dynamic = ["version"]
requires-python = ">=3.11,<3.15"

[tool.maturin]
module-name = "atm_query"
features = ["abi3", "extension-module"]
