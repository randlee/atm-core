boundary_id = "BOUNDARY-MailStoreDoctor-Sqlite"
owner_package = "atm-rusqlite"
owner_crate_path = "atm_rusqlite"
name = "SqliteMailStoreDoctorAdapter"

[public]
trait = "MailStoreDoctor"

[implementation]
type = "SqliteMailStore"
module = "atm_rusqlite"
visibility = "private"
constructor = "private"

[composition]
roots = ["atm_rusqlite::assemble_boundary"]

[ownership]
io_owns = ["sqlite", "mail_store_diagnostics"]
io_forbidden = ["socket_io", "process_spawn"]

[dependencies]
allowed_dependents = ["atm-daemon", "atm-daemon-bootstrap", "atm-runtime-test-support"]
allowed_dependencies = ["atm-core", "rusqlite"]
forbidden_edges = ["atm -> atm-rusqlite", "atm-graft -> atm-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["SqliteMailStore", "rusqlite::Connection"]

[contracts]
request_types = ["MailStoreDoctor method inputs"]
response_types = ["MailStoreDoctorReport", "DoctorFinding"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = ["atm_core::test_support::InMemoryMailStore"]
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-MAILSTOREDOCTOR-SQLITE-REFERENCES"]
review_gates = ["no_public_impl", "no_public_constructor", "no_public_reexport"]

[status]
state = "active"
notes = ["crate-root implementation remains temporary; module split is still deferred"]
