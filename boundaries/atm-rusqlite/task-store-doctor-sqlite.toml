boundary_id = "BOUNDARY-TaskStoreDoctor-Sqlite"
owner_package = "atm-rusqlite"
owner_crate_path = "atm_rusqlite"
name = "SqliteTaskStoreDoctorAdapter"

[public]
trait = "TaskStoreDoctor"

[implementation]
type = "SqliteTaskStore"
module = "atm_rusqlite"
visibility = "private"
constructor = "private"

[composition]
roots = ["atm_rusqlite::assemble_boundary"]

[ownership]
io_owns = ["sqlite", "task_store_diagnostics"]
io_forbidden = ["socket_io", "process_spawn"]

[dependencies]
allowed_dependents = ["atm-daemon", "atm-daemon-bootstrap", "atm-runtime-test-support"]
allowed_dependencies = ["atm-core", "rusqlite"]
forbidden_edges = ["atm -> atm-rusqlite", "atm-graft -> atm-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["SqliteTaskStore", "rusqlite::Connection"]

[contracts]
request_types = ["TaskStoreDoctor method inputs"]
response_types = ["TaskStoreDoctorReport", "DoctorFinding"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-TASKSTOREDOCTOR-SQLITE-REFERENCES"]
review_gates = ["no_public_impl", "no_public_constructor", "no_public_reexport"]

[status]
state = "planned"
notes = ["task persistence remains a placeholder surface; diagnostic record is frozen for Phase AA"]
