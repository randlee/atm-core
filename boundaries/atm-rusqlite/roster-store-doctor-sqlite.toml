boundary_id = "BOUNDARY-RosterStoreDoctor-Sqlite"
owner_package = "atm-rusqlite"
owner_crate_path = "atm_rusqlite"
name = "SqliteRosterStoreDoctorAdapter"

[public]
trait = "RosterStoreDoctor"

[implementation]
type = "SqliteRosterStore"
module = "atm_rusqlite"
visibility = "private"
constructor = "private"

[composition]
roots = ["atm_rusqlite::assemble_boundary"]

[ownership]
io_owns = ["sqlite", "roster_store_diagnostics"]
io_forbidden = ["socket_io", "process_spawn"]

[dependencies]
allowed_dependents = ["atm-runtime", "atm-daemon-bootstrap", "atm-runtime-test-support"]
allowed_dependencies = ["atm-core", "rusqlite"]
forbidden_edges = ["atm -> atm-rusqlite", "atm-daemon -> atm-rusqlite", "atm-graft -> atm-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["SqliteRosterStore", "rusqlite::Connection"]

[contracts]
request_types = ["RosterStoreDoctor method inputs"]
response_types = ["RosterStoreDoctorReport", "DoctorFinding"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = ["atm_core::test_support::InMemoryRosterStore"]
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-ROSTERSTOREDOCTOR-SQLITE-REFERENCES"]
review_gates = ["no_public_impl", "no_public_constructor", "no_public_reexport"]

[status]
state = "active"
notes = ["durable roster truth remains distinct from daemon-owned live status"]
