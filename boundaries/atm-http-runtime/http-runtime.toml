boundary_id = "BOUNDARY-HttpRuntime"
owner_package = "atm-http-runtime"
owner_crate_path = "atm_http_runtime"
name = "HttpRuntime"

[public]
facade = "HttpRuntime"
notes = "Tokio/Axum lifecycle facade. HttpRuntimeClient is the one connector-neutral async client translation; the explicit plain-TCP direct-peer adapter retains the canonical WriteRequest route and handler. AO2 keeps TLS as an outer stream adapter, so selected plaintext remains the preserved direct path."

[implementation]
type = "HttpRuntimeClient"
module = "atm_http_runtime"
visibility = "public"
constructor = "public"

[composition]
roots = [
  "atm_http_runtime::HttpRuntimeBuilder::build",
  "atm_http_runtime::HttpRuntime::start",
  "atm_http_runtime::canonical_api_router",
  "atm_http_runtime::StorageAndNudgeRouter",
]

[ownership]
io_owns = ["tokio_axum_listener_lifecycle", "capability_authenticated_loopback", "unix_uds_adapter", "explicit_direct_peer_adapter", "typed_http_translation", "bounded_blocking_storage_admission"]
io_forbidden = ["direct_sqlite_io", "daemon_request_dispatch", "raw_http_framing", "peer_specific_dto_or_route", "replay_or_resend", "tls_adapter"]

[dependencies]
allowed_dependents = ["atm-daemon-bootstrap", "atm", "atm-daemon-client", "atm-graft"]
allowed_dependencies = ["atm-core", "atm-herdr", "tokio", "axum", "http-body-util", "hyper", "hyper-util", "reqwest", "tower", "ulid", "windows-sys"]
forbidden_edges = ["atm-http-runtime -> atm-storage-rusqlite", "atm-http-runtime -> atm-graft", "atm-http-runtime -> atm", "atm-http-runtime -> atm-daemon-bootstrap"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["existing atm-core ApiRequest only"]
response_types = ["existing atm-core ApiResponse only"]
error_types = ["AtmError"]
notes = ["No runtime-private request, response, error, or persistence type is authorized.", "Received-message hooks cross only the sealed core selector/emitter boundary after a newly durable write; their failure is a response warning, never a write failure."]

[testing]
allowed_test_double_paths = ["crate::tests::TestRouter", "crate::tests::PassthroughPeerAdapter"]
forbidden_test_bypasses = ["listener_bind", "endpoint_publication"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-HTTP-RUNTIME-DEPENDENCIES"]
review_gates = ["core_contracts_only", "typestate_lifecycle", "all_routes_from_core_table", "no_raw_http", "no_tls_adapter", "no_legacy_daemon_composition"]

[status]
state = "active"
notes = ["AL.1 introduced the construction facade and its dependency boundary.", "AL.8 makes this the active daemon runtime with framework-managed UDS and loopback adapters; the legacy daemon server is reference-only until AM deletion.", "AL.9 permits atm and atm-graft to consume the runtime-owned preferred local client for write paths only; the runtime remains independent of both consumers.", "The direct-peer adapter is one plain-TCP connector/listener pair for explicitly selected plaintext-test evidence only; it shares the existing WriteRequest encoder, POST route, canonical router, storage boundary, and received-hook path, and authorizes no peer DTO, peer route, resend, replay, or TLS surface.", "ADR-047 requires any later mTLS stream adapter to preserve this direct pipeline when plaintext-test is selected.", "AQ2.6 consumes atm-herdr only for the shared Tokio Herdr process adapter used by the AQ2.7 queue wake pump.", "replay_or_resend = re-issuing an envelope after any byte of it was written; a single pre-send reconnect (connect/handshake failure, zero bytes written, at most once, generation-aware) is permitted and must be decided solely by is_safe_to_reconnect().", "The pre-send reconnect exception applies only to local loopback/UDS; direct-peer Connect -> PeerConnect at client.rs:656-675 remains non-retrying.", "Recovery ownership rule: request-level retry eligibility is decided only by is_safe_to_reconnect() in atm-http-runtime; the session layer never re-issues a request and only rebuilds the client for the next call under RefreshOnly. Follow-up: evaluate collapsing RefreshOnly into a plain re-call only after request-level self-heal has production evidence from the Phase AR hermes suite / testbed restart tier; that evaluation belongs to its own sprint."]
