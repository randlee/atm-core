boundary_id = "BOUNDARY-HttpRuntime"
owner_package = "atm-http-runtime"
owner_crate_path = "atm_http_runtime"
name = "HttpRuntime"

[public]
facade = "HttpRuntime"
notes = "Tokio/Axum lifecycle facade. HttpRuntimeClient is the one connector-neutral async client translation; AL.9 adds an optional explicit plain-TCP direct-peer adapter that retains the canonical WriteRequest route and handler. AO keeps concrete TLS isolated in peer-tls; this runtime may consume only the opaque core adapter contract when AO.2 composes it."

[implementation]
type = "HttpRuntimeClient"
module = "atm_http_runtime"
visibility = "public"
constructor = "public"

[composition]
roots = [
  "atm_http_runtime::HttpRuntimeBuilder::build",
  "atm_http_runtime::HttpRuntime::start",
  "atm_http_runtime::canonical_api_router",
  "atm_http_runtime::StorageAndNudgeRouter",
]

[ownership]
io_owns = ["tokio_axum_listener_lifecycle", "capability_authenticated_loopback", "unix_uds_adapter", "explicit_direct_peer_adapter", "opaque_peer_io_adapter_dispatch", "typed_http_translation", "bounded_blocking_storage_admission"]
io_forbidden = ["direct_sqlite_io", "daemon_request_dispatch", "raw_http_framing", "peer_specific_dto_or_route", "replay_or_resend", "concrete_rustls_types", "tokio_rustls_handshake", "peer_config_store", "storage_tls_helpers", "certificate_parsing", "tls_policy"]

[dependencies]
allowed_dependents = ["atm-daemon-bootstrap", "atm", "atm-daemon-client", "atm-graft"]
allowed_dependencies = ["atm-core", "tokio", "axum", "hyper", "hyper-util", "reqwest", "tower", "ulid", "windows-sys"]
forbidden_edges = ["atm-http-runtime -> atm-storage-rusqlite", "atm-http-runtime -> atm-graft", "atm-http-runtime -> atm", "atm-http-runtime -> atm-daemon-bootstrap"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["existing atm-core ApiRequest only"]
response_types = ["existing atm-core ApiResponse only"]
error_types = ["AtmError"]
notes = ["No runtime-private request, response, error, or persistence type is authorized.", "Received-message hooks cross only the sealed core selector/emitter boundary after a newly durable write; their failure is a response warning, never a write failure."]

[testing]
allowed_test_double_paths = ["crate::tests::TestRouter"]
forbidden_test_bypasses = ["listener_bind", "endpoint_publication"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-HTTP-RUNTIME-DEPENDENCIES"]
review_gates = ["core_contracts_only", "typestate_lifecycle", "all_routes_from_core_table", "no_raw_http", "opaque_peer_io_only", "no_concrete_tls_or_storage_policy", "no_legacy_daemon_composition"]

[status]
state = "active"
notes = ["AL.1 introduced the construction facade and its dependency boundary.", "AL.8 makes this the active daemon runtime with framework-managed UDS and loopback adapters; the legacy daemon server is reference-only until AM deletion.", "AL.9 permits atm and atm-graft to consume the runtime-owned preferred local client for write paths only; the runtime remains independent of both consumers.", "AL.9's optional direct-peer adapter is an explicit plain-TCP connector/listener pair for documented M5 evidence reruns only; it shares the existing WriteRequest encoder, POST route, canonical router, storage boundary, and received-hook path, and authorizes no peer DTO, peer route, resend, replay, or TLS surface.", "AO.1 establishes PeerIoAdapter in atm-core. AO.2 may dispatch that opaque adapter here, but this crate must never import Rustls, tokio-rustls, PeerConfigStore, or atm_storage::tls."]
