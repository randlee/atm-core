boundary_id = "BOUNDARY-GraftPostSendNotificationTransport"
owner_package = "atm-graft"
owner_crate_path = "atm_graft"
name = "GraftPostSendNotificationTransport"

[public]
facade = "GraftSession"

[implementation]
type = "GraftReceiverLoopContext"
module = "atm_graft::runtime"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_graft::GraftSession::activate_with_observability"]

[ownership]
io_owns = ["receiver_private_loopback_notification_handoff"]
io_forbidden = ["daemon_request_dispatch", "named_pipe", "sqlite", "storage_write"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm-graft -> interprocess"]

[references]
scope = "inside_owner_crate"
forbidden = [
  "interprocess::local_socket",
  "std::os::windows::named_pipe",
]

[contracts]
request_types = ["PostSendHookEvent"]
response_types = ["GraftPostSendResponse"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = [
  "interprocess::local_socket",
  "std::os::windows::named_pipe",
]

[enforcement]
lint_rules = [
  "LINT-BOUNDARY-GRAFT-POST-SEND-TRANSPORT-EDGES",
  "LINT-BOUNDARY-GRAFT-POST-SEND-TRANSPORT-REFERENCES",
]
review_gates = [
  "no_named_pipe_backend",
  "no_graft_to_daemon_edge",
  "receiver_private_transport_only",
]

[status]
state = "active"
notes = [
  "This is a receiver-private host-notification handoff, not a daemon request transport.",
  "The embedded graft send/read/ack client remains on the shared daemon HTTP API.",
  "The owner-crate reference scan and the Cargo edge denial jointly prevent reintroducing an interprocess local-socket or Windows named-pipe backend.",
]
