boundary_id = "BOUNDARY-ToolSenderRegistry-Sqlite"
owner_package = "atm-storage-rusqlite"
owner_crate_path = "atm_storage_rusqlite"
name = "SqliteToolSenderRegistry"

[public]
trait = "ToolSenderRegistry"
notes = "Private SQLite adapter verifies the storage-neutral installer/runtime signatures against explicit local factory configuration, and persists registrations, nonce bindings, and replay receipts transactionally."

[implementation]
type = "SqliteToolSenderRegistry"
module = "atm_storage_rusqlite::tool_sender_registry"
visibility = "private"
constructor = "pub(crate)"

[composition]
roots = ["atm_storage_rusqlite::SqliteStorageFactory::with_tool_sender_registry_config"]

[ownership]
io_owns = ["sqlite", "installer_signature_verification", "runtime_nonce_binding"]
io_forbidden = ["process_spawn", "socket_io"]

[dependencies]
allowed_dependents = ["atm-daemon-bootstrap", "atm-runtime-test-support"]
allowed_dependencies = ["async-trait", "atm-storage", "base64", "chrono", "ring", "rusqlite", "serde", "serde_json", "sha2", "tokio", "tracing"]
allowed_dev_dependencies = ["atm-storage", "serde", "serde_json", "tempfile", "tracing-subscriber"]
forbidden_edges = ["atm-storage-rusqlite -> atm-core", "atm-storage-rusqlite -> atm-runtime"]

[references]
scope = "outside_owner_crate"
forbidden = ["SqliteToolSenderRegistry", "rusqlite::Connection"]

[contracts]
request_types = ["ToolInstallerRequest", "ToolRuntimeProof", "AtmMessageId", "MessageDigest", "IsoTimestamp"]
response_types = ["ToolInstallReceipt", "RegisteredToolSender", "ToolRuntimeAdmission"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-TOOL-SENDER-REGISTRY-REFERENCES"]
review_gates = ["private_sqlite_impl", "explicit_local_trust_root", "atomic_signed_operations"]

[status]
state = "active"
notes = ["No request, environment variable, repository configuration, or hook data can populate trusted installer keys or sender allowlists.", "Without ToolSenderRegistryConfig, signed installer and runtime operations fail closed."]
