boundary_id = "BOUNDARY-AsyncTaskSchedulerAuditStore-Sqlite"
owner_package = "atm-storage-rusqlite"
owner_crate_path = "atm_storage_rusqlite"
name = "SqliteAsyncTaskSchedulerAuditStoreAdapter"

[public]
trait = "AsyncTaskSchedulerAuditStore"

[implementation]
type = "SqliteTaskMutationStore"
module = "atm_storage_rusqlite"
visibility = "private"
constructor = "private"

[composition]
roots = ["atm_storage_rusqlite::SqliteStorageBackend::new"]

[ownership]
io_owns = ["ordered_writer_submission", "sqlite_transaction"]
io_forbidden = ["socket_io", "process_spawn", "template_rendering"]

[dependencies]
allowed_dependents = ["atm-daemon-bootstrap", "atm-runtime-test-support"]
allowed_dependencies = ["atm-storage", "rusqlite"]
forbidden_edges = ["atm-storage-rusqlite -> atm-core", "atm-runtime -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["SqliteTaskMutationStore", "rusqlite::Connection"]

[contracts]
request_types = ["TaskReminderAuditRequest", "TaskLeadNotificationAuditRequest"]
response_types = ["TaskMutationOutcome"]
error_types = ["AtmError"]
notes = ["the adapter internally shares the task writer but exposes only scheduler audit operations"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-ASYNC-TASK-SCHEDULER-AUDIT-REFERENCES"]
review_gates = ["manual_architecture_review"]

[enforcement.io_forbidden_source_modules]
socket_io = ["atm_storage_rusqlite::writer::task_ops", "atm_storage_rusqlite::writer::task_legacy_ops"]
process_spawn = ["atm_storage_rusqlite::writer::task_ops", "atm_storage_rusqlite::writer::task_legacy_ops"]
template_rendering = ["atm_storage_rusqlite::writer::task_ops", "atm_storage_rusqlite::writer::task_legacy_ops"]

[status]
state = "concrete_landed"
notes = ["AZ.4", "CDR-004"]
