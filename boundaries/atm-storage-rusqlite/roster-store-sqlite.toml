boundary_id = "BOUNDARY-RosterStore-Sqlite"
owner_package = "atm-storage-rusqlite"
owner_crate_path = "atm_storage_rusqlite"
name = "SqliteRosterStoreAdapter"

[public]
trait = "RosterStore"

[implementation]
type = "SqliteRosterStore"
module = "atm_storage_rusqlite"
visibility = "private"
constructor = "private"

[composition]
roots = ["atm_storage_rusqlite::SqliteStorageBackend::new"]

[ownership]
io_owns = [
  "sqlite",
  "durable_roster_persistence",
]
io_forbidden = [
  "socket_io",
  "process_spawn",
]

[dependencies]
allowed_dependents = ["atm-daemon-bootstrap", "atm-runtime-test-support"]
allowed_dependencies = [
  "atm-storage",
  "rusqlite",
]
forbidden_edges = [
  "atm -> atm-storage-rusqlite",
  "atm-daemon -> atm-storage-rusqlite",
  "atm-graft -> atm-storage-rusqlite",
  "atm-runtime -> atm-storage-rusqlite",
  "atm-storage-rusqlite -> atm-runtime",
]

[references]
scope = "outside_owner_crate"
forbidden = [
  "SqliteRosterStore",
  "SqliteRosterStore::open",
  "rusqlite::Connection",
]

[contracts]
request_types = ["RosterStore method inputs"]
response_types = ["atm-storage roster DTOs"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = [
  "LINT-BOUNDARY-ROSTERSTORE-SQLITE-EDGES",
  "LINT-BOUNDARY-ROSTERSTORE-SQLITE-REFERENCES",
]
review_gates = [
  "no_public_impl",
  "no_public_constructor",
  "no_public_reexport",
]

[status]
state = "active"
notes = [
  "durable roster truth remains distinct from live status caches",
  "the canonical table is explicit member rows; daemon-owned pid continuity is not persisted here",
  "SQLite roster persistence is a backend-only implementation of the shared atm-storage RosterStore trait",
]
