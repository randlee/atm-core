boundary_id = "BOUNDARY-HermesAtmRuntime"
owner_package = "hermes-atm"
owner_crate_path = "hermes_atm"
name = "HermesAtmRuntime"

[public]
facade = "HermesAtmRuntime"
notes = "Hermes-facing composition and native tools over the public atm-graft Python API."

[implementation]
type = "HermesAtmRuntime"
module = "hermes_atm::runtime"
visibility = "public"
constructor = "public"

[composition]
roots = []

[ownership]
io_owns = ["host_callback_invocation"]
io_forbidden = ["database_io", "direct_socket_io", "daemon_lifecycle", "retry_queue"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-graft"]
forbidden_edges = [
  "hermes-atm -> atm-daemon",
  "hermes-atm -> atm-storage-rusqlite",
]

[references]
scope = "inside_owner_crate"
forbidden = ["rusqlite::Connection", "reqwest::Client"]

[contracts]
request_types = ["PyNudge", "AtmSendRequest", "AtmReadRequest", "AtmListRequest"]
response_types = ["native tool success/error envelope"]
error_types = ["HermesAtmRuntimeError", "AtmToolError envelope"]
notes = ["Uses public atm_graft.PyGraftSession and GatewayRunner.inject_internal_message only.", "Native tool ingress is Pydantic-validated by atm-graft; Hermes returns the trusted typed outcome in a discriminated envelope without production egress re-validation."]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["rusqlite::Connection", "reqwest::Client"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-HERMES-ATM-IMPORTS"]
review_gates = ["no_second_atm_client", "no_hermes_code_in_atm_graft"]

[status]
state = "active"
notes = ["AL.16 package boundary between generic atm-graft and Hermes session composition."]
