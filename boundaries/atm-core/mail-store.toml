boundary_id = "BOUNDARY-MailStore"
owner_package = "atm-core"
owner_crate_path = "atm_core"
name = "MailStore"

[public]
trait = "MailStore"
notes = "legacy compile-bridge mail-store trait retained in atm_core::boundary after AC.1; authoritative shared contract now lives in crates/atm-storage as MessageStore"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["message_lifecycle_state", "mailbox_projection_state"]
io_forbidden = ["socket_io", "process_spawn"]

[dependencies]
allowed_dependents = ["atm-daemon", "atm-runtime"]
allowed_dependencies = []
forbidden_edges = ["atm-core -> atm-daemon", "atm-core -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["MailStore method inputs"]
response_types = ["atm-core mailbox DTOs"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-MAILSTORE-REFERENCES"]
review_gates = ["no_concrete_store_leakage"]

[status]
state = "active"
notes = ["AC.1 introduced crates/atm-storage::MessageStore as the authoritative shared message contract", "legacy compile bridge remains active while retained production callers still route through atm-runtime::legacy_storage_adapters", "concrete store implementation lives in crates/atm-storage-rusqlite/src/lib.rs as SqliteMessageStore during the convergence window"]
