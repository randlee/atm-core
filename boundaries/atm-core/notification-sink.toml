boundary_id = "BOUNDARY-NotificationSink"
owner_package = "atm-core"
owner_crate_path = "atm_core"
name = "NotificationSink"

[public]
trait = "NotificationSink"
notes = "Historical boundary record only. Phase AD AD.5 removed NotificationSink from the accepted post-send path and deleted the active trait surface."

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["outbound_notification_delivery"]
io_forbidden = ["sqlite", "socket_io"]

[dependencies]
allowed_dependents = []
allowed_dependencies = []
forbidden_edges = ["atm-core -> atm-daemon", "atm-core -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["std::process::Command", "maybe_run_post_send_hook", "NotificationSink::deliver"]

[contracts]
request_types = ["notification payload requests"]
response_types = ["notification delivery results"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["std::process::Command"]

[enforcement]
no_in_repo_implementation = true
lint_rules = ["LINT-BOUNDARY-NOTIFICATION-SINK-REFERENCES"]
review_gates = ["no_direct_process_spawn"]

[status]
state = "retired"
notes = ["Phase AD AD.5 retired NotificationSink as an accepted boundary.", "Post-send notification logging is now a direct append helper at the event site rather than a retained notification sink contract."]
