boundary_id = "BOUNDARY-PostSendHookEmitter"
owner_package = "atm-core"
owner_crate_path = "atm_core"
name = "PostSendHookEmitter"

[public]
trait = "PostSendHookEmitter"
notes = "sealed post-commit emission contract planned in Phase AD AD.3; local tmux emitters may live in atm_core and the graft-backed emitter is allowlisted in atm-graft"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["post_send_hook_emission", "post_send_failure_signaling"]
io_forbidden = ["sqlite", "socket_io", "delivery_plan_construction"]

[dependencies]
allowed_dependents = ["atm-daemon", "atm-graft", "atm-runtime"]
allowed_dependencies = []
forbidden_edges = ["atm-core -> atm-daemon", "atm-core -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["NotificationSink::deliver", "DeliveryPlan", "ReplyDeliveryPlan", "execute_delivery_plan", "execute_reply_delivery_plan"]

[contracts]
request_types = ["PostSendHookEvent"]
response_types = ["typed post-send emission success"]
error_types = ["AtmError"]
notes = ["sender-visible warning construction stays at the send/ack call site rather than inside the emitter"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["std::process::Command"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-POST-SEND-HOOK-EMITTER-REFERENCES"]
review_gates = ["no_notification_sink_substitution", "no_delivery_plan_post_send"]

[status]
state = "planned"
notes = ["Phase AD AD.3 introduces the canonical post-send emission seam.", "atm-graft is an allowlisted out-of-owner implementation site for the graft-backed emitter planned in AD.7."]
