boundary_id = "BOUNDARY-WorkflowTelemetrySink"
owner_package = "atm-core"
owner_crate_path = "atm_core"
name = "WorkflowTelemetrySink"

[public]
trait = "WorkflowTelemetrySink"
notes = "Sealed, object-safe first-party telemetry projection. Records contain only workflow snapshot attributes and durable timestamps; message payloads and merged variables are forbidden."

[implementation]
type = "TaskExporter"
module = "atm_observability::task_exporter"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_runtime::workflow_telemetry::WorkflowTelemetryRuntime::start"]

[ownership]
io_owns = ["best_effort_telemetry_export"]
io_forbidden = ["database_io", "socket_io"]

[dependencies]
allowed_dependents = ["atm-runtime", "atm-observability", "atm-runtime-test-support"]
allowed_dependencies = []
forbidden_edges = ["atm -> opentelemetry-otlp", "atm-http-runtime -> opentelemetry-otlp", "atm-storage -> opentelemetry-otlp", "atm-storage-rusqlite -> opentelemetry-otlp"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["WorkflowTelemetryRecord"]
response_types = ["Result<(), WorkflowTelemetryError>"]
error_types = ["WorkflowTelemetryError"]

[testing]
allowed_test_double_paths = ["atm_core::workflow_telemetry::tests", "atm_runtime::workflow_telemetry::tests", "atm_runtime_test_support::task_telemetry"]
forbidden_test_bypasses = ["payload_bearing_record"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-WORKFLOW-TELEMETRY-SINK-REFERENCES"]
review_gates = ["first_party_only", "no_payload_or_vars", "best_effort_only"]

[status]
state = "concrete_landed"
notes = ["atm-core owns only the sealed trait and records (no built-in no-op sink); atm-runtime composes and calls the sink, while atm-observability owns the OpenTelemetry exporting implementation (ADR-064)."]
