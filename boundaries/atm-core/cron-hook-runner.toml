boundary_id = "BOUNDARY-CronHookRunner"
owner_package = "atm-core"
owner_crate_path = "atm_core"
name = "CronHookRunner"

[public]
trait = "CronHookRunner"
notes = "sealed cron-only runner that preserves HookRunner's task reply grammar while returning typed cron output"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = []
io_forbidden = ["sqlite", "process_spawn", "socket_io"]

[dependencies]
allowed_dependents = ["atm-cron", "atm-daemon-bootstrap", "atm-runtime-test-support"]
allowed_dependencies = []
forbidden_edges = ["atm-core -> atm-storage-rusqlite", "atm-core -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = ["rusqlite::Connection"]

[contracts]
request_types = ["HookTarget", "HookRequest", "RequestDeadline"]
response_types = ["CronHookOutcome", "CronStopReply", "CronRunPermit"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = ["atm_runtime_test_support::ScriptedCronHookRunner"]
forbidden_test_bypasses = ["std::process::Command"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-CRON-HOOK-RUNNER-REFERENCES"]
review_gates = ["sealed_trait", "typed_contract", "deterministic_test_doubles"]

[status]
state = "concrete_landed"
notes = ["BK-9 landed the sealed signature and deterministic double; BK-12 owns parser integration and BK-15 owns the production adapter.", "CronRunPermit is projected only from the private scheduler issuer in atm-cron; its implementation allowlist is enforced by the cron_run_permit_issuer_boundary architecture test."]
