boundary_id = "BOUNDARY-TaskCommandService"
owner_package = "atm-core"
owner_crate_path = "atm_core"
name = "TaskCommandService"

[public]
trait = "TaskCommandService"
notes = "The sole shared task-command policy boundary for the CLI and HTTP adapters."

[implementation]
type = "CoreTaskCommandService"
module = "atm_core::task_command::service"
visibility = "public"
constructor = "public"

[composition]
roots = ["atm_core::task_command::CoreTaskCommandService::new"]

[ownership]
io_owns = ["task_policy_validation", "prepared_task_mutation"]
io_forbidden = ["direct_sqlite_io", "socket_io", "process_spawn"]

[dependencies]
allowed_dependents = ["atm", "atm-http-runtime"]
allowed_dependencies = ["async-trait", "atm-storage", "serde", "serde_json"]
forbidden_edges = ["atm-core -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["TaskCommandRequest", "RequestDeadline"]
response_types = ["TaskCommandResponse"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-TASK-COMMAND-SERVICE-REFERENCES"]
review_gates = ["sole_task_command_service_impl", "sealed_trait"]

[status]
state = "concrete_landed"
notes = ["AZ.3: CoreTaskCommandService is the sole permitted implementation of the sealed TaskCommandService trait."]
