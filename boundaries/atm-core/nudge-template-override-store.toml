boundary_id = "BOUNDARY-NudgeTemplateOverrideStore"
owner_package = "atm-core"
owner_crate_path = "atm_core"
name = "NudgeTemplateOverrideStore"

[public]
trait = "NudgeTemplateOverrideStore"
notes = "storage-neutral lookup contract for team-scoped built-in nudge template override rows planned in Phase AD AD.21"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["built_in_nudge_template_override_lookup_contract"]
io_forbidden = ["direct_sqlite_io", "socket_io", "process_spawn", "template_rendering"]

[dependencies]
# `atm-daemon-bootstrap` and `atm` remain legitimate compile-bridge
# consumers here, matching the accepted roster-store precedent while the
# retained bootstrap/CLI cutover stays on the Phase AD line.
allowed_dependents = ["atm-runtime", "atm-storage-rusqlite", "atm-daemon-bootstrap", "atm"]
allowed_dependencies = []
forbidden_edges = ["atm-core -> atm-daemon", "atm-core -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["rusqlite::Connection", "NotificationSink::deliver"]

[contracts]
request_types = ["team name", "BuiltInNudgeTemplateKind"]
response_types = ["Option<TeamNudgeTemplateOverrideRow>"]
error_types = ["AtmError"]
notes = ["built-in template bodies and placeholder substitution remain owned by atm", "the emitter path must receive resolved template text or absence only and must not perform lookup itself"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-NUDGE-TEMPLATE-OVERRIDE-STORE-REFERENCES"]
review_gates = ["no_cli_sqlite_lookup", "no_emitter_side_lookup"]

[status]
state = "concrete_landed"
notes = ["AD.21 landed the contract so team-scoped built-in override lookup resolves upstream of PostSendHookEmitter.", "atm-storage-rusqlite is the first concrete storage implementation site for the accepted host-scoped override rows, including the write path consumed by `atm teams set-nudge-template` and the read path consumed by `crates/atm-core/src/send/hook.rs` upstream of PostSendHookEmitter."]
