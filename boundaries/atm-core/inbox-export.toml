boundary_id = "BOUNDARY-InboxExport"
owner_package = "atm-core"
owner_crate_path = "atm_core"
name = "InboxExport"

[public]
trait = "InboxExport"
notes = "trait and typed inbox export DTOs landed in atm_core::boundary"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["outbound_mailbox_projection", "compatibility_surface_translation"]
io_forbidden = ["sqlite", "socket_io", "process_spawn"]

[dependencies]
allowed_dependents = ["atm-rusqlite", "atm-daemon"]
allowed_dependencies = []
forbidden_edges = ["atm-core -> atm-daemon", "atm-core -> atm-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["finalize_send_outcome", "finalize_ack_outcome", "recover_after_sqlite_failure"]
named_callers = ["atm_core::direct_boundaries::export_source_files", "atm_core::direct_boundaries::reexport_messages"]

[contracts]
request_types = ["export write requests"]
response_types = ["typed export result models"]
error_types = ["AtmError"]
notes = ["ATM-authored compatibility projection may replace oversized JSONL bodies with the exact retrieval stub `atm read --message-id <id>` while preserving summary text and metadata", "Claude-native inbound messages must not be rewritten into ATM retrieval stubs", "after Yb Y.10 full mailbox rewrite through InboxExport is repair/rebuild-only; normal runtime delivery must not silently fall back from append to rewrite"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["mailbox::store::with_locked_source_files"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-INBOX-EXPORT-REFERENCES"]
review_gates = ["no_direct_mailbox_helper_calls", "repair_rebuild_only_reexport"]

[status]
state = "concrete_landed"
notes = ["typed record/export request and response contracts landed in atm_core::boundary", "send and receive state transitions should reach compatibility files through this boundary only", "the ADR-010 compatibility envelope keeps full ATM-authored bodies durable in SQLite while this boundary owns the bounded Claude JSONL projection", "Yb Y.10 restricts full mailbox re-export to repair/rebuild seams and removes silent append-path rewrite fallback from normal runtime delivery"]
