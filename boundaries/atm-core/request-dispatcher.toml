boundary_id = "BOUNDARY-RequestDispatcher"
owner_package = "atm-core"
owner_crate_path = "atm_core"
name = "RequestDispatcher"

[public]
trait = "RequestDispatcher"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["protocol_request_routing"]
io_forbidden = ["socket_io", "sqlite", "process_spawn"]

[dependencies]
allowed_dependents = ["atm-daemon"]
allowed_dependencies = []
forbidden_edges = ["atm-core -> atm-daemon", "atm-core -> atm-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["tokio::net::TcpListener", "tokio::net::UnixListener"]

[contracts]
request_types = ["AtmProtocol requests"]
response_types = ["AtmProtocol responses"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-DISPATCHER-REFERENCES"]
review_gates = ["no_socket_specific_dispatch_logic"]

[status]
state = "stub_landed"
notes = ["stub trait plus request/response shells landed in atm_core::boundary", "dispatcher is a service boundary, not a socket adapter"]
