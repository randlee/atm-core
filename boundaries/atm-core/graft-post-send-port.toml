boundary_id = "BOUNDARY-GraftPostSendPort"
owner_package = "atm-core"
owner_crate_path = "atm_core"
name = "GraftPostSendPort"

[public]
trait = "GraftPostSendPort"
notes = "sealed graft-specific post-send leaf handoff planned in Phase AD AD.26; used only after caller-owned send/ack logic selects graft as the built-in emission target"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["graft_post_send_handoff"]
io_forbidden = [
  "sqlite",
  "caller_context_resolution",
  "delivery_plan_construction",
  "daemon_session_registration",
  "daemon_session_queueing"
]

[dependencies]
allowed_dependents = ["atm-daemon", "atm-graft", "atm-runtime"]
allowed_dependencies = []
forbidden_edges = [
  "atm-core -> atm-daemon",
  "atm-core -> atm-storage-rusqlite"
]

[references]
scope = "outside_owner_crate"
forbidden = [
  "register_advisory_session",
  "unregister_advisory_session",
  "fetch_advisories",
  "drain_advisories",
  "AdvisoryStreamPacket"
]

[contracts]
request_types = ["PostSendHookEvent", "GraftNudgeTarget"]
response_types = ["typed graft post-send delivery success"]
error_types = ["AtmError"]
notes = [
  "caller-owned send/ack logic keeps hook matching, built-in fallback selection, and warning/log construction outside this boundary"
]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-GRAFT-POST-SEND-PORT-REFERENCES"]
review_gates = ["no_advisory_stream_reintroduction", "no_session_registry_leak"]

[status]
state = "planned"
notes = [
  "Phase AD AD.26 introduces the canonical graft-specific built-in post-send handoff seam."
]
