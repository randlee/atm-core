boundary_id = "BOUNDARY-TracingBridge"
owner_package = "atm-observability"
owner_crate_path = "atm_observability"
name = "TracingBridge"

[public]
facade = "TracingBridgeLayer"

[implementation]
type = "TracingBridgeLayer"
module = "atm_observability::tracing_bridge"
visibility = "public"
constructor = "public"

[composition]
roots = ["atm_daemon_bootstrap::daemon_observability::DaemonObservability::install_tracing_bridge"]

[ownership]
io_owns = ["retained_jsonl_queue_admission"]
io_forbidden = ["daemon_lifecycle", "database_io"]

[dependencies]
allowed_dependents = ["atm-daemon-bootstrap", "atm"]
allowed_dependencies = ["atm-core", "atm-runtime", "opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "sc-observability", "sc-observability-types", "serde_json", "sha2", "tokio", "tonic", "tracing", "tracing-subscriber"]
allowed_dev_dependencies = ["atm-core", "opentelemetry-proto", "sc-observability-log", "serial_test", "tempfile", "tokio-stream", "trybuild"]
forbidden_edges = [
  "atm-daemon -> atm-observability",
  "atm-observability -> atm-daemon-bootstrap",
  "atm-observability -> atm-http-runtime",
  "atm-observability -> atm-storage-rusqlite",
]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["tracing::Event", "RetainedEvent"]
response_types = ["SinkOffer", "DiagnosticCounters"]
error_types = ["BridgeError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["SCB-OBSERVABILITY-001"]
review_gates = ["allowlist_redaction", "single_global_install", "non_blocking_queue_admission"]

[status]
state = "active"
notes = ["Only atm-daemon-bootstrap installs the process-global tracing bridge; atm-observability is the sole sanctioned library owner of sc-observability backend types.", "The canonical logger fans out redacted events once to its selected file/OTel sinks. SDK diagnostics stay local and project only observable failure evidence. Native SDK and Tokio dependencies belong to the exporter (ADR-064); no official tracing appender is installed."]
