boundary_id = "BOUNDARY-TemplateScCompose"
owner_package = "atm-template-sc-compose"
owner_crate_path = "atm_template_sc_compose"
name = "TemplateScCompose"

[public]
facade = "ScComposeTemplateComposer"
notes = "The sole production implementation of atm-core's sealed TemplateComposer port. Exact-pinned sc-composer 1.4.1 supplies frontmatter/directive inspection, render, confinement, file-path output classification, and checked emission after complete final-body assembly; exact-pinned sc-sha 1.4.1 supplies strict UTF-8 and LF-normalized template identity."

[implementation]
type = "ScComposeTemplateComposer"
module = "atm_template_sc_compose"
visibility = "public"
constructor = "public"

[composition]
roots = ["atm_daemon_bootstrap::template_composer"]

[ownership]
io_owns = ["sc_composer_frontmatter_and_directive_inspection", "sc_composer_rendering", "confinement", "sc_sha_template_identity"]
io_forbidden = ["storage_schema", "catalog_persistence", "transport", "cli_surface", "http_runtime"]

[dependencies]
allowed_dependents = ["atm-daemon-bootstrap"]
allowed_dependencies = ["atm-core", "atm-storage", "sc-composer", "sc-sha"]
forbidden_edges = [
    "atm-core -> atm-template-sc-compose",
    "atm-storage -> atm-template-sc-compose",
    "atm-storage-rusqlite -> atm-template-sc-compose",
    "atm -> atm-template-sc-compose",
    "atm-daemon -> atm-template-sc-compose",
    "atm-runtime -> atm-template-sc-compose",
    "atm-http-runtime -> atm-template-sc-compose",
]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["TemplateSource", "TemplateRoot", "serde_json::Map<String, Value>"]
response_types = ["TemplateInspection", "TemplateOutputFormat", "RenderedBody"]
error_types = ["AtmError"]
notes = ["The exact-pinned sc-composer 1.4.1 adapter owns frontmatter parsing, classified directive kind/span inspection, root-constrained rendering, and OutputFormat::from_template_path classification. Exact-pinned sc-sha 1.4.1 owns strict UTF-8 and CRLF/lone-CR-to-LF-normalized template identity. ATM must not reimplement any of those operations."]

[testing]
allowed_test_double_paths = ["atm_template_sc_compose::ScComposeTemplateComposer"]
forbidden_test_bypasses = ["atm_hash_implementation", "atm_yaml_parser", "atm_include_scanner", "atm_path_prefix_check"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-TEMPLATE-SC-COMPOSE-EDGES"]
review_gates = ["exact_upstream_pin", "upstream_golden_vectors", "core_port_only", "bootstrap_only_composition"]

[status]
state = "concrete_landed"
notes = ["The exact crates.io sc-composer/sc-sha 1.4.1 releases serve the complete production inspection and checked-render path. This adapter supplies source and root paths to sc-composer but performs no local parser, hash, path-prefix, or confinement check. No local path or git dependency is permitted."]
