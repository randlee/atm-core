boundary_id = "BOUNDARY-TemplateScCompose"
owner_package = "atm-template-sc-compose"
owner_crate_path = "atm_template_sc_compose"
name = "TemplateScCompose"

[public]
facade = "ScComposeTemplateComposer"
notes = "The sole production implementation of atm-core's sealed TemplateComposer port. Exact-pinned sc-composer/sc-sha 1.4.0 supply render, confinement, strict UTF-8/LF-normalized identity, and frontmatter extraction. Fixture registrations remain only for the unavailable public classified directive-inspection API."

[implementation]
type = "ScComposeTemplateComposer"
module = "atm_template_sc_compose"
visibility = "public"
constructor = "public"

[composition]
roots = ["atm_daemon_bootstrap::assemble_host_runtime_with_template_composer", "atm_daemon_bootstrap::run_replacement_daemon"]

[ownership]
io_owns = ["sc_composer_rendering", "confinement", "fixture_contract_results_for_unpublished_upstream_apis"]
io_forbidden = ["storage_schema", "catalog_persistence", "transport", "cli_surface", "http_runtime"]

[dependencies]
allowed_dependents = ["atm-daemon-bootstrap"]
allowed_dependencies = ["atm-core", "atm-storage", "sc-composer", "sc-sha"]
forbidden_edges = [
    "atm-core -> atm-template-sc-compose",
    "atm-storage -> atm-template-sc-compose",
    "atm-storage-rusqlite -> atm-template-sc-compose",
    "atm -> atm-template-sc-compose",
    "atm-daemon -> atm-template-sc-compose",
    "atm-runtime -> atm-template-sc-compose",
    "atm-http-runtime -> atm-template-sc-compose",
]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["TemplateSource", "TemplateRoot", "serde_json::Map<String, Value>"]
response_types = ["TemplateInspection", "RenderedBody"]
error_types = ["AtmError"]
notes = ["The exact-pinned sc-composer/sc-sha 1.4.0 adapter owns root-constrained rendering, strict UTF-8/LF-normalized identity, and frontmatter extraction. Classified directive kind/span inspection remains fixture-only until the separately tracked upstream public API exists; ATM must not reimplement it."]

[testing]
allowed_test_double_paths = ["atm_template_sc_compose::ScComposeTemplateComposer"]
forbidden_test_bypasses = ["atm_hash_implementation", "atm_yaml_parser", "atm_include_scanner", "atm_path_prefix_check"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-TEMPLATE-SC-COMPOSE-EDGES"]
review_gates = ["exact_upstream_pin", "upstream_golden_vectors", "core_port_only", "bootstrap_only_composition"]

[status]
state = "concrete_landed"
notes = ["AN.3 uses the exact crates.io sc-composer/sc-sha 1.4.0 releases for render/confinement, identity, and frontmatter extraction. The fixture seam remains only for unpublished classified directive-inspection APIs. This adapter supplies source and root paths to sc-composer but performs no local path-prefix or confinement check. No local path or git dependency is permitted.", "Pin policy: any sc-composer or sc-sha version bump must rerun docs/plans/phase-an/fixtures/dolt-template-sha-vectors.json through the adapter golden-vector test in the same PR, retaining CRLF/LF, BOM, and final-newline cases."]
