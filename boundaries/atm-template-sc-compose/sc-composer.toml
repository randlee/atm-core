boundary_id = "BOUNDARY-TemplateScCompose"
owner_package = "atm-template-sc-compose"
owner_crate_path = "atm_template_sc_compose"
name = "TemplateScCompose"

[public]
facade = "ScComposeTemplateComposer"
notes = "The sole production implementation of atm-core's sealed TemplateComposer port."

[implementation]
type = "ScComposeTemplateComposer"
module = "atm_template_sc_compose"
visibility = "public"
constructor = "public"

[composition]
roots = ["atm_daemon_bootstrap::run_replacement_daemon"]

[ownership]
io_owns = ["upstream_template_parser", "raw_byte_hash", "frontmatter_extraction", "confined_template_loader"]
io_forbidden = ["storage_schema", "catalog_persistence", "transport", "cli_surface", "http_runtime", "local_path_heuristics"]

[dependencies]
allowed_dependents = ["atm-daemon-bootstrap"]
allowed_dependencies = ["atm-core", "sc-composer"]
forbidden_edges = [
    "atm-core -> atm-template-sc-compose",
    "atm-storage -> atm-template-sc-compose",
    "atm-storage-rusqlite -> atm-template-sc-compose",
    "atm -> atm-template-sc-compose",
    "atm-daemon -> atm-template-sc-compose",
    "atm-runtime -> atm-template-sc-compose",
    "atm-http-runtime -> atm-template-sc-compose",
]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["TemplateSource", "TemplateRoot", "serde_json::Map<String, Value>"]
response_types = ["TemplateInspection", "RenderedBody"]
error_types = ["AtmError"]
notes = ["The adapter delegates hash, frontmatter, directive inspection, and root-constrained loading to exactly-pinned sc-composer public APIs."]

[testing]
allowed_test_double_paths = ["crates/atm-core/src/boundary/template_composer.rs"]
forbidden_test_bypasses = ["atm_hash_implementation", "atm_yaml_parser", "atm_include_scanner", "atm_path_prefix_check"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-TEMPLATE-SC-COMPOSE-EDGES"]
review_gates = ["exact_upstream_pin", "upstream_golden_vectors", "core_port_only", "bootstrap_only_composition"]

[status]
state = "planned"
notes = ["AN.1 registers the boundary before the released sc-composer version is pinned. No local path or git dependency is permitted."]
