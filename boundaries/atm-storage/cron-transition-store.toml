boundary_id = "BOUNDARY-CronTransitionStore"
owner_package = "atm-storage"
owner_crate_path = "atm_storage"
name = "CronTransitionStore"

[public]
trait = "CronTransitionStore"
notes = "sealed durable transition and delivery-intent transaction boundary; exactly one logical intent is committed per applied transition. Lifecycle intent construction is internal to the committed-record issuer and is never a caller-selected recipient/body operation."

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["cron_transition_write", "cron_delivery_intent_ledger"]
io_forbidden = ["direct_sqlite_io", "process_spawn", "socket_io"]

[dependencies]
allowed_dependents = ["atm-core", "atm-daemon-bootstrap", "atm-runtime-test-support", "atm-storage-rusqlite"]
allowed_dependencies = []
forbidden_edges = ["atm-storage -> atm-core", "atm-cron -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["rusqlite::Connection"]

[contracts]
request_types = ["CronTransitionWrite", "CronDeliveryKey", "DeliveryReceipt"]
response_types = ["CronCommitResult", "Vec<CronDeliveryIntent>", "bool"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = ["crate::testing::cron_transition_store::InMemoryCronTransitionStore"]
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-CRON-TRANSITION-STORE-REFERENCES", "SCB-BOUNDARY-003"]
review_gates = ["sealed_trait", "generation_fence", "deterministic_test_doubles", "committed_lifecycle_intent_issuer"]

[status]
state = "planned"
notes = ["BK-9 freezes the atomic persistence seam; BK-10 owns its SQLite implementation.", "CronNoticeIntent is opaque. Its only issuer consumes a private committed-row record and carries boundary.forbid_external_impls so sc-lint rejects unauthorized issuer implementations."]