boundary_id = "BOUNDARY-TaskStore"
owner_package = "atm-storage"
owner_crate_path = "atm_storage"
name = "TaskStore"

[public]
trait = "TaskStore"
notes = "retained synchronous v1 compatibility reader/audit contract; canonical v2 lifecycle mutation belongs only to AsyncTaskMutationStore"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["task_event_audit_append", "task_row_read"]
io_forbidden = ["direct_sqlite_io", "message_delivery", "process_spawn", "task_state_transition"]

[dependencies]
allowed_dependents = ["atm", "atm-core", "atm-daemon-bootstrap", "atm-runtime", "atm-storage-rusqlite"]
allowed_dependencies = []
forbidden_edges = ["atm-storage -> atm-core", "atm-storage -> atm-storage-rusqlite", "atm-storage -> atm-daemon", "atm-http-runtime -> atm-storage"]

[references]
scope = "outside_owner_crate"
forbidden = ["rusqlite::Connection"]

[contracts]
request_types = ["MemberKey", "TaskId", "IsoTimestamp", "ReminderOutcome", "MessageWriteOrigin", "EscalationScope"]
response_types = ["Option<TaskRow>", "Vec<TaskRow>", "Vec<TaskEventRow>", "Vec<String>", "bool"]
error_types = ["AtmError"]
notes = [
  "state change: no TaskStore method changes canonical v2 state; AsyncTaskMutationStore owns one writer transaction per lifecycle request",
  "audit: task_events is append-only; every accepted transition, rejection, reminder, and lead notification is one row in the acting transaction",
  "replay: per (team, task_id, assignee) the Assigned/Acked/Completed rows replayed through transition reproduce tasks.state; latest Assigned.message_id == assignment_message_id; count(Reminded) == reminder_count; max(Reminded.at) == last_reminded_at; count(LeadNotified) == lead_notified_count; description is not replayable",
  "provenance: transitions apply only to MessageWriteOrigin::Local inserts and to the acknowledgement op",
  "CLI (atm) reads TaskRow/TaskEventRow through atm_storage::contract; daemon crates import through atm_core::boundary",
  "escalation recipients: list_escalation_recipients, add_escalation_recipient and remove_escalation_recipient store daemon or team-scoped ADR-040 addresses; team resolution falls back to the daemon list only when the team list is empty",
  "review-only governed source module: crates/atm-storage-rusqlite/src/writer/task_legacy_ops.rs; lint_rules, not review_gates, are the mechanically enforced controls",
]

[testing]
allowed_test_double_paths = [
    "crate::task_store::DummyTaskStore",
]
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-TASK-STORE-REFERENCES"]
review_gates = ["manual_architecture_review"]

[status]
state = "concrete_landed"
notes = ["AX.3 introduced the retained compatibility surface", "AZ.2 adds canonical logical-task mutation separately; this trait never becomes a second mutation policy"]
