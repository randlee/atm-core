boundary_id = "BOUNDARY-PeerConfigStore"
owner_package = "atm-storage"
owner_crate_path = "atm_storage"
name = "PeerConfigStore"

[public]
trait = "PeerConfigStore"
notes = "storage-neutral durable configuration for the AI.8 cross-host HTTPS control plane"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["https_interface_configuration", "certificate_reference_metadata", "trusted_peer_configuration"]
io_forbidden = ["socket_io", "tls_handshake", "message_delivery", "retry_queue", "process_spawn"]

[dependencies]
allowed_dependents = ["atm", "atm-core", "atm-daemon-bootstrap", "atm-peer-tls-interop", "atm-runtime", "atm-storage-rusqlite", "atm-storage-sqlserver-proof", "peer-tls"]
allowed_dependencies = []
forbidden_edges = ["atm-storage -> atm-core", "atm-storage -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["HttpsInterface", "LocalCertificate", "TrustedPeer"]
response_types = ["Vec<HttpsInterface>", "Option<LocalCertificate>", "Vec<TrustedPeer>"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-PEER-CONFIG-STORE-REFERENCES"]
review_gates = ["no_transport_or_delivery_logic_in_configuration_store"]

[status]
state = "concrete_landed"
notes = ["AI.8 establishes configuration only; AO2.2 authorizes peer-tls as the sole concrete mTLS byte-stream consumer. Storage retains no socket or handshake ownership."]
