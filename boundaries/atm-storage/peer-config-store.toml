boundary_id = "BOUNDARY-PeerConfigStore"
owner_package = "atm-storage"
owner_crate_path = "atm_storage"
name = "PeerConfigStore"

[public]
trait = "PeerConfigStore"
notes = "storage-neutral durable configuration for configured peer HTTP hosts and explicit canonical aliases"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["peer_http_interface_configuration", "certificate_reference_metadata", "trusted_peer_configuration", "peer_alias_configuration"]
io_forbidden = ["socket_io", "tls_handshake", "message_delivery", "retry_queue", "process_spawn"]

[dependencies]
allowed_dependents = ["atm", "atm-core", "atm-daemon", "atm-daemon-bootstrap", "atm-peer-tls-interop", "atm-runtime", "atm-storage-rusqlite"]
allowed_dependencies = []
forbidden_edges = ["atm-storage -> atm-core", "atm-storage -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["HttpsInterface", "LocalCertificate", "TrustedPeer", "PeerAliasKey", "HostName"]
response_types = ["Vec<HttpsInterface>", "Option<LocalCertificate>", "Vec<TrustedPeer>", "PeerDirectory", "Vec<(PeerAliasKey, HostName)>"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-PEER-CONFIG-STORE-REFERENCES"]
review_gates = ["no_transport_or_delivery_logic_in_configuration_store"]

[status]
state = "concrete_landed"
notes = ["AK.3 establishes canonical peer configuration; AK.4 owns the direct peer HTTP listener and transport implementation"]
