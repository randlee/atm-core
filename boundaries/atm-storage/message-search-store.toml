boundary_id = "BOUNDARY-MessageSearchStore"
owner_package = "atm-storage"
owner_crate_path = "atm_storage"
name = "MessageSearchStore"

[public]
trait = "MessageSearchStore"
notes = "sealed typed durable search capability; SQL, FTS syntax, HTTP DTOs, and renderer handles are intentionally excluded"

[implementation]
visibility = "trait_only"
constructor = "none"

[ownership]
io_owns = ["typed_search_contract"]
io_forbidden = ["direct_sqlite_io", "http_runtime", "template_rendering", "socket_io", "process_spawn"]

[dependencies]
allowed_dependents = ["atm-core", "atm-runtime", "atm-storage-rusqlite"]
allowed_dependencies = ["atm-error", "serde", "serde_json"]
forbidden_edges = ["atm-storage -> atm-core", "atm-storage -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["rusqlite::Connection", "TemplateComposer", "spawn_blocking", "MATCH "]

[contracts]
request_types = ["MessageSearchQuery", "SearchDeadline"]
response_types = ["MessageSearchPage"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = ["crate::search::InMemoryMessageSearchStore"]
forbidden_test_bypasses = ["sqlite_connection", "raw_fts_syntax"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-MESSAGE-SEARCH-STORE"]
review_gates = ["sealed_capability", "leaf_dtos_only", "no_sql_or_renderer"]

[status]
state = "concrete_landed"
