boundary_id = "BOUNDARY-AsyncAttentionScheduleStore"
owner_package = "atm-storage"
owner_crate_path = "atm_storage"
name = "AsyncAttentionScheduleStore"

[public]
trait = "AsyncAttentionScheduleStore"
notes = "Sealed Tokio-safe companion for identifier-only idle-attention schedule metadata."

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = ["atm_runtime::composition::assemble_runtime"]

[ownership]
io_owns = ["bounded_attention_cursor_read", "off_executor_attention_reservation_write"]
io_forbidden = ["write_capable_connection", "socket_io", "process_spawn", "message_delivery", "template_rendering"]

[dependencies]
allowed_dependents = ["atm-core", "atm-http-runtime", "atm-runtime", "atm-storage-rusqlite"]
allowed_dependencies = []
forbidden_edges = ["atm-storage -> atm-core", "atm-storage -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["MemberKey", "ReadDeadline", "AttentionReservationRequest", "AttentionFinalizeRequest"]
response_types = ["AttentionCursor", "AttentionReservation"]
error_types = ["ReadLaneError", "AtmError"]
notes = ["Carries only scheduler metadata and never message text, task description, a database connection, or an emitter."]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-ASYNC-ATTENTION-SCHEDULE-REFERENCES"]
review_gates = ["identifier_only", "no_sync_sqlite_on_tokio"]

[status]
state = "concrete_landed"
notes = ["AZ.4"]
