boundary_id = "BOUNDARY-ToolSenderRegistry"
owner_package = "atm-storage"
owner_crate_path = "atm_storage"
name = "ToolSenderRegistry"

[public]
trait = "ToolSenderRegistry"
notes = "sealed storage-neutral admission registry for authenticated virtual tool principals; resolving a sender never mints an emission capability. ToolRuntimeAdmissionIssuer is the ADR-001 restricted cross-crate issuance seam: only the SQLite adapter and approved in-memory double may implement it."

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["tool_sender_registration_ledger", "tool_sender_nonce_ledger"]
io_forbidden = ["process_spawn", "socket_io"]

[dependencies]
allowed_dependents = ["atm-core", "atm-daemon-bootstrap", "atm-runtime-test-support", "atm-storage-rusqlite"]
allowed_dependencies = []
forbidden_edges = ["atm-storage -> atm-core", "atm-storage -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["rusqlite::Connection"]

[contracts]
request_types = ["ToolInstallerRequest", "ToolRuntimeProof", "AtmMessageId", "MessageDigest", "IsoTimestamp"]
response_types = ["ToolInstallReceipt", "RegisteredToolSender", "ToolRuntimeAdmission"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = ["crate::testing::tool_sender_registry::InMemoryToolSenderRegistry", "crate::testing::tool_sender_registry::InMemoryToolRuntimeAdmissionIssuer"]
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-TOOL-SENDER-REGISTRY-REFERENCES"]
review_gates = ["sealed_trait", "authenticated_provenance", "deterministic_test_doubles"]

[status]
state = "concrete_landed"
notes = ["BK-9 landed the sealed port and in-memory double; BK-10 implements SQLite verification and nonce persistence.", "ToolRuntimeAdmissionIssuer is an ADR-001 workspace-convention seal. Its authorized production implementation site is crates/atm-storage-rusqlite/src/tool_sender_registry.rs when BK-10 lands; its only current implementation is the private deterministic in-memory issuer."]
