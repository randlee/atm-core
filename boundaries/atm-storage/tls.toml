boundary_id = "BOUNDARY-StorageTlsHelpers"
owner_package = "atm-storage"
owner_crate_path = "atm_storage"
name = "TlsHelpers"

[public]
facade = "TlsIdentity"
notes = "shared TLS identity, TLS 1.2/1.3 signature verification, fingerprint, and provider helpers; no transport lifecycle"

[implementation]
type = "TlsIdentity"
module = "atm_storage::tls"
visibility = "public"
constructor = "public"

[composition]
roots = []

[ownership]
io_owns = ["certificate_parsing", "certificate_fingerprint_normalization", "trusted_peer_certificate_admission", "tls_protocol_signature_verification", "rustls_provider_selection"]
io_forbidden = ["socket_io", "message_delivery", "recipient_routing", "retry_queue", "nudge_emission", "background_work", "process_spawn", "daemon_lifecycle"]

[dependencies]
allowed_dependents = ["atm-peer-tls-interop", "peer-tls"]
allowed_dependencies = ["atm-error", "rustls", "sha2", "x509-parser", "zeroize"]
forbidden_edges = ["atm-storage -> atm-core", "atm-storage -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["LocalCertificate", "TrustedPeer", "CertificateDer"]
response_types = ["TlsIdentity", "PinnedClientVerifier", "String"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["native_tls_sender", "production_listener", "peer_transport"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-STORAGE-TLS-HELPERS"]
review_gates = ["no_socket_or_delivery_capability", "one_canonical_fingerprint_helper", "no_active_interop_dependent"]

[status]
state = "concrete_landed"
notes = ["AK6 owns the shared TLS identity and protocol-verification surface, including TLS 1.2/1.3 signature checks; AO2.2 authorizes peer-tls as the sole production stream consumer while the interop crate remains inactive for production delivery."]
