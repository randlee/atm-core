boundary_id = "BOUNDARY-HookRegistrationStore"
owner_package = "atm-storage"
owner_crate_path = "atm_storage"
name = "HookRegistrationStore"

[public]
trait = "HookRegistrationStore"
notes = "storage-neutral hook registration capability (ADR-068 D1, ADR-069 D1): upsert on (team, phase, hook), any number of phases may be active per hook (D-5), disable without deletion, and the active_all snapshot source (D-8); stores read no clock and every timestamp is an argument"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["hook_registration_row_upsert", "hook_registration_row_disable", "hook_registration_row_read"]
io_forbidden = ["direct_sqlite_io", "process_spawn"]

[dependencies]
allowed_dependents = ["atm-core", "atm-daemon-bootstrap", "atm-runtime", "atm-runtime-test-support", "atm-storage-rusqlite"]
allowed_dependencies = []
forbidden_edges = ["atm-storage -> atm-core", "atm-storage -> atm-storage-rusqlite", "atm-storage -> atm-daemon", "atm-http-runtime -> atm-storage"]

[references]
scope = "outside_owner_crate"
forbidden = ["rusqlite::Connection"]

[contracts]
request_types = ["HookRegistration", "TeamName", "PhaseId", "HookName", "IsoTimestamp"]
response_types = ["HookRegistration", "Vec<HookRegistration>"]
error_types = ["AtmError"]
notes = [
  "the sealed trait is implemented directly by the atm-storage-rusqlite backend in bk-6; the in-memory double is the only other implementation",
  "HookName and PhaseId are validated at construction; a store never receives an unparsed hook or phase string",
  "a row is keyed by (team, phase, hook); disable never deletes a row, so disabled_at survives for list",
]

[testing]
allowed_test_double_paths = [
    "crate::testing::hook_registration_store::InMemoryHookRegistrationStore",
]
forbidden_test_bypasses = ["rusqlite::Connection"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-HOOK-REGISTRATION-STORE-REFERENCES"]
review_gates = ["no_cli_sqlite_lookup", "no_backend_to_core_edge_for_hook_registration_store"]

[status]
state = "stub_landed"
notes = ["bk-1 lands the sealed trait, its row and id types, the in-memory double and the contract tests; the rusqlite implementation is bk-6"]
