boundary_id = "BOUNDARY-MessageStore"
owner_package = "atm-storage"
owner_crate_path = "atm_storage"
name = "MessageStore"

[public]
trait = "MessageStore"
notes = "canonical audited shared message-storage contract introduced in AC.1"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["durable_message_state", "canonical_message_records"]
io_forbidden = ["socket_io", "process_spawn"]

[dependencies]
allowed_dependents = ["atm", "atm-core", "atm-daemon-bootstrap", "atm-daemon-client", "atm-runtime", "atm-runtime-test-support", "atm-storage-rusqlite", "atm-storage-sqlserver-proof"]
allowed_dependencies = ["atm-error"]
forbidden_edges = ["atm-storage -> atm-core"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["Message", "MessageKey", "MessageQuery"]
response_types = ["Message", "Vec<Message>", "CommittedTaskWrite<MessageAdmissionOutcome> (operation error and committed rejection rows remain independent; successful admission owns task_events)"]
error_types = ["AtmError"]

[testing]
# These modules contain inert/counting message-store doubles for unit tests.
allowed_test_double_paths = ["atm_core::ack::admission_tests", "atm_core::doctor::tests", "atm_core::service_runtime::tests", "atm_core::tests::nudge_mode", "atm_http_runtime::herdr_queue_wake::tests", "atm_runtime::mailbox_runtime::tests", "atm_runtime_test_support", "crate::contract"]
forbidden_test_bypasses = []

[status]
state = "concrete_landed"
notes = ["AC.1 created the shared audited message-storage trait in crates/atm-storage", "Phase AC moved the canonical MessageStore contract into atm-storage; consumers use this shared trait directly"]
