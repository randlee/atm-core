boundary_id = "BOUNDARY-OutboundMessageQuery"
owner_package = "atm-storage"
owner_crate_path = "atm_storage"
name = "OutboundMessageQuery"

[public]
trait = "OutboundMessageQuery"
notes = "backend-neutral query of immutable canonical outbound records; never an outbox or delivery-state store"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = []

[ownership]
io_owns = ["canonical_outbound_message_query"]
io_forbidden = ["socket_io", "tls_handshake", "nudge", "router", "retry_queue", "cursor", "receipt", "delivery_state"]

[dependencies]
allowed_dependents = ["atm-daemon", "atm-runtime", "atm-storage-rusqlite", "atm-storage-sqlserver-proof"]
allowed_dependencies = []
forbidden_edges = ["atm-storage -> atm-core", "atm-storage -> atm-storage-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["HostName", "IsoTimestamp"]
response_types = ["Vec<StoredPeerWrite>"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-OUTBOUND-MESSAGE-QUERY-REFERENCES"]
review_gates = ["no_sqlite_or_transport_types_in_query_contract", "no_delivery_state"]

[status]
state = "concrete_landed"
