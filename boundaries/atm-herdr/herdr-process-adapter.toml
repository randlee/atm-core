boundary_id = "BOUNDARY-HerdrProcessAdapter"
owner_package = "atm-herdr"
owner_crate_path = "atm_herdr"
name = "HerdrProcessAdapter"

[public]
facade = "HerdrProcessAdapter"

[implementation]
type = "HerdrProcessInvoker"
module = "atm_herdr"
visibility = "public"
constructor = "public"

[composition]
roots = ["atm_herdr::HerdrProcessInvoker::new"]

[ownership]
io_owns = [
  "tokio_process_spawn",
  "herdr_argv_construction",
  "herdr_local_socket_client",
  "herdr_json_error_parsing",
  "herdr_spawn_breaker",
]
io_forbidden = [
  "shell_interpolation",
  "tmux_send_keys",
  "sqlite",
  "daemon_request_dispatch",
]

[dependencies]
allowed_dependents = ["atm-http-runtime", "atm-daemon-bootstrap"]
allowed_dependencies = ["atm-core", "tokio", "serde_json"]
forbidden_edges = [
  "atm-core -> atm-herdr",
  "atm-storage -> atm-herdr",
  "atm-storage-rusqlite -> atm-herdr",
  "atm-herdr -> atm-daemon",
  "atm-herdr -> atm-daemon-bootstrap",
  "atm-herdr -> atm-http-runtime",
  "atm-herdr -> atm-storage-rusqlite",
]

[references]
scope = "outside_owner_crate"
forbidden = [
  "std::process::Command",
  "tmux_send_keys",
]

[contracts]
request_types = ["HerdrPromptOutcome", "HerdrWaitOutcome", "HerdrGetOutcome", "HerdrListOutcome", "rendered built-in nudge text", "HerdrClientConfig", "HerdrRosterMember"]
response_types = ["AgentSnapshot", "HerdrAgentStatus", "HerdrEndpointObservation"]
error_types = ["HerdrError", "AtmError"]
notes = [
  "HerdrProcessAdapter::notify uses fixed notification argv, never targets a pane, and receives caller-composed member/task/age/remediation text rather than a message body (HR-SAFE-003)",
  "AY.3 adds exactly two new public atm-herdr items over AY.2's private transport seam: the validated HerdrClientConfig (crates/atm-herdr/src/transport.rs, private fields, non-default values only via try_new) and the concrete HerdrDoctorProbe (crates/atm-herdr/src/doctor_probe.rs), which observes one endpoint and returns the atm-core-owned HerdrEndpointObservation (AY.3 C1, C2)",
  "AtmError is now an atm-herdr contract error type with exactly two construction sites in this crate: `From<HerdrError> for AtmError` and `HerdrClientConfig::try_new` (AtmErrorCode::ConfigParseFailed); atm-herdr adds no other AtmError construction and no new error family (AY.3 C1, C2)",
  "atm-herdr owns the exhaustive HerdrError -> HerdrDoctorState mapping and HERDR_MINIMUM_VERSION; no listed HerdrError may fall into HerdrDoctorState::Other, and it is the only crate permitted to build HerdrEndpointDisplay via from_relative (AY.3 C4, C6)",
  "AY.4 breaker-cycle escalation is owned by atm-http-runtime. It may call HerdrProcessAdapter::notify with endpoint state and remediation only, under the fixed five-second deadline; durable ATM mail remains outside atm-herdr and is never forwarded as notification text (HR-SAFE-003).",
  "semver was removed because HerdrVersion in atm-core now owns semantic-version retention for this crate (FIX-1363-R3 ruling).",
]

[testing]
allowed_test_double_paths = ["atm_herdr::testing::FakeHerdrProcessAdapter", "atm_daemon_bootstrap::received_hook_selector::BenchmarkNoopHerdrProcessAdapter"]
forbidden_test_bypasses = ["std::process::Command", "tokio::process::Command"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-HERDR-PROCESS-ADAPTER"]
review_gates = [
  "tokio-native-process-only",
  "no-shell-or-terminal-fallback",
  "per-member-session-child-environment",
]

[status]
state = "active"
notes = [
  "The benchmark-harness-only BenchmarkNoop adapter accepts active-hook wakes locally so capacity runs neither invoke Herdr nor construct its real process invoker.",
  "AQ2.6 owns the immediate steer adapter contract; AQ2.7 reuses the same adapter for wait/get queue wake behavior",
  "HerdrSession remains owned by AQ1 delivery_channel.rs; this crate consumes the session string only for child HERDR_SESSION",
  "Phase AX.2: prompt text is caller-supplied rendered built-in nudge template text; the adapter never composes or alters it (2026-09-05)",
  "Phase AZ: caller-rendered prompt text is a bounded message-id/title/optional-task-id projection and never contains immutable message text or TaskRow.description (2026-09-09)",
]
