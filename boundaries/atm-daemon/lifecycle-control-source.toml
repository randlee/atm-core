boundary_id = "BOUNDARY-LifecycleControlSource-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "LifecycleControlSourceAdapter"

[public]
facade = "LifecycleControlSource"

[implementation]
type = "LifecycleControlSourceAdapter"
module = "atm_daemon::lifecycle_control"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = [
  "atm_daemon::composition::RuntimeComposition::start",
]

[ownership]
io_owns = [
  "shutdown_request_source",
  "reload_request_source",
]
io_forbidden = [
  "sqlite",
  "transport_dispatch",
  "business_logic_dispatch",
]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = [
  "atm -> atm-daemon",
  "atm-graft -> atm-daemon",
]

[references]
scope = "outside_owner_crate"
forbidden = [
  "DaemonShutdownSignals",
  "LifecycleControlSourceAdapter",
  "signal_hook::consts::signal::SIGINT",
  "signal_hook::consts::signal::SIGTERM",
  "signal_hook::consts::signal::SIGHUP",
  "windows_services::Service",
]

[contracts]
request_types = ["shutdown request", "reload request"]
response_types = ["typed lifecycle control state"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["signal_hook::flag::register"]

[enforcement]
lint_rules = [
  "LINT-BOUNDARY-LIFECYCLE-CONTROL-SOURCE-DAEMON-EDGES",
  "LINT-BOUNDARY-LIFECYCLE-CONTROL-SOURCE-DAEMON-REFERENCES",
  "LINT-SAME-HOST-PORTABILITY",
]
review_gates = [
  "no_transport_to_os_control_leak",
  "no_dispatcher_signal_branching",
  "platform_parity_required",
  "full_windows_workspace_clippy_required",
]

[status]
state = "retired"
notes = [
  "Historical legacy-daemon record. AL.8 waits on Tokio's process signal facility in the active replacement bootstrap; this lifecycle-control adapter is reference-only until Phase AM deletes it.",
  "the accepted Phase S mapping is Unix SIGINT/SIGTERM -> terminate, Unix SIGHUP -> reload, Windows terminate events -> terminate, and Windows SIGBREAK/CTRL_BREAK_EVENT -> reload",
  "same-host daemon hosting now keeps lifecycle control behind one daemon-private contract on Unix and Windows",
  "S.4 restored full Windows workspace clippy and added a dedicated same-host-portability lint guard for the shared host shell",
]

[status.platform_support]
unix = "concrete_landed"
windows = "concrete_landed"
