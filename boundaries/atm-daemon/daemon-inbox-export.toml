boundary_id = "BOUNDARY-InboxExport-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "DaemonInboxExportAdapter"

[public]
trait = "ProjectionExport"

[implementation]
type = "DaemonInboxExport"
module = "atm_daemon"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["outbound_mailbox_projection", "compatibility_surface_translation"]
io_forbidden = ["sqlite", "socket_io", "process_spawn"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = ["DaemonInboxExport"]
named_callers = ["atm_daemon::boundary_adapters::DaemonInboxExport::export_record", "atm_daemon::boundary_adapters::DaemonInboxExport::reexport_message"]

[contracts]
request_types = ["export write requests"]
response_types = ["typed export result models"]
error_types = ["AtmError"]
notes = ["ATM-authored compatibility projection updates for the same logical message must be treated as idempotent to avoid watcher/reconcile churn loops", "daemon-owned compatibility export must preserve the exact retrieval stub text chosen by the atm-core inbox-export contract", "after Yb Y.10 this adapter owns repair/rebuild mailbox rewrite only; normal runtime delivery must not downgrade append delivery into daemon-side full rewrite"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["mailbox::store::with_locked_source_files"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-INBOX-EXPORT-DAEMON-EDGES", "LINT-BOUNDARY-INBOX-EXPORT-DAEMON-REFERENCES"]
review_gates = ["no_public_impl", "no_public_constructor", "no_direct_mailbox_helper_calls", "repair_rebuild_only_reexport"]

[status]
state = "concrete_landed"
notes = ["daemon-local historical Claude compatibility helpers own the retired inbox export contract until reconcile/watch deletion lands", "send and receive compatibility writes must stay behind this adapter rather than reaching mailbox helpers directly", "watcher/reconcile handling for ATM-authored compatibility projection updates must remain idempotent under this adapter boundary", "Yb Y.10 leaves this adapter available only for explicit repair/rebuild export and removes normal-runtime append fallback into this seam"]
