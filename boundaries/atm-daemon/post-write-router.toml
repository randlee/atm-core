boundary_id = "BOUNDARY-PostWriteRouter-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "DaemonPostWriteRouter"

[public]
trait = "PostWriteRouter"

[implementation]
type = "DaemonRequestDispatcher"
module = "atm_daemon::runtime_health::peer_delivery_router"
visibility = "pub(crate)"
constructor = "pub(crate)"
allowed_imports = ["crate::peer_delivery_client::send_configured_peer_write"]
allowed_calls = [
  "self.admission_runtime_view.endpoint_for_canonical_host",
  "self.message_store.confirm_peer_delivery_batch",
  "self.peer_http_runtime_config.load_full",
  "self.runtime_health_observability.emit_event_or_warn",
  "self.runtime_health_observability.event",
  "self.emit_message_received_hook",
  "self.service_runtime.load_roster_member",
  "self.observability.as_ref",
  "self.home_dir.as_path",
]

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["post_commit_route_classification", "received_message_hook_warning_collection", "configured_direct_peer_http_write_delivery", "confirmed_direct_peer_delivery_marker"]
io_forbidden = ["sqlite", "dns", "tls", "message_delivery", "delivery_plan_construction"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["committed MessageRecord"]
response_types = ["WarningEntry[]", "configured direct peer write delivery confirmation"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-POST-WRITE-ROUTER"]
review_gates = ["shared_direct_peer_sender_only", "receiver_hook_after_persist", "hook_failure_is_success_warning"]

[status]
state = "active"
notes = ["AK.11: host-qualified writes use one shared direct peer HTTP write; the sender never emits a receiver hook.", "Every successful receiver persistence executes the sole MessageReceivedHookEmitter path before its success response is serialized. Hook failures are returned in WarningEntry[] and never turn the receive into a failure.", "An immutable duplicate delivery is logged and acknowledged without a second receiver-hook emission. The direct confirmation marker is owned through the MailStore boundary, never through a SQLite API."]
