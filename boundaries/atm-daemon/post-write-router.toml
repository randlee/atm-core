boundary_id = "BOUNDARY-PostWriteRouter-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "DaemonPostWriteRouter"

[public]
trait = "PostWriteRouter"

[implementation]
type = "DaemonRequestDispatcher"
module = "atm_daemon::runtime_health::peer_delivery_router"
visibility = "pub(crate)"
constructor = "pub(crate)"
allowed_imports = ["crate::peer_http_listener::send_peer_http_batch"]
allowed_calls = [
  "self.admission_runtime_view.endpoint_for_canonical_host",
  "self.message_store.confirm_peer_delivery_batch",
  "self.peer_http_runtime_config.load_full",
  "self.peer_resend_scheduler.load_full",
  "self.post_commit_signals.register_local_nudge",
  "self.post_commit_work_queue.signal",
  "self.runtime_health_observability.emit_event_or_warn",
  "self.runtime_health_observability.event",
  "self.signal_local_post_write",
]

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["post_commit_route_classification", "local_post_commit_signal", "configured_direct_peer_http_batch_delivery", "confirmed_direct_peer_delivery_marker"]
io_forbidden = ["sqlite", "dns", "tls", "hook_execution", "graft_delivery", "nudge_emission"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["committed MessageRecord"]
response_types = ["PostCommitWorkKey::LocalNudge signal", "configured direct peer batch delivery confirmation"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-POST-WRITE-ROUTER"]
review_gates = ["shared_direct_peer_sender_only", "no_hook_or_nudge_execution"]

[status]
state = "active"
notes = ["AK.4: host-qualified writes use the shared direct peer HTTP sender; local writes signal ordinary post-commit work only.", "AK.8: committed peer-array receipts invoke this same local post-write route item-by-item after the one durable array commit; nudge, hook, queue, and notification failures are warning-only and cannot redefine peer receive success.", "AK.10: peer receipts and hostless writes signal ordinary local post-write work and return success. A host-qualified origin selects the configured AK.9 batch sender (directly when the cache is disabled, otherwise through the optional scheduler), never signals a local nudge, and may return an AtmError after durable local admission. The direct confirmation marker is owned through the MailStore boundary, never through a SQLite API."]
