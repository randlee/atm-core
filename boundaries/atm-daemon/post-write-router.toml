boundary_id = "BOUNDARY-PostWriteRouter-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "DaemonPostWriteRouter"

[public]
trait = "PostWriteRouter"

[implementation]
type = "DaemonRequestDispatcher"
module = "atm_daemon::runtime_health::peer_delivery_router"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["post_commit_route_classification", "direct_peer_http_delivery"]
io_forbidden = ["sqlite", "dns", "tls", "hook_execution", "graft_delivery"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = []

[contracts]
request_types = ["committed MessageRecord"]
response_types = ["PostCommitWorkKey signal"]
error_types = ["none"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-POST-WRITE-ROUTER"]
review_gates = ["shared_direct_peer_sender_only", "no_hook_or_nudge_execution"]

[status]
state = "active"
notes = ["AK.4: host-qualified writes use the shared direct peer HTTP sender; local writes signal ordinary post-commit work only.", "AK.8: committed peer-array receipts invoke this same local post-write route item-by-item after the one durable array commit; nudge, hook, queue, and notification failures are warning-only and cannot redefine peer receive success."]
