boundary_id = "BOUNDARY-HostOwnership-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "HostOwnershipAdapter"

[public]
facade = "HostOwnershipAdapter"

[implementation]
type = "HostOwnershipAdapter"
module = "atm_daemon::host_ownership"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = []

[ownership]
io_owns = [
  "host_wide_lock_acquire",
  "owner_record_write",
  "stale_owner_recovery",
  "ownership_release",
]
io_forbidden = [
  "transport_dispatch",
  "sqlite",
  "business_logic_dispatch",
]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = [
  "atm -> atm-daemon",
  "atm-graft -> atm-daemon",
]

[references]
scope = "outside_owner_crate"
forbidden = ["HostOwnershipAdapter", "HostOwnershipGuard"]

[contracts]
request_types = ["host ownership acquisition inputs"]
response_types = ["typed ownership admission outcomes"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = [
  "fs2::FileExt::try_lock_exclusive",
  "fs2::FileExt::lock_exclusive",
]

[enforcement]
lint_rules = [
  "LINT-BOUNDARY-HOST-OWNERSHIP-DAEMON-EDGES",
  "LINT-BOUNDARY-HOST-OWNERSHIP-DAEMON-REFERENCES",
  "LINT-SAME-HOST-PORTABILITY",
]
review_gates = [
  "no_transport_owned_locking",
  "no_cli_owned_singleton_logic",
  "platform_parity_required",
  "full_windows_workspace_clippy_required",
]

[status]
state = "retired"
notes = [
  "Historical legacy-daemon record. AM.3 deleted RuntimeComposition; AL.8's DaemonOwnerGuard remains the active singleton gate.",
  "Phase S pulls host ownership into an explicit portability boundary so file-locking and teardown semantics can be reviewed independently on Unix and Windows",
  "the boundary uses stable permanent lock-file paths under ~/.atm/daemon/ rather than lock-path deletion as the ownership signal",
  "the preferred implementation foundation is one whole-file exclusive-lock contract on launch.lock and owner.lock",
  "owner-visible metadata is the documented pid[:token] record stored in the held lock-file contents",
  "the current extraction clears owner metadata before unlock and keeps stable lock files in place across releases on Unix and Windows",
  "singleton, stale-owner recovery, and release ordering semantics must match across supported operating systems",
  "S.4 restored full Windows workspace clippy and added a dedicated same-host-portability lint guard for the shared host shell",
]
