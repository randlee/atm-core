boundary_id = "BOUNDARY-ClientTransport-Peer"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "PeerClientTransportAdapter"

[public]
trait = "ClientTransport"

[implementation]
type = "PeerClientTransport"
module = "atm_daemon::peer_transport"
visibility = "private"
constructor = "private"

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["outbound_remote_protocol_requests", "peer_request_deadlines", "peer_response_decode"]
io_forbidden = ["sqlite", "process_spawn"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core", "atm-rusqlite", "tokio"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = ["PeerClientTransport"]

[contracts]
request_types = ["AtmProtocol requests"]
response_types = ["AtmProtocol responses"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-CLIENT-TRANSPORT-PEER-EDGES", "LINT-BOUNDARY-CLIENT-TRANSPORT-PEER-REFERENCES"]
review_gates = ["no_public_impl", "no_public_constructor", "no_cli_to_daemon_edge"]

[status]
state = "active"
notes = ["remote daemon-to-daemon delivery uses the shared AtmProtocol framing with bounded timeout/retry behavior", "the private PeerClientTransport implementation now lives in atm_daemon::peer_transport behind the runtime-owned PeerTransportRuntime wrapper and is assembled through atm_daemon::composition", "durable replay resume is keyed by message_key and backed by the host-scoped SQLite state root"]
