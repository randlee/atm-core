boundary_id = "BOUNDARY-PeerHttpAdapter-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "PeerHttpAdapter"

[public]
facade = "PeerHttpListenerSet"

[implementation]
type = "PeerHttpListenerSet"
module = "atm_daemon::peer_http_listener"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["peer_http_plain_socket_adaptation", "peer_http_translation", "peer_ingress_authentication"]
io_forbidden = ["sqlite", "message_persistence", "delivery_queue", "retry_state", "recipient_routing", "nudge_emission"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = ["PeerClientTransport", "peer_transport"]

[contracts]
request_types = ["HTTP WriteRequest"]
response_types = ["typed HTTP response"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["peer_transport", "PeerClientTransport"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-PEER-HTTP-ADAPTER-EDGES", "LINT-BOUNDARY-PEER-HTTP-ADAPTER-REFERENCES"]
review_gates = ["no_public_impl", "no_public_constructor", "no_storage_or_post_write_capability", "no_retired_frame_transport"]

[status]
state = "planned"
notes = ["Planned AK.4 forward-reference: PeerHttpListenerSet/peer_http_listener is not implemented in this branch; the retired TLS adapter has no active boundary record."]
