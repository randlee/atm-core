boundary_id = "BOUNDARY-WatchEventSource-File"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "FileWatchEventSourceAdapter"

[public]
trait = "WatchEventSource"

[implementation]
type = "FileWatchEventSource"
module = "atm_daemon"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["filesystem_watch_events"]
io_forbidden = ["sqlite", "process_spawn"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core", "atm-rusqlite"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = ["FileWatchEventSource", "notify::recommended_watcher"]

[contracts]
request_types = ["watch subscription requests"]
response_types = ["watch event batches"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["notify::recommended_watcher"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-WATCH-EVENT-SOURCE-FILE-EDGES", "LINT-BOUNDARY-WATCH-EVENT-SOURCE-FILE-REFERENCES"]
review_gates = ["no_public_impl", "no_public_constructor", "no_watch_io_outside_boundary"]

[status]
state = "stub_landed"
notes = ["raw watch event capture stays runtime-private", "crate-root daemon adapter delegates through atm_core::boundary_support and is assembled through atm_daemon::composition"]
