boundary_id = "BOUNDARY-ReconcileCoordinator-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "DaemonReconcileCoordinatorAdapter"

[public]
trait = "ReconcileCoordinator"

[implementation]
type = "DaemonReconcileCoordinator"
module = "atm_daemon"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["watch_event_coalescing", "ingress_reconcile_triggering"]
io_forbidden = ["sqlite", "process_spawn"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core", "atm-rusqlite"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = ["DaemonReconcileCoordinator"]

[contracts]
request_types = ["reconcile requests"]
response_types = ["reconcile outcomes"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-RECONCILE-COORDINATOR-DAEMON-EDGES", "LINT-BOUNDARY-RECONCILE-COORDINATOR-DAEMON-REFERENCES"]
review_gates = ["no_public_impl", "no_public_constructor", "no_store_or_transport_bypass_in_reconcile"]

[status]
state = "stub_landed"
notes = ["runtime reconcile remains separate from raw watch source implementation", "crate-root daemon adapter delegates through atm_core::boundary_support and is assembled through atm_daemon::composition"]
