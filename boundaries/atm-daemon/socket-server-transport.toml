boundary_id = "BOUNDARY-LocalHttpIngress"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "LocalHttpServerTransportAdapter"

[public]
trait = "ServerTransport"

[implementation]
type = "LocalHttpServerTransportAdapter"
module = "atm_daemon::local_tcp_transport"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_daemon::composition::RuntimeComposition::start"]

[ownership]
io_owns = ["loopback_http_accept", "http_request_receive", "http_response_send", "capability_record_publish_revoke"]
io_forbidden = ["sqlite", "process_spawn"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = [
  "LocalSocketServerTransport",
  "LocalIpcServerTransportAdapter",
  "LocalSocketListener",
  "tokio::net::UnixListener",
  "std::os::unix::net::UnixListener",
  "interprocess::local_socket::Listener",
]

[contracts]
request_types = ["AtmProtocol requests"]
response_types = ["AtmProtocol responses"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = [
  "tokio::net::UnixListener",
  "std::os::unix::net::UnixListener",
]

[enforcement]
lint_rules = [
  "LINT-BOUNDARY-LOCAL-HTTP-INGRESS-EDGES",
  "LINT-BOUNDARY-LOCAL-HTTP-INGRESS-REFERENCES",
  "LINT-SAME-HOST-PORTABILITY",
]
review_gates = [
  "no_public_impl",
  "no_public_constructor",
  "no_cli_to_daemon_edge",
  "platform_parity_required",
  "one_local_ingress_per_platform",
  "full_windows_workspace_clippy_required",
]

[status]
state = "active"
notes = [
  "The daemon has exactly one local ingress on every platform: capability-authenticated HTTP over loopback TCP.",
  "UDS, named pipes, custom frame packets, and parallel local listeners are retired and forbidden.",
]
