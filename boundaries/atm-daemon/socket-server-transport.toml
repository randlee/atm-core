boundary_id = "BOUNDARY-ServerTransport-Socket"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "LocalIpcServerTransportAdapter"

[public]
trait = "ServerTransport"

[implementation]
type = "LocalIpcServerTransportAdapter"
module = "atm_daemon::local_ipc_transport"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_daemon::composition::RuntimeComposition::start"]

[ownership]
io_owns = ["listener_accept_loop", "framed_request_receive", "framed_response_send", "stale_endpoint_artifact_cleanup"]
io_forbidden = ["sqlite", "process_spawn"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = [
  "LocalSocketServerTransport",
  "LocalIpcServerTransportAdapter",
  "tokio::net::UnixListener",
  "std::os::unix::net::UnixListener",
  "interprocess::local_socket::Listener",
]

[contracts]
request_types = ["AtmProtocol requests"]
response_types = ["AtmProtocol responses"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = [
  "tokio::net::UnixListener",
  "std::os::unix::net::UnixListener",
]

[enforcement]
lint_rules = [
  "LINT-BOUNDARY-SERVER-TRANSPORT-SOCKET-EDGES",
  "LINT-BOUNDARY-SERVER-TRANSPORT-SOCKET-REFERENCES",
  "LINT-SAME-HOST-PORTABILITY",
]
review_gates = [
  "no_public_impl",
  "no_public_constructor",
  "no_cli_to_daemon_edge",
  "platform_parity_required",
  "no_nonunix_stub_release",
  "full_windows_workspace_clippy_required",
]

[status]
state = "retired"
notes = [
  "Historical custom frame socket boundary retired by AI.6.",
  "The live local IPC adapter now carries HTTP/UDS requests into ApiRouter rather than the retired ServerTransport trait or frame packet family.",
]
