boundary_id = "BOUNDARY-RuntimeLifecycle-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "RuntimeLifecycleController"

[public]
facade = "RuntimeLifecycleController"

[implementation]
type = "RuntimeComposition"
module = "retired"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = []

[ownership]
io_owns = [
  "singleton_admission",
  "runtime_startup",
  "runtime_shutdown",
  "lifecycle_state_transitions",
]
io_forbidden = [
  "sqlite",
  "process_spawn_outside_owned_runtime_path",
  "business_logic_dispatch",
]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = [
  "atm -> atm-daemon",
  "atm-graft -> atm-daemon",
]

[references]
scope = "outside_owner_crate"
forbidden = [
  "RuntimeComposition",
  "LifecycleControlSourceAdapter",
  "HostOwnershipAdapter",
]

[contracts]
request_types = ["runtime bootstrap inputs"]
response_types = ["typed lifecycle outcomes"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["RuntimeComposition"]

[enforcement]
lint_rules = [
  "LINT-BOUNDARY-RUNTIME-LIFECYCLE-DAEMON-EDGES",
  "LINT-BOUNDARY-RUNTIME-LIFECYCLE-DAEMON-REFERENCES",
]
review_gates = [
  "no_cli_to_daemon_edge",
  "no_lifecycle_bypass",
  "no_os_branching_above_portability_adapters",
]

[status]
state = "retired"
notes = [
  "Historical legacy-daemon record. AM.3 deleted RuntimeComposition and its compose_runtime root; the active Tokio lifecycle is owned by atm-daemon-bootstrap.",
]
