boundary_id = "BOUNDARY-RuntimeLifecycle-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "RuntimeLifecycleController"

[public]
facade = "RuntimeLifecycleController"

[implementation]
type = "RuntimeComposition"
module = "atm_daemon::composition"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = [
  "atm_daemon::composition::compose_runtime",
  "atm_daemon::run_daemon",
]

[ownership]
io_owns = [
  "singleton_admission",
  "runtime_startup",
  "runtime_shutdown",
  "lifecycle_state_transitions",
]
io_forbidden = [
  "sqlite",
  "process_spawn_outside_owned_runtime_path",
  "business_logic_dispatch",
]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core", "atm-rusqlite"]
forbidden_edges = [
  "atm -> atm-daemon",
  "atm-graft -> atm-daemon",
]

[references]
scope = "outside_owner_crate"
forbidden = [
  "RuntimeComposition",
  "DaemonShutdownSignals",
  "SingletonGuard",
]

[contracts]
request_types = ["runtime bootstrap inputs"]
response_types = ["typed lifecycle outcomes"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["RuntimeComposition"]

[enforcement]
lint_rules = [
  "LINT-BOUNDARY-RUNTIME-LIFECYCLE-DAEMON-EDGES",
  "LINT-BOUNDARY-RUNTIME-LIFECYCLE-DAEMON-REFERENCES",
]
review_gates = [
  "no_cli_to_daemon_edge",
  "no_lifecycle_bypass",
]

[status]
state = "active"
notes = [
  "lifecycle controller is a daemon-private control-plane facade rather than a shared cross-crate trait",
  "production-readiness review must cover this struct explicitly because B-003 originated here",
  "R.13 wired host-wide admission, lifecycle transitions, and startup/shutdown ownership through this control-plane facade",
  "crate-private helper methods are intentional so run_daemon and lifecycle tests can enter the single owned runtime path without exposing it cross-crate",
]
