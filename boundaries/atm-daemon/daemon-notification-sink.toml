boundary_id = "BOUNDARY-NotificationSink-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "DaemonNotificationSinkAdapter"

[public]
trait = "NotificationSink"
notes = "Historical daemon boundary record only. Phase AD AD.5 removed the daemon-owned NotificationSink adapter and notification worker."

[implementation]
type = "DaemonNotificationSink"
module = "atm_daemon::boundary_adapters"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = []

[ownership]
io_owns = ["outbound_notification_delivery"]
io_forbidden = ["sqlite", "socket_io"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = ["DaemonNotificationSink", "std::process::Command"]

[contracts]
request_types = ["notification payload requests"]
response_types = ["notification delivery results"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["std::process::Command"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-NOTIFICATION-SINK-DAEMON-EDGES", "LINT-BOUNDARY-NOTIFICATION-SINK-DAEMON-REFERENCES"]
review_gates = ["no_public_impl", "no_process_spawn_outside_notification_boundary"]

[status]
state = "retired"
notes = ["Phase AD AD.5 deleted the daemon-owned NotificationSink adapter and notification worker runtime.", "Daemon post-send behavior now appends notification events directly at the event site and no accepted composition root assembles this adapter."]
