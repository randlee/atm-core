boundary_id = "BOUNDARY-ConfigIngress-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "DaemonConfigIngressAdapter"

[public]
trait = "ConfigIngress"

[implementation]
type = "DaemonConfigIngress"
module = "atm_daemon"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["persisted_config_loading", "config_document_validation"]
io_forbidden = ["sqlite", "socket_io", "process_spawn"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon", "atm-daemon -> atm-rusqlite"]

[references]
scope = "outside_owner_crate"
forbidden = ["DaemonConfigIngress"]

[contracts]
request_types = ["config load requests"]
response_types = ["typed ATM config models"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["std::fs::read_to_string"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-CONFIG-INGRESS-DAEMON-EDGES", "LINT-BOUNDARY-CONFIG-INGRESS-DAEMON-REFERENCES"]
review_gates = ["no_public_impl", "no_public_constructor", "no_direct_config_parser_calls"]

[status]
state = "active"
notes = ["atm_core owns the contract; daemon runtime now supplies the crate-root adapter implementation", "composition must continue to avoid a direct atm-daemon -> atm-rusqlite dependency"]
