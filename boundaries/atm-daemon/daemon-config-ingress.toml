boundary_id = "BOUNDARY-ConfigIngress-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "DaemonConfigIngressAdapter"

[public]
trait = "ConfigIngress"

[implementation]
type = "DaemonConfigIngress"
module = "atm_daemon"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["persisted_config_loading", "config_document_validation"]
io_forbidden = ["sqlite", "socket_io", "process_spawn"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = ["DaemonConfigIngress"]

[contracts]
request_types = ["workspace config load requests"]
response_types = ["typed ATM workspace config models"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = ["std::fs::read_to_string"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-CONFIG-INGRESS-DAEMON-EDGES", "LINT-BOUNDARY-CONFIG-INGRESS-DAEMON-REFERENCES", "SCB-CONFIG-002"]
review_gates = ["no_public_impl", "no_public_constructor", "no_direct_config_parser_calls", "no_generic_runtime_team_lookup"]

[status]
state = "retired"
notes = ["Historical legacy-daemon record. AL.8 routes retained configuration-bearing requests through the backend-neutral replacement runtime; this adapter is reference-only until Phase AM deletes it."]
