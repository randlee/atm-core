forbidden_test_bypasses = ["mailbox::store::observe_source_files"]

[enforcement]
lint_rules = ["LINT-BOUNDARY-INBOX-INGRESS-DAEMON-EDGES", "LINT-BOUNDARY-INBOX-INGRESS-DAEMON-REFERENCES"]
review_gates = ["no_public_impl", "no_public_constructor", "no_direct_mailbox_helper_calls"]

[status]
