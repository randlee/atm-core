boundary_id = "BOUNDARY-StatusSource-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "DaemonStatusSourceAdapter"

[public]
trait = "StatusSource"

[implementation]
type = "DaemonStatusSource"
module = "atm_daemon"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["runtime_status_snapshots", "status_event_delivery"]
io_forbidden = ["sqlite", "socket_io"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = ["DaemonStatusSource"]

[contracts]
request_types = ["status source requests"]
response_types = ["status snapshot batches", "NotificationWorkerLiveness", "RuntimeHealthSnapshot"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-STATUS-SOURCE-DAEMON-EDGES", "LINT-BOUNDARY-STATUS-SOURCE-DAEMON-REFERENCES"]
review_gates = ["no_public_impl", "no_status_leakage_into_roster_store"]

[status]
state = "active"
notes = ["crate-root daemon adapter is assembled through atm_daemon::composition", "runtime status is now served from the daemon-memory status cache rather than the atm_core::boundary_support placeholder helper", "Phase AJ adds the runtime_observation_non_authoritative review gate only when its observation implementation lands"]
