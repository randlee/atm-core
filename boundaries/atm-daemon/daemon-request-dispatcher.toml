boundary_id = "BOUNDARY-RequestDispatcher-Daemon"
owner_package = "atm-daemon"
owner_crate_path = "atm_daemon"
name = "DaemonRequestDispatcherAdapter"

[public]
trait = "RequestDispatcher"

[implementation]
type = "DaemonRequestDispatcher"
module = "atm_daemon"
visibility = "pub(crate)"
constructor = "pub(crate)"

[composition]
roots = ["atm_daemon::composition::compose_runtime"]

[ownership]
io_owns = ["runtime_request_routing"]
io_forbidden = ["sqlite", "process_spawn"]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = ["atm -> atm-daemon", "atm-graft -> atm-daemon"]

[references]
scope = "outside_owner_crate"
forbidden = ["DaemonRequestDispatcher"]

[contracts]
request_types = ["AtmProtocol requests"]
response_types = ["AtmProtocol responses"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = []

[enforcement]
lint_rules = ["LINT-BOUNDARY-REQUEST-DISPATCHER-DAEMON-EDGES", "LINT-BOUNDARY-REQUEST-DISPATCHER-DAEMON-REFERENCES"]
review_gates = ["no_socket_specific_business_logic"]

[status]
state = "retired"
notes = ["Historical RequestDispatcher trait boundary retired by AI.6.", "The live daemon dispatcher now implements atm_core::ApiRouter and routes ApiRequest variants instead of the retired custom-frame RequestDispatcher contract."]
