boundary_id = "BOUNDARY-ClientTransport-CLI"
owner_package = "atm"
owner_crate_path = "atm"
name = "LocalIpcClientTransportAdapter"

[public]
trait = "ClientTransport"

[implementation]
type = "LocalIpcClientTransportAdapter"
module = "atm::composition"
visibility = "private"
constructor = "private"

[composition]
roots = ["atm::composition::CliComposition::bootstrap"]

[ownership]
io_owns = [
  "client_request_dispatch",
  "request_response_mapping",
  "thin_cli_transport_wiring",
]
io_forbidden = [
  "sqlite",
  "process_spawn_for_notifications",
]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = [
  "atm -> atm-daemon",
  "atm -> atm-storage-rusqlite",
]

[references]
scope = "outside_owner_crate"
forbidden = [
  "LocalIpcClientTransportAdapter",
  "atm_daemon::client",
  "rusqlite::Connection",
]

[contracts]
request_types = ["AtmProtocol requests"]
response_types = ["AtmProtocol responses"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = [
  "atm_daemon::client",
  "rusqlite::Connection",
]

[enforcement]
lint_rules = [
  "LINT-BOUNDARY-CLIENT-TRANSPORT-CLI-EDGES",
  "LINT-BOUNDARY-CLIENT-TRANSPORT-CLI-REFERENCES",
]
review_gates = [
  "no_public_impl",
  "no_public_constructor",
  "no_cli_to_daemon_edge",
  "no_cli_to_sqlite_edge",
]

[status]
state = "active"
notes = [
  "thin extension clients such as atm-graft may reuse the contract shape without depending on atm internals",
  "the current Phase R implementation uses a private Unix socket adapter with connect-first daemon auto-start",
]
