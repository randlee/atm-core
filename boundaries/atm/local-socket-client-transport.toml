boundary_id = "BOUNDARY-ClientTransport-CLI"
owner_package = "atm"
owner_crate_path = "atm"
name = "LocalIpcClientTransportAdapter"

[public]
trait = "ClientTransport"

[implementation]
visibility = "trait_only"
constructor = "none"

[composition]
roots = ["atm::composition::CliComposition::bootstrap"]

[ownership]
io_owns = [
  "client_request_dispatch",
  "request_response_mapping",
  "thin_cli_transport_wiring",
]
io_forbidden = [
  "sqlite",
  "process_spawn_for_notifications",
]

[dependencies]
allowed_dependents = []
allowed_dependencies = ["atm-core"]
forbidden_edges = [
  "atm -> atm-daemon",
  "atm -> atm-storage-rusqlite",
]

[references]
scope = "outside_owner_crate"
forbidden = [
  "LocalIpcClientTransportAdapter",
  "atm_daemon::client",
  "rusqlite::Connection",
]

[contracts]
request_types = ["AtmProtocol requests"]
response_types = ["AtmProtocol responses"]
error_types = ["AtmError"]

[testing]
allowed_test_double_paths = []
forbidden_test_bypasses = [
  "atm_daemon::client",
  "rusqlite::Connection",
]

[status]
state = "retired"
notes = [
  "Historical ClientTransport trait boundary retired by AI.6.",
  "The live CLI client now uses the sealed DaemonApiClient/HTTP-over-UDS path instead of the retired local socket frame transport contract.",
]
