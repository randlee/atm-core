[atm]
default_team = "atm-dev"

[atm.idle_notify]
recipient = "team-lead"

[atm.idle_notify.agent.arch-ctm]
seconds = 60

[[atm.post_send_hooks]]
recipient = "arch-ctm"
command = ["scripts/atm-nudge.py", "arch-ctm"]

[[atm.post_send_hooks]]
recipient = "quality-mgr"
command = ["scripts/atm-nudge.py", "quality-mgr"]

[[atm.post_send_hooks]]
recipient = "team-lead"
command = ["scripts/atm-nudge.py", "team-lead"]

[plugins.atm-agent-mcp]
codex_bin = "codex"
identity = "arch-ctm"
sandbox = "workspace-write"
approval_policy = "on-failure"

[startup.team-lead]
all = ["Read /codex-orchestration SKILL.md and /triaging-findings SKILL.md",
       "Use atm_send for all messages to arch-ctm or quality-mgr" ]

[startup.arch-ctm]
all = ["Use atm_send for all messages to team-lead or quality-mgr"]

[startup.quality-mgr]
all = ["read .claude/agents/quality-mgr.md for directive",
       "Use atm_send for all messages to team-lead or arch-ctm" ]

# ── rmux: tmux session launcher ──────────────────────────────────────
[rmux]
session = "atm-dev"

[[rmux.windows]]
name = "agents"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "team-lead"
tmux_pane_id = "%0"
model = "sonnet"
color = "blue"
env = { ATM_IDENTITY = "team-lead", ATM_TEAM = "atm-dev", CLAUDE_CODE_TASK_LIST_ID = "atm-dev" }

[[rmux.windows.panes]]
name = "arch-ctm"
tmux_pane_id = "%1"
command = "codex -c features.hooks=true --yolo"
env = { ATM_IDENTITY = "arch-ctm", ATM_TEAM = "atm-dev", CLAUDE_CODE_TASK_LIST_ID = "atm-dev" }

[[rmux.windows.panes]]
name = "quality-mgr"
tmux_pane_id = "%2"
model = "sonnet"
color = "blue"
env = { ATM_IDENTITY = "quality-mgr", ATM_TEAM = "atm-dev", CLAUDE_CODE_TASK_LIST_ID = "atm-dev" }
