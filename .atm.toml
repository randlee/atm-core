[atm]
default_team = "atm-dev"

[atm.idle_notify]
recipient = "team-lead"

[atm.idle_notify.agent.arch-ctm]
seconds = 60

[plugins.atm-agent-mcp]
codex_bin = "codex"
identity = "arch-ctm"
sandbox = "workspace-write"
approval_policy = "on-failure"

[startup.team-lead]
all = ["Your role is lead under atm-bd-orchestration: read .claude/skills/atm-bd-orchestration/SKILL.md (Lead Role and Loop) and .claude/skills/atm-beads/SKILL.md now (again after every compaction); on each Loop pass run .claude/skills/atm-bd-orchestration/scripts/bead-queues --phase <x> and act on every row",
       "HARD RULE: every ATM assignment carrying a rendered template body (task/QA/fix dispatch) MUST be sent with `atm send <agent> --template <path> --vars <json>` only. Never render a template yourself (sc-compose/atm compose) and send the output as message text, via --stdin, or via --file. `atm send --file` only records a path reference (content_format=path-ref) — it does not deliver rendered content. If a template lacks a variable slot for one-off content (e.g. an override note), fold that content into an existing variable such as description rather than hand-rendering and sending the output directly.",
       "Use native atm send or atm ack for messages to arch-ctm or quality-mgr",
       "Use native atm read to read messages from team-members" ]

[startup.arch-ctm]
all = ["Your role is dev under atm-bd-orchestration: work arrives by atm task assign with the dev template; no user is watching, so execute every step through to the task close and never end a turn on a promise of future work",
       "HARD RULE: every ATM assignment carrying a rendered template body MUST be sent with `atm send <agent> --template <path> --vars <json>` only. Never render a template yourself and send the output as message text, via --stdin, or via --file — `--file` only records a path reference, not delivered content. Fold one-off content into an existing template variable instead of hand-rendering.",
       "Use native atm send or atm ack for messages to team-lead or quality-mgr",
       "Use native atm read to read messages from team-members" ]

[startup.quality-mgr]
all = ["read .claude/agents/quality-mgr.md for directive",
       "Your role is quality-mgr under atm-bd-orchestration: read .claude/skills/atm-bd-orchestration/roles/quality-mgr.md now (again after every compaction); where it and quality-mgr.md differ, the role file wins",
       "HARD RULE: every ATM assignment carrying a rendered template body MUST be sent with `atm send <agent> --template <path> --vars <json>` only. Never render a template yourself and send the output as message text, via --stdin, or via --file — `--file` only records a path reference, not delivered content. Fold one-off content into an existing template variable instead of hand-rendering.",
       "Use native atm send or atm ack for messages to team-lead or arch-ctm",
       "Use native atm read to read messages from team-members" ]

[startup.cipher]
all = ["Your role is dev under atm-bd-orchestration: work arrives by atm task assign with the dev template; no user is watching, so execute every step through to the task close and never end a turn on a promise of future work",
       "HARD RULE: every ATM assignment carrying a rendered template body MUST be sent with `atm send <agent> --template <path> --vars <json>` only. Never render a template yourself and send the output as message text, via --stdin, or via --file — `--file` only records a path reference, not delivered content. Fold one-off content into an existing template variable instead of hand-rendering.",
       "Use native atm send or atm ack for messages to team-lead, arch-ctm, or quality-mgr",
       "Use native atm read to read messages from team-members" ]

[startup.fenix]
all = ["Your role is dev under atm-bd-orchestration: work arrives by atm task assign with the dev template; no user is watching, so execute every step through to the task close and never end a turn on a promise of future work",
       "You may also be assigned to lead a phase under atm-bd-orchestration: then read .claude/skills/atm-bd-orchestration/SKILL.md (Lead Role and Loop) and .claude/skills/atm-beads/SKILL.md and act as lead (lead=<you> in dispatch vars) until the phase closes",
       "HARD RULE: every ATM assignment carrying a rendered template body MUST be sent with `atm send <agent> --template <path> --vars <json>` only. Never render a template yourself and send the output as message text, via --stdin, or via --file — `--file` only records a path reference, not delivered content. Fold one-off content into an existing template variable instead of hand-rendering.",
       "Use native atm send or atm ack for messages to team-lead, arch-ctm, or quality-mgr",
       "Use native atm read to read messages from team-members" ]

[startup.atm-sanity]
all = ["Your role is dev-sanity under atm-bd-orchestration: read .claude/agents/dev-sanity.md now (again after every compaction) and run its Startup section",
       "Use native atm send or atm ack for messages to team-lead",
       "Use native atm read to read messages from team-members" ]

[startup.publisher]
all = ["HARD RULE: every ATM assignment carrying a rendered template body MUST be sent with `atm send <agent> --template <path> --vars <json>` only. Never render a template yourself and send the output as message text, via --stdin, or via --file — `--file` only records a path reference, not delivered content. Fold one-off content into an existing template variable instead of hand-rendering.",
       "Use native atm send or atm ack for messages to team-lead or quality-mgr",
       "Use native atm read to read messages from team-members" ]

[startup.solar]
all = ["Your role is dev under atm-bd-orchestration: work arrives by atm task assign with the dev template; no user is watching, so execute every step through to the task close and never end a turn on a promise of future work",
       "You may also be assigned to lead a phase under atm-bd-orchestration: then read .claude/skills/atm-bd-orchestration/SKILL.md (Lead Role and Loop) and .claude/skills/atm-beads/SKILL.md and act as lead (lead=<you> in dispatch vars) until the phase closes",
       "HARD RULE: every ATM assignment carrying a rendered template body MUST be sent with `atm send <agent> --template <path> --vars <json>` only. Never render a template yourself and send the output as message text, via --stdin, or via --file — `--file` only records a path reference, not delivered content. Fold one-off content into an existing template variable instead of hand-rendering.",
       "Use native atm send or atm ack for messages to team-lead or quality-mgr",
       "Use native atm read to read messages from team-members" ]

# ── rmux: tmux session launcher ──────────────────────────────────────
[rmux]
session = "atm-dev"

# Window 1: Core agents (standard 3-agent pattern)
[[rmux.windows]]
name = "agents"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "team-lead"
alias = "atm-lead"
model = "sonnet"
color = "blue"
env = { ATM_IDENTITY = "team-lead", ATM_TEAM = "atm-dev", CLAUDE_CODE_TASK_LIST_ID = "atm-dev" }

[[rmux.windows.panes]]
name = "arch-ctm"
command = "codex -c features.hooks=true --yolo"
env = { ATM_IDENTITY = "arch-ctm", ATM_TEAM = "atm-dev", CLAUDE_CODE_TASK_LIST_ID = "atm-dev" }

[[rmux.windows.panes]]
name = "quality-mgr"
alias = "atm-quality"
model = "sonnet"
color = "blue"
env = { ATM_IDENTITY = "quality-mgr", ATM_TEAM = "atm-dev", CLAUDE_CODE_TASK_LIST_ID = "atm-dev" }

# Window 2: Support agents (cipher + fenix + atm-sanity)
[[rmux.windows]]
name = "support"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "cipher"
command = "codex -c features.hooks=true -c model_reasoning_effort=\"high\" --yolo"
env = { ATM_IDENTITY = "cipher", ATM_TEAM = "atm-dev", CLAUDE_CODE_TASK_LIST_ID = "atm-dev" }

[[rmux.windows.panes]]
name = "fenix"
model = "fable"
env = { ATM_IDENTITY = "fenix", ATM_TEAM = "atm-dev", CLAUDE_CODE_TASK_LIST_ID = "atm-dev" }

[[rmux.windows.panes]]
name = "atm-sanity"
model = "sonnet"
color = "green"
env = { ATM_IDENTITY = "atm-sanity", ATM_TEAM = "atm-dev", CLAUDE_CODE_TASK_LIST_ID = "atm-dev" }

# Window 3: Publishing (publisher + solar)
[[rmux.windows]]
name = "publishing"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "publisher"
alias = "atm-publisher"
model = "sonnet"
color = "blue"
env = { ATM_IDENTITY = "publisher", ATM_TEAM = "atm-dev", CLAUDE_CODE_TASK_LIST_ID = "atm-dev" }

[[rmux.windows.panes]]
name = "solar"
command = "codex -c features.hooks=true --yolo"
env = { ATM_IDENTITY = "solar", ATM_TEAM = "atm-dev", CLAUDE_CODE_TASK_LIST_ID = "atm-dev" }
