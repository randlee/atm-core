[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "MIT-0",
  "0BSD",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
