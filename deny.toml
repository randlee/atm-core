[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
# sc-composer pins quick-xml with no local patch path. `serde_yaml` 0.9 also
# retains unsafe-libyaml, whose advisory documents that no safe upgrade is
# available. Remove these entries when the corresponding upstream releases
# replace those transitive dependencies.
ignore = [
  "RUSTSEC-2024-0449",
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "0BSD",
  "Unicode-3.0",
  "Zlib",
  "BSD-3-Clause",
  "ISC",
  # `reqwest`'s AL.1 Rustls feature brings webpki-roots, whose root-store
  # metadata uses this permissive license.
  "CDLA-Permissive-2.0",
  ]
