[identities]
forbidden_literals = [
  "team-lead",
  "arch-ctm",
  "arch-qa",
  "arch-inj",
  "arch-obs",
  "quality-mgr",
  "publisher",
  "atm-dev",
]

[identities.production_canonical_literals]
"team-lead" = ["crates/atm-storage/src/lib.rs"]
"quality-mgr" = ["crates/atm-storage/src/lib.rs"]
"atm-dev" = ["crates/atm-storage/src/lib.rs"]

[fixed_sleep]
# Empty by default: no test file is exempt until a narrow daemon-runtime suite
# is explicitly approved and listed here.
allowed_paths = ["crates/atm-core/tests/mailbox_locking.rs"]

[portability]
config_home_env = "ATM_CONFIG_HOME"

[env_var_boundary]
# ATM_TEMP is read only through the `EnvSource` trait-method seam
# (`resolve_atm_temp`, crates/atm-core/src/atm_temp.rs), which is lint-clean
# by construction: `env.var("ATM_TEMP")` is a method call, not the
# free-function `env::var`/`std::env::var` path this lint's `ENV_CALL_RE`
# matches. Listing it here is defensive coverage only (ADR-055 "M14"): there
# is no existing offending call site to allowlist, and this catches a future
# direct `env::var("ATM_TEMP")` added outside the `EnvSource` seam.
forbidden_env_vars = [
  "ATM_TEAM",
  "ATM_IDENTITY",
  "ATM_CHAT_ID",
  "ATM_SESSION_ID",
  "ATM_PID",
  "ATM_TEMP",
]
restricted_crate_roots = ["crates/atm-core/src", "crates/atm-daemon/src"]
# Seed boundary readers. The lint expands this set transitively to include
# same-file wrappers (for example `*_or_warn`) that call these functions.
# The session/PID readers are the sole atm-core exceptions: they construct
# transient, environment-attested caller metadata; every other reader is denied.
boundary_reader_functions = [
  "read_cli_identity_from_env",
  "read_cli_team_from_env",
  "read_cli_chat_id_from_env",
  "read_cli_session_id_from_env",
  "read_cli_pid_from_env",
]

[runtime-observation-boundary]
tokens = ["ActivityObservation", "RuntimeMemberObservation", "RuntimeObservationSource"]
allowed_paths = [
  "crates/atm-core/src/ack/mod.rs",
  "crates/atm-core/src/caller_context.rs",
  "crates/atm-core/src/protocol.rs",
  "crates/atm-core/src/read/mod.rs",
  "crates/atm-core/src/read/request.rs",
  "crates/atm-core/src/send/mod.rs",
  "crates/atm-core/src/write/mod.rs",
  "crates/atm-http-runtime/src/runtime_health.rs",
  "crates/atm/src/commands/members.rs",
]

[[runtime-observation-boundary.required_positive]]
path = "crates/atm-core/src/caller_context.rs"
symbol = "ActivityObservation"

[[runtime-observation-boundary.required_positive]]
path = "crates/atm-core/src/send/mod.rs"
symbol = "WriteRequest"

[[runtime-observation-boundary.required_positive]]
path = "crates/atm-core/src/read/mod.rs"
symbol = "activity_observation"

[[runtime-observation-boundary.required_positive]]
path = "crates/atm-core/src/ack/mod.rs"
symbol = "AckRequest"

[[runtime-observation-boundary.required_positive]]
path = "crates/atm-http-runtime/src/runtime_health.rs"
symbol = "RuntimeHealth"

[line_counts]
max_total_lines = 0
max_production_lines = 1000
max_scoped_code_lines = 0

[line_counts.exclusions]
"crates/atm-core/src/mailbox/lock.rs" = "Q.6 split pending"
"crates/atm-storage-rusqlite/src/tests.rs" = "Q.6 split pending"

[cargo_shear.allowed_empty_files]
"src/config/bridge.rs" = "deferred bridge-hostname config scope; placeholder module reserved for future phase"
"src/log/filters.rs" = "deferred retained-log filter helpers; placeholder module reserved for future phase"
"src/mailbox/hash.rs" = "deferred mailbox hashing helpers; placeholder module reserved for future phase"
"src/model_registry.rs" = "deferred model-registry integration surface; placeholder module reserved for future phase"
"src/schema/permissions.rs" = "deferred permissions schema models; placeholder module reserved for future phase"
"src/schema/settings.rs" = "deferred settings schema models; placeholder module reserved for future phase"

[cargo_shear.allowed_unlinked_files]

[cargo_shear.allowed_unused_dependencies]
"crates/atm-daemon/Cargo.toml:chrono" = "The active daemon binary includes bin_support/daemon_observability.rs by path; cargo-shear does not follow that support source."
"crates/atm-daemon/Cargo.toml:sc-observability" = "The active daemon binary includes bin_support/daemon_observability.rs by path; cargo-shear does not follow that support source."
"crates/atm-daemon/Cargo.toml:sc-observability-types" = "The active daemon binary includes bin_support/daemon_observability.rs by path; cargo-shear does not follow that support source."
"crates/atm-daemon/Cargo.toml:serde_json" = "The active daemon binary includes bin_support/daemon_observability.rs by path; cargo-shear does not follow that support source."
"crates/atm-daemon/Cargo.toml:tracing" = "The active daemon binary includes bin_support/daemon_observability.rs by path; cargo-shear does not follow that support source."
"crates/atm-daemon/Cargo.toml:serial_test" = "The active daemon binary includes bin_support/daemon_observability.rs by path; cargo-shear does not follow that support source's test module."
"crates/atm-daemon/Cargo.toml:tempfile" = "The active daemon binary includes bin_support/daemon_observability.rs by path; cargo-shear does not follow that support source's test module."
"crates/atm-http-runtime/Cargo.toml:axum" = "AL.2 owns the canonical handler; AL.1 intentionally pins the framework dependency without a listener."
"crates/atm-http-runtime/Cargo.toml:hyper" = "AL.2 owns the canonical handler; AL.1 intentionally pins the framework dependency without a listener."
"crates/atm-http-runtime/Cargo.toml:reqwest" = "AL.4 owns the shared standard client; AL.1 intentionally pins the client dependency."
"crates/atm-http-runtime/Cargo.toml:rustls" = "AL.7 owns authenticated peer TLS; AL.1 intentionally pins the TLS dependency."
"Cargo.toml:axum" = "Consumed only by the AL.1 runtime placeholder pending AL.2 canonical handler work."
"Cargo.toml:hyper" = "Consumed only by the AL.1 runtime placeholder pending AL.2 canonical handler work."
"Cargo.toml:reqwest" = "Consumed only by the AL.1 runtime placeholder pending AL.4 shared client work."
"Cargo.toml:rustls" = "Consumed only by the AL.1 runtime placeholder pending AL.7 peer TLS work."

[boundaries]
doc_glob = "docs/*/boundaries.md"
toml_glob = "boundaries/*/*.toml"

# Crate-manifest policy is intentionally separate from the per-seam
# `allowed_dependencies` declarations in boundary records.  It covers every
# direct dependency section (including dev and target-specific dependencies),
# so a new package cannot bypass boundary review merely because it is not used
# by one named implementation seam.
[[boundaries.manifest_dependency_allowlists]]
owner_manifest_path = "crates/atm/Cargo.toml"
allowed_dependencies = ["anyhow", "async-trait", "atm-core", "atm-daemon-bootstrap", "atm-daemon-client", "atm-graft", "atm-http-runtime", "atm-runtime-test-support", "atm-storage", "chrono", "clap", "sc-observability", "sc-observability-types", "serde", "serde_json", "serde_yaml", "serial_test", "tempfile", "time", "tokio", "tracing", "tracing-subscriber"]

[[boundaries.manifest_dependency_allowlists]]
owner_manifest_path = "crates/atm-core/Cargo.toml"
allowed_dependencies = ["async-trait", "atm-error", "atm-runtime-test-support", "atm-storage", "base64", "chrono", "fs4", "getrandom", "interprocess", "libc", "parking_lot", "sc-lint-attributes", "semver", "serde", "serde_json", "serial_test", "tempfile", "toml", "tracing", "tracing-subscriber", "ulid", "windows-sys"]

[[boundaries.manifest_dependency_allowlists]]
owner_manifest_path = "crates/atm-error/Cargo.toml"
boundary_record_path = "boundaries/atm-error/error-codes.toml"
allowed_dependencies = ["serde", "serde_json"]

[[boundaries.manifest_dependency_allowlists]]
