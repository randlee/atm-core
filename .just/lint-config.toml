message = "atm-core may reference atm-storage-rusqlite only in dev-dependencies"

[[boundaries.manifest_section_rules]]
owner_manifest_path = "crates/atm/Cargo.toml"
dependency_package = "atm-daemon"
allowed_sections = []
message = "atm must not depend on atm-daemon"

[[boundaries.manifest_section_rules]]
owner_manifest_path = "crates/atm-core/Cargo.toml"
dependency_package = "atm-daemon"
allowed_sections = []
message = "atm-core must not depend on atm-daemon"

[[boundaries.manifest_section_rules]]
owner_manifest_path = "crates/atm-daemon/Cargo.toml"
dependency_package = "atm-storage-rusqlite"
allowed_sections = ["dependencies"]
message = "atm-daemon may depend on atm-storage-rusqlite only through the documented runtime-owned SQLite boundaries"

[version_sync.winget]
enabled = true
manifest_glob = ".winget/*.yaml"
package_version_field = "PackageVersion"
manifest_version_field = "ManifestVersion"
installer_url_field = "InstallerUrl"

[version_sync.release_wiring]
enabled = true
file = ".github/workflows/release.yml"
required_fragments = [
  "update-homebrew:",
  "repository: randlee/homebrew-tap",
  "python3 scripts/release_artifacts.py update-homebrew-formulas \\",
  "python3 scripts/release_artifacts.py validate-homebrew-formulas \\",
  "--release-dir release \\",
  "--formula homebrew-tap/Formula/agent-team-mail.rb \\",
  "--formula homebrew-tap/Formula/atm.rb",
]
