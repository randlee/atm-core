[identities]
forbidden_literals = [
  "team-lead",
  "arch-ctm",
  "arch-qa",
  "arch-inj",
  "arch-obs",
  "quality-mgr",
  "publisher",
  "atm-dev",
]

[identities.production_canonical_literals]
"team-lead" = ["crates/atm-storage/src/lib.rs"]
"quality-mgr" = ["crates/atm-storage/src/lib.rs"]
"atm-dev" = ["crates/atm-storage/src/lib.rs"]

[fixed_sleep]
# Empty by default: no test file is exempt until a narrow daemon-runtime suite
# is explicitly approved and listed here.
allowed_paths = ["crates/atm-core/tests/mailbox_locking.rs"]

[env_var_boundary]
# ATM_TEMP is read only through the `EnvSource` trait-method seam
# (`resolve_atm_temp`, crates/atm-core/src/atm_temp.rs), which is lint-clean
# by construction: `env.var("ATM_TEMP")` is a method call, not the
# free-function `env::var`/`std::env::var` path this lint's `ENV_CALL_RE`
# matches. Listing it here is defensive coverage only (ADR-055 "M14"): there
# is no existing offending call site to allowlist, and this catches a future
# direct `env::var("ATM_TEMP")` added outside the `EnvSource` seam.
forbidden_env_vars = [
  "ATM_TEAM",
  "ATM_IDENTITY",
  "ATM_CHAT_ID",
  "ATM_SESSION_ID",
  "ATM_PID",
  "ATM_TEMP",
]
restricted_crate_roots = ["crates/atm-core/src", "crates/atm-daemon/src"]
# Seed boundary readers. The lint expands this set transitively to include
# same-file wrappers (for example `*_or_warn`) that call these functions.
# The session/PID readers are the sole atm-core exceptions: they construct
# transient, environment-attested caller metadata; every other reader is denied.
boundary_reader_functions = [
  "read_cli_identity_from_env",
  "read_cli_team_from_env",
  "read_cli_chat_id_from_env",
  "read_cli_session_id_from_env",
  "read_cli_pid_from_env",
]

[runtime-observation-boundary]
tokens = ["ActivityObservation", "RuntimeMemberObservation", "RuntimeObservationSource"]
allowed_paths = [
  "crates/atm-core/src/ack/mod.rs",
  "crates/atm-core/src/caller_context.rs",
  "crates/atm-core/src/picker_projection.rs",
  "crates/atm-core/src/protocol.rs",
  "crates/atm-core/src/read/mod.rs",
  "crates/atm-core/src/read/request.rs",
  "crates/atm-core/src/send/mod.rs",
  "crates/atm-core/src/write/mod.rs",
  "crates/atm-http-runtime/src/herdr_queue_wake.rs",
  "crates/atm-http-runtime/src/runtime_health.rs",
  "crates/atm-http-runtime/src/storage_and_nudge_router.rs",
  "crates/atm-storage-rusqlite/src/roster_runtime.rs",
  "crates/atm-storage/src/contract.rs",
  "crates/atm-storage/src/lib.rs",
  "crates/atm/src/commands/members.rs",
]

[[runtime-observation-boundary.required_positive]]
path = "crates/atm-core/src/caller_context.rs"
symbol = "ActivityObservation"

[[runtime-observation-boundary.required_positive]]
path = "crates/atm-core/src/send/mod.rs"
symbol = "WriteRequest"

[[runtime-observation-boundary.required_positive]]
path = "crates/atm-core/src/read/mod.rs"
symbol = "activity_observation"

[[runtime-observation-boundary.required_positive]]
path = "crates/atm-core/src/ack/mod.rs"
symbol = "AckRequest"

[[runtime-observation-boundary.required_positive]]
path = "crates/atm-http-runtime/src/runtime_health.rs"
symbol = "RuntimeHealth"

[line_counts]
max_total_lines = 0
max_production_lines = 1000
max_scoped_code_lines = 0

[line_counts.exclusions]
"crates/atm-core/src/mailbox/lock.rs" = "Q.6 split pending"
"crates/atm-storage-rusqlite/src/tests.rs" = "Q.6 split pending"

[cargo_shear.allowed_empty_files]
"src/config/bridge.rs" = "deferred bridge-hostname config scope; placeholder module reserved for future phase"
"src/log/filters.rs" = "deferred retained-log filter helpers; placeholder module reserved for future phase"
"src/mailbox/hash.rs" = "deferred mailbox hashing helpers; placeholder module reserved for future phase"
"src/model_registry.rs" = "deferred model-registry integration surface; placeholder module reserved for future phase"
"src/schema/permissions.rs" = "deferred permissions schema models; placeholder module reserved for future phase"
"src/schema/settings.rs" = "deferred settings schema models; placeholder module reserved for future phase"

[cargo_shear.allowed_unlinked_files]

[boundaries]
doc_glob = "docs/*/boundaries.md"
toml_glob = "boundaries/*/*.toml"

[version_sync.winget]
enabled = true
manifest_glob = ".winget/*.yaml"
package_version_field = "PackageVersion"
manifest_version_field = "ManifestVersion"
installer_url_field = "InstallerUrl"

[version_sync.release_wiring]
enabled = true
file = ".github/workflows/release.yml"
required_fragments = [
  "RELEASE_ARTIFACT_MANIFEST: release/publish-artifacts.toml",
  "release_artifacts.py build-plan",
  "release_artifacts.py verify-version-lockstep",
  "release_gate.sh final origin/main \"release-candidate-",
  "release-target-matrix",
]
