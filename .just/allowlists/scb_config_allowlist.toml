[[allow]]
rule = "SCB-CONFIG-001"
path = "crates/atm-core/src/service_runtime.rs"
symbol = "load_team_config_for_doctor_compare"
why = "doctor compare-only read remains allowed while Z.11 keeps config.json drift reporting separate from canonical ATM roster truth"
sunset_sprint = "Z.11"

[[allow]]
rule = "SCB-CONFIG-001"
path = "crates/atm-core/src/config/mod.rs"
symbol = "load_claude_team_config_document"
why = "the single canonical Claude team config parser implementation remains the approved entry point for watcher ingest, doctor compare, and temporary shell-preservation seams"
sunset_sprint = "Z.11"

[[allow]]
rule = "SCB-CONFIG-001"
path = "crates/atm-core/src/config/mod.rs"
symbol = "load_team_config_reports_missing_document_distinctly"
why = "test-only parser coverage intentionally exercises the canonical Claude team config loader's missing-document contract"
sunset_sprint = "Z.11"

[[allow]]
rule = "SCB-CONFIG-001"
path = "crates/atm-daemon/src/projection_write_journal.rs"
