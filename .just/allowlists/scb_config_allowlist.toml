# Z.8 removed the startup-only config-ingress survivor; Z.11 keeps the remaining
# compare-only and projection-extra preservation reads narrowly allowlisted.

[[allow]]
rule = "SCB-CONFIG-001"
path = "crates/atm-core/src/team_admin.rs"
symbol = "load_team_projection_extra_for_member_add"
why = "temporary non-roster Claude config extra preservation while add-member still projects canonical ATM roster truth back into config.json"
